<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="780" viewBox="0 0 1320 780" role="img" aria-labelledby="title desc">
  <title id="title">SQL order repository sequence</title>
  <desc id="desc">Sequence for creating an order, reading by id, filtering by customer and status, and returning sqlkit.ErrNoRows for a missing order.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .lane { fill: #ffffff; stroke: #334155; stroke-width: 2.5; rx: 8; }
      .head { font: 700 22px "Architects Daughter", "Comic Mono", "Comic Sans MS", sans-serif; fill: #0f172a; }
      .title { font: 700 30px "Architects Daughter", "Comic Mono", "Comic Sans MS", sans-serif; fill: #0f172a; }
      .text { font: 18px "Architects Daughter", "Comic Mono", "Comic Sans MS", sans-serif; fill: #1e293b; }
      .small { font: 15px "Architects Daughter", "Comic Mono", "Comic Sans MS", sans-serif; fill: #334155; }
      .line { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 9 8; }
      .arrow { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .return { stroke: #047857; stroke-width: 3; fill: none; stroke-dasharray: 8 7; marker-end: url(#arrowGreen); }
      .err { stroke: #b91c1c; stroke-width: 3; fill: none; marker-end: url(#arrowRed); }
      .note { fill: #fefce8; stroke: #a16207; stroke-width: 2; rx: 8; }
    </style>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14" data-role="sequence" data-tip-direction="positive-x">
      <path d="M2,2 L12,7 L2,12 Z" fill="#334155" stroke-dasharray="none"/>
    </marker>
    <marker id="arrowGreen" markerWidth="16" markerHeight="16" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14" data-role="sequence" data-tip-direction="positive-x">
      <path d="M2,2 L12,7 L2,12 Z" fill="#047857" stroke-dasharray="none"/>
    </marker>
    <marker id="arrowRed" markerWidth="16" markerHeight="16" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14" data-role="sequence" data-tip-direction="positive-x">
      <path d="M2,2 L12,7 L2,12 Z" fill="#b91c1c" stroke-dasharray="none"/>
    </marker>
  </defs>
  <rect class="bg" width="1320" height="780"/>
  <text x="60" y="65" class="title">Order repository behavior, not string-only tests</text>
  <text x="60" y="102" class="text">The same repository boundary is used by the preview and by PostgreSQL-backed contract tests.</text>

  <rect x="70" y="145" width="190" height="58" class="lane"/>
  <rect x="355" y="145" width="230" height="58" class="lane"/>
  <rect x="690" y="145" width="190" height="58" class="lane"/>
  <rect x="1020" y="145" width="210" height="58" class="lane"/>
  <text x="112" y="181" class="head">Use case</text>
  <text x="396" y="181" class="head">Repository</text>
  <text x="728" y="181" class="head">sqlkit</text>
  <text x="1064" y="181" class="head">Postgres</text>

  <line x1="165" y1="204" x2="165" y2="700" class="line"/>
  <line x1="470" y1="204" x2="470" y2="700" class="line"/>
  <line x1="785" y1="204" x2="785" y2="700" class="line"/>
  <line x1="1125" y1="204" x2="1125" y2="700" class="line"/>

  <path d="M165 250 L462 250" class="arrow"/>
  <text x="205" y="235" class="small">Create(order)</text>
  <path d="M470 292 L778 292" class="arrow"/>
  <text x="506" y="277" class="small">InsertInto + validate</text>
  <path d="M785 334 L1117 334" class="arrow"/>
  <text x="850" y="319" class="small">exec insert statement</text>
  <path d="M1125 376 L173 376" class="return"/>
  <text x="430" y="361" class="small">row persisted; repository returns nil</text>

  <path d="M165 440 L462 440" class="arrow"/>
  <text x="205" y="425" class="small">FindByID(order-1001)</text>
  <path d="M470 482 L778 482" class="arrow"/>
  <text x="505" y="467" class="small">SelectFrom + QueryOne</text>
  <path d="M785 524 L1117 524" class="arrow"/>
  <text x="850" y="509" class="small">query one row</text>
  <path d="M1125 566 L173 566" class="return"/>
  <text x="430" y="551" class="small">mapped domain Order</text>

  <path d="M165 622 L462 622" class="arrow"/>
  <text x="205" y="607" class="small">List(customer,status)</text>
  <path d="M470 664 L778 664" class="arrow"/>
  <text x="505" y="649" class="small">Where clauses + QueryAll</text>
  <path d="M785 706 L1117 706" class="arrow"/>
  <text x="850" y="691" class="small">ordered rows</text>

  <rect x="700" y="215" width="500" height="92" class="note"/>
  <text x="748" y="246" class="head">Missing row path</text>
  <text x="748" y="273" class="small">FindByID delegates exactly-one cardinality</text>
  <text x="748" y="296" class="small">to sqlkit.QueryOne, which returns ErrNoRows.</text>
  <path d="M1125 610 C1045 610, 1020 595, 965 585" class="err"/>
  <text x="980" y="625" class="small">not found maps to ErrNoRows</text>
</svg>
