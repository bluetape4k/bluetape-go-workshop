<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <marker id="seq-blue" markerWidth="16" markerHeight="16" refX="15" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 16 8 L 0 16 Z" fill="#2563eb" stroke="#2563eb"/>
    </marker>
    <marker id="seq-green" markerWidth="16" markerHeight="16" refX="15" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 16 8 L 0 16 Z" fill="#059669" stroke="#059669"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font-family: "Architects Daughter", "Comic Sans MS", cursive; font-size: 52px; fill: #0f172a; }
      .subtitle { font-family: "Comic Mono", "SFMono-Regular", monospace; font-size: 24px; fill: #475569; }
      .label { font-family: "Architects Daughter", "Comic Sans MS", cursive; font-size: 32px; fill: #0f172a; }
      .small { font-family: "Comic Mono", "SFMono-Regular", monospace; font-size: 21px; fill: #334155; }
      .head { fill: #ffffff; stroke: #334155; stroke-width: 4; rx: 22; }
      .life { stroke: #94a3b8; stroke-width: 3; stroke-dasharray: 9 11; }
      .msg-blue { stroke: #2563eb; stroke-width: 6; marker-end: url(#seq-blue); stroke-linecap: round; }
      .msg-green { stroke: #059669; stroke-width: 6; marker-end: url(#seq-green); stroke-linecap: round; }
      .return { stroke: #64748b; stroke-width: 5; stroke-dasharray: 10 9; marker-end: url(#seq-blue); stroke-linecap: round; }
      .note { fill: #fff7ed; stroke: #f97316; stroke-width: 3; rx: 18; }
      .alt { fill: #fef2f2; stroke: #fca5a5; stroke-width: 3; rx: 18; }
      .ok { fill: #ecfdf5; stroke: #059669; stroke-width: 3; rx: 18; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="980"/>
  <text class="title" x="70" y="95">Cross-instance admission sequence</text>
  <text class="subtitle" x="74" y="138">Both instances call the same Redis Bloom namespace, so the second instance sees the first insert.</text>

  <rect class="head" x="85" y="180" width="220" height="92"/>
  <text class="label" x="135" y="235">Client</text>
  <rect class="head" x="415" y="180" width="250" height="92"/>
  <text class="label" x="465" y="235">Instance A</text>
  <rect class="head" x="745" y="180" width="260" height="92"/>
  <text class="label" x="795" y="235">Redis Bloom</text>
  <rect class="head" x="1090" y="180" width="250" height="92"/>
  <text class="label" x="1140" y="235">Instance B</text>

  <line class="life" x1="195" y1="272" x2="195" y2="900"/>
  <line class="life" x1="540" y1="272" x2="540" y2="900"/>
  <line class="life" x1="875" y1="272" x2="875" y2="900"/>
  <line class="life" x1="1215" y1="272" x2="1215" y2="900"/>

  <text class="small" x="235" y="335">POST event evt-1001</text>
  <line class="msg-blue" x1="205" y1="350" x2="520" y2="350"/>
  <text class="small" x="580" y="410">Put(ctx, event_id)</text>
  <line class="msg-green" x1="550" y1="425" x2="855" y2="425"/>
  <text class="small" x="930" y="485">changed is true</text>
  <line class="return" x1="855" y1="500" x2="555" y2="500"/>
  <rect class="ok" x="360" y="545" width="455" height="82"/>
  <text class="small" x="395" y="577">response: admit</text>
  <text class="small" x="395" y="607">reason: definitely_new</text>

  <text class="small" x="235" y="705">same event lands on B</text>
  <line class="msg-blue" x1="205" y1="720" x2="1195" y2="720"/>
  <text class="small" x="935" y="780">Put(ctx, event_id)</text>
  <line class="msg-green" x1="1195" y1="795" x2="895" y2="795"/>
  <text class="small" x="930" y="850">changed is false</text>
  <line class="return" x1="895" y1="865" x2="1195" y2="865"/>

  <rect class="alt" x="1115" y="880" width="365" height="78"/>
  <text class="small" x="1145" y="912">probably_seen</text>
  <text class="small" x="1145" y="942">can be a false positive</text>

  <rect class="note" x="85" y="870" width="720" height="72"/>
  <text class="small" x="120" y="912">Docker-backed tests run serially with Testcontainers Redis.</text>
</svg>
