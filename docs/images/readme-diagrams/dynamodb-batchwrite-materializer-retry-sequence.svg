<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">DynamoDB batch write retry sequence</title>
  <desc id="desc">Sequence showing 25-item chunking, unprocessed-item retry, retry exhaustion, context cancellation, and typed AWS service errors.</desc>
  <defs>
    <marker id="seq-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb" stroke="#2563eb" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="seq-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#059669" stroke="#059669" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="seq-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#dc2626" stroke="#dc2626" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Architects Daughter", "Comic Mono", "Comic Sans MS", sans-serif; fill: #132033; letter-spacing: 0; }
    .canvas { fill: #f8fafc; }
    .title { font-size: 30px; font-weight: 700; }
    .subtitle { font-size: 15px; fill: #475569; }
    .participant { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 10; }
    .blue { fill: #dbeafe; stroke: #93c5fd; stroke-width: 2; rx: 10; }
    .green { fill: #dcfce7; stroke: #86efac; stroke-width: 2; rx: 10; }
    .red { fill: #fee2e2; stroke: #fca5a5; stroke-width: 2; rx: 10; }
    .head { font-size: 16px; font-weight: 700; }
    .sub { font-size: 12px; fill: #64748b; }
    .label { font-size: 12px; fill: #334155; }
    .lifeline { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 8; }
    .msg-blue { fill: none; stroke: #2563eb; stroke-width: 3.2; marker-end: url(#seq-blue); stroke-linecap: round; stroke-linejoin: round; }
    .msg-green { fill: none; stroke: #059669; stroke-width: 3.2; marker-end: url(#seq-green); stroke-linecap: round; stroke-linejoin: round; }
    .msg-red { fill: none; stroke: #dc2626; stroke-width: 3.2; marker-end: url(#seq-red); stroke-linecap: round; stroke-linejoin: round; }
    .return { stroke-dasharray: 7 5; }
    .frame { fill: #ffffff; fill-opacity: .62; stroke: #cbd5e1; stroke-width: 2; rx: 14; }
    .frame-title { fill: #e2e8f0; stroke: #cbd5e1; stroke-width: 1.5; rx: 9; }
    .note { fill: #fff7ed; stroke: #fed7aa; stroke-width: 1.5; rx: 10; }
  </style>
  <rect class="canvas" width="1200" height="760"/>
  <text class="title" x="60" y="58">DynamoDB batch write retry sequence</text>
  <text class="subtitle" x="60" y="86">The materializer delegates chunking and retry mechanics to batchwrite while keeping domain and error policy explicit.</text>

  <rect class="blue" x="78" y="126" width="178" height="66"/>
  <text class="head" x="116" y="155">Materializer</text>
  <text class="sub" x="116" y="176">domain boundary</text>
  <rect class="green" x="360" y="126" width="178" height="66"/>
  <text class="head" x="410" y="155">WriteAll</text>
  <text class="sub" x="410" y="176">batchwrite helper</text>
  <rect class="participant" x="642" y="126" width="190" height="66"/>
  <text class="head" x="686" y="155">DynamoDB</text>
  <text class="sub" x="686" y="176">BatchWriteItem</text>
  <rect class="red" x="936" y="126" width="178" height="66"/>
  <text class="head" x="980" y="155">Caller</text>
  <text class="sub" x="980" y="176">report and error</text>

  <line class="lifeline" x1="167" y1="192" x2="167" y2="698"/>
  <line class="lifeline" x1="449" y1="192" x2="449" y2="698"/>
  <line class="lifeline" x1="737" y1="192" x2="737" y2="698"/>
  <line class="lifeline" x1="1025" y1="192" x2="1025" y2="698"/>

  <rect class="frame" x="52" y="226" width="1096" height="172"/>
  <rect class="frame-title" x="78" y="214" width="172" height="28"/>
  <text class="label" x="98" y="233">normal chunks</text>
  <path class="msg-blue" d="M 167 272 H 449"/>
  <text class="label" x="250" y="260">30 write requests</text>
  <path class="msg-green" d="M 449 314 H 737"/>
  <text class="label" x="536" y="302">25 item chunk</text>
  <path class="msg-green" d="M 449 354 H 737"/>
  <text class="label" x="544" y="342">5 item chunk</text>
  <path class="msg-green return" d="M 737 382 H 1025"/>
  <text class="label" x="818" y="370">processed=30 attempts=2</text>

  <rect class="frame" x="52" y="430" width="1096" height="188"/>
  <rect class="frame-title" x="78" y="418" width="164" height="28"/>
  <text class="label" x="98" y="437">retry paths</text>
  <path class="msg-red" d="M 737 478 H 449"/>
  <text class="label" x="520" y="466">UnprocessedItems</text>
  <path class="msg-green" d="M 449 518 H 737"/>
  <text class="label" x="528" y="506">retry only remaining</text>
  <path class="msg-red return" d="M 449 558 H 1025"/>
  <text class="label" x="610" y="546">ErrRetryExhausted wraps batchwrite.ErrUnprocessedItems</text>
  <path class="msg-red" d="M 737 594 H 1025"/>
  <text class="label" x="804" y="582">typed AWS service error preserved</text>

  <rect class="note" x="142" y="654" width="916" height="46"/>
  <text class="label" x="166" y="678">Cancellation uses caller context; Floci smoke is opt-in, while normal CI uses deterministic fakes.</text>
</svg>
