<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1260" viewBox="0 0 1680 1260" role="img" aria-labelledby="title desc">
  <title id="title">Gin audit history search sequence</title>
  <desc id="desc">Sequence from a caller through the Gin adapter and query service to HistoryReader, including the successful newest-page response and the invalid-input or deadline error alternative.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-18%" width="120%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4f83bf" stroke="#4f83bf" stroke-dasharray="none"/>
    </marker>
    <marker id="arrow-purple" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#755bc6" stroke="#755bc6" stroke-dasharray="none"/>
    </marker>
    <marker id="arrow-amber" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#b9851b" stroke="#b9851b" stroke-dasharray="none"/>
    </marker>
    <style>
      .canvas { fill: #f6f9fc; }
      .frame { fill: #ffffff; stroke: #c7d7e7; stroke-width: 2.5; filter: url(#shadow); }
      .title { font-family: "Architects Daughter", "Comic Sans MS", cursive; font-size: 40px; fill: #22344a; }
      .subtitle, .detail, .branch, .legend { font-family: "Comic Mono", monospace; fill: #536476; }
      .subtitle { font-size: 15px; }
      text.participant { font-family: "Architects Daughter", "Comic Sans MS", cursive; font-size: 23px; fill: #22344a; }
      .detail { font-size: 13px; font-weight: 700; }
      .branch { font-size: 12px; font-weight: 700; }
      .legend { font-size: 12px; }
      rect.participant { fill: #ffffff; stroke-width: 2; filter: url(#shadow); }
      .lifeline { stroke: #9aaab1; stroke-width: 2; stroke-dasharray: 7 8; }
      .activation { fill: #e6f2ec; stroke: #5b7e67; stroke-width: 1.5; }
      .seq { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .seqReturn { fill: none; stroke-width: 2.5; stroke-dasharray: 8 6; stroke-linecap: round; stroke-linejoin: round; }
      .labelPill { fill: #ffffff; stroke: #d7e0e4; stroke-width: 1.3; }
      .altBox { fill: #eef7f0; fill-opacity: 0.14; stroke: #78909c; stroke-width: 2.2; stroke-dasharray: 12 7; }
      .branchDivider { stroke: #78909c; stroke-width: 2.2; stroke-dasharray: 12 8; }
    </style>
  </defs>

  <rect class="canvas" width="1680" height="1260"/>
  <rect class="frame" x="30" y="24" width="1620" height="1204" rx="28"/>
  <text class="title" x="68" y="82">POST Audit History Search Sequence</text>
  <text class="subtitle" x="70" y="114">Strict JSON enters the Gin boundary; the service reads limit + 1 entries and returns an inclusive continuation cursor.</text>

  <g id="participant-caller">
    <rect class="participant" x="120" y="166" width="240" height="78" rx="10" stroke="#4f83bf"/>
    <text class="participant" x="240" y="213" text-anchor="middle">Caller</text>
    <line class="lifeline" x1="240" y1="244" x2="240" y2="1102"/>
  </g>
  <g id="participant-gin">
    <rect class="participant" x="500" y="166" width="250" height="78" rx="10" stroke="#755bc6"/>
    <text class="participant" x="625" y="213" text-anchor="middle">Gin Adapter</text>
    <line class="lifeline" x1="625" y1="244" x2="625" y2="1102"/>
  </g>
  <g id="participant-service">
    <rect class="participant" x="895" y="166" width="250" height="78" rx="10" stroke="#b9851b"/>
    <text class="participant" x="1020" y="213" text-anchor="middle">Query Service</text>
    <line class="lifeline" x1="1020" y1="244" x2="1020" y2="1102"/>
  </g>
  <g id="participant-reader">
    <rect class="participant" x="1295" y="166" width="250" height="78" rx="10" stroke="#3e9868"/>
    <text class="participant" x="1420" y="213" text-anchor="middle">HistoryReader</text>
    <line class="lifeline" x1="1420" y1="244" x2="1420" y2="1102"/>
  </g>

  <rect class="activation" x="617" y="300" width="16" height="754" rx="5"/>
  <rect class="activation" x="1012" y="426" width="16" height="384" rx="5"/>
  <rect class="activation" x="1412" y="546" width="16" height="136" rx="5"/>

  <g id="message-1">
    <rect class="labelPill" x="286" y="258" width="294" height="36" rx="18" stroke="#4f83bf"/>
    <circle cx="307" cy="276" r="13" fill="#eaf4f8" stroke="#4f83bf"/>
    <text class="detail" x="307" y="277" text-anchor="middle" dominant-baseline="middle" fill="#4f83bf">1</text>
    <text class="detail" x="438" y="277" text-anchor="middle" dominant-baseline="middle" fill="#4f83bf">POST /audit/history/search</text>
    <path class="seq" data-connector="message-1" d="M 240 312 L 625 312" stroke="#4f83bf" marker-end="url(#arrow-blue)"/>
  </g>

  <g id="valid-alternative">
    <rect class="altBox" x="448" y="360" width="1048" height="714" rx="18"/>
    <rect class="labelPill" x="474" y="342" width="294" height="36" rx="18"/>
    <text class="branch" x="621" y="365" text-anchor="middle">alt valid JSON and live deadline</text>

    <g id="message-2">
      <rect class="labelPill" x="685" y="386" width="276" height="36" rx="18" stroke="#755bc6"/>
      <circle cx="706" cy="404" r="13" fill="#f3ecff" stroke="#755bc6"/>
      <text class="detail" x="706" y="405" text-anchor="middle" dominant-baseline="middle" fill="#755bc6">2</text>
      <text class="detail" x="833" y="405" text-anchor="middle" dominant-baseline="middle" fill="#755bc6">Search(validated request)</text>
      <path class="seq" data-connector="message-2" d="M 625 438 L 1020 438" stroke="#755bc6" marker-end="url(#arrow-purple)"/>
    </g>

    <g id="message-3">
      <rect class="labelPill" x="1073" y="506" width="294" height="36" rx="18" stroke="#b9851b"/>
      <circle cx="1094" cy="524" r="13" fill="#fff7e8" stroke="#b9851b"/>
      <text class="detail" x="1094" y="525" text-anchor="middle" dominant-baseline="middle" fill="#b9851b">3</text>
      <text class="detail" x="1230" y="525" text-anchor="middle" dominant-baseline="middle" fill="#b9851b">Find(Query with limit + 1)</text>
      <path class="seq" data-connector="message-3" d="M 1020 558 L 1420 558" stroke="#b9851b" marker-end="url(#arrow-amber)"/>
    </g>

    <g id="message-4">
      <rect class="labelPill" x="1081" y="626" width="278" height="36" rx="18" stroke="#3e9868"/>
      <circle cx="1102" cy="644" r="13" fill="#eef7f0" stroke="#3e9868"/>
      <text class="detail" x="1102" y="645" text-anchor="middle" dominant-baseline="middle" fill="#3e9868">4</text>
      <text class="detail" x="1230" y="645" text-anchor="middle" dominant-baseline="middle" fill="#3e9868">[revision 4, 3, 2]</text>
      <path class="seqReturn" data-connector="message-4" d="M 1420 678 L 1020 678" stroke="#3e9868"/>
      <polygon points="1032,671 1020,678 1032,685" fill="#3e9868" stroke="#3e9868" stroke-dasharray="none" data-direct-solid-head="true"/>
    </g>

    <g id="message-5">
      <rect class="labelPill" x="666" y="746" width="316" height="36" rx="18" stroke="#b9851b"/>
      <circle cx="687" cy="764" r="13" fill="#fff7e8" stroke="#b9851b"/>
      <text class="detail" x="687" y="765" text-anchor="middle" dominant-baseline="middle" fill="#b9851b">5</text>
      <text class="detail" x="833" y="765" text-anchor="middle" dominant-baseline="middle" fill="#b9851b">page [4, 3], next.to_revision: 2</text>
      <path class="seqReturn" data-connector="message-5" d="M 1020 798 L 625 798" stroke="#b9851b"/>
      <polygon points="637,791 625,798 637,805" fill="#b9851b" stroke="#b9851b" stroke-dasharray="none" data-direct-solid-head="true"/>
    </g>

    <g id="message-6">
      <rect class="labelPill" x="304" y="852" width="252" height="36" rx="18" stroke="#755bc6"/>
      <circle cx="325" cy="870" r="13" fill="#f3ecff" stroke="#755bc6"/>
      <text class="detail" x="325" y="871" text-anchor="middle" dominant-baseline="middle" fill="#755bc6">6</text>
      <text class="detail" x="440" y="871" text-anchor="middle" dominant-baseline="middle" fill="#755bc6">200 JSON response</text>
      <path class="seqReturn" data-connector="message-6" d="M 625 904 L 240 904" stroke="#755bc6"/>
      <polygon points="252,897 240,904 252,911" fill="#755bc6" stroke="#755bc6" stroke-dasharray="none" data-direct-solid-head="true"/>
    </g>

    <line class="branchDivider" x1="448" y1="944" x2="1496" y2="944"/>
    <rect class="labelPill" x="474" y="926" width="304" height="36" rx="18"/>
    <text class="branch" x="626" y="949" text-anchor="middle">else invalid JSON or deadline exceeded</text>

    <g id="message-7">
      <rect class="labelPill" x="292" y="976" width="276" height="36" rx="18" stroke="#b86868"/>
      <circle cx="313" cy="994" r="13" fill="#fff0f0" stroke="#b86868"/>
      <text class="detail" x="313" y="995" text-anchor="middle" dominant-baseline="middle" fill="#9d4f4f">7</text>
      <text class="detail" x="440" y="995" text-anchor="middle" dominant-baseline="middle" fill="#9d4f4f">400 / 408 public error</text>
      <path class="seqReturn" data-connector="message-7" d="M 625 1042 L 240 1042" stroke="#b86868"/>
      <polygon points="252,1035 240,1042 252,1049" fill="#b86868" stroke="#b86868" stroke-dasharray="none" data-direct-solid-head="true"/>
    </g>
  </g>

  <g id="legend">
    <rect x="188" y="1134" width="1304" height="56" rx="14" fill="#ffffff" stroke="#d6e3ef" stroke-width="1.5"/>
    <line x1="224" y1="1162" x2="278" y2="1162" stroke="#4f83bf" stroke-width="3"/>
    <text class="legend" x="294" y="1167">color follows sender</text>
    <line x1="510" y1="1162" x2="564" y2="1162" stroke="#64748b" stroke-width="2.5" stroke-dasharray="8 6"/>
    <text class="legend" x="580" y="1167">dashed line is a return</text>
    <line x1="850" y1="1162" x2="904" y2="1162" stroke="#b86868" stroke-width="2.5" stroke-dasharray="8 6"/>
    <text class="legend" x="920" y="1167">red return is the public error path</text>
  </g>
</svg>
