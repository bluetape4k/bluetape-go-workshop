<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">ID and JWT Boundary Scenario</title>
  <desc id="desc">Six steps show a caller requesting a local demo token, signing JWT claims, submitting an order, verifying token trust, authorizing and validating the order, and creating internal UUID v7 identifiers. A lower band explains the local demo trust limits.</desc>
  <defs>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#203040" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" markerWidth="14" markerHeight="14" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" orient="auto" data-role="primary" data-tip-direction="positive-x">
      <path d="M2 2 L12 7 L2 12 Z" fill="#4f83bf" stroke-dasharray="none"/>
    </marker>
    <marker id="arrow-violet" markerWidth="14" markerHeight="14" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" orient="auto" data-role="primary" data-tip-direction="positive-x">
      <path d="M2 2 L12 7 L2 12 Z" fill="#755bc6" stroke-dasharray="none"/>
    </marker>
    <marker id="arrow-olive" markerWidth="14" markerHeight="14" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" orient="auto" data-role="primary" data-tip-direction="positive-x">
      <path d="M2 2 L12 7 L2 12 Z" fill="#6f8b45" stroke-dasharray="none"/>
    </marker>
    <style>
      .canvas { fill: #f6f9fc; }
      .frame { fill: #ffffff; stroke: #c7d7e7; stroke-width: 2; }
      .title { font-family: "Architects Daughter", "Comic Sans MS", cursive; font-size: 34px; fill: #22344a; }
      .subtitle, .mono, .band-title, .note { font-family: "Comic Mono", monospace; fill: #536476; }
      .subtitle { font-size: 14px; }
      .card-title { font-family: "Architects Daughter", "Comic Sans MS", cursive; font-size: 14px; fill: #22344a; }
      .mono { font-size: 10.5px; }
      .step { font-family: "Comic Mono", monospace; font-size: 14px; font-weight: 700; fill: #ffffff; }
      .card { stroke-width: 2; filter: url(#shadow); }
      .main-blue, .main-violet, .main-olive { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
      .main-blue { stroke: #4f83bf; }
      .main-violet { stroke: #755bc6; }
      .main-olive { stroke: #6f8b45; }
      .band-title { font-size: 12px; font-weight: 700; fill: #475569; }
      .note { font-size: 11.5px; }
      .divider { stroke: #d6e3ef; stroke-width: 1.4; }

    .syntax-keyword{fill:#7E22CE}.syntax-type{fill:#0F766E}.syntax-function{fill:#1D4ED8}.syntax-string{fill:#B45309}.syntax-number{fill:#C2410C}.syntax-comment{fill:#64748B}.syntax-operator{fill:#BE123C}</style>
  </defs>

  <rect class="canvas" width="1200" height="650"/>
  <rect class="frame" x="22" y="18" width="1156" height="614" rx="24"/>
  <text class="title" x="50" y="66">ID + JWT: Trust First, IDs Last</text>
  <text class="subtitle" x="52" y="96">Issue a local JWT, cross the protected order boundary, then create internal identifiers.</text>

  <g id="stage-1">
    <circle cx="67" cy="147" r="19" fill="#4f83bf"/>
    <text class="step" x="67" y="152" text-anchor="middle">1</text>
    <rect class="card" x="45" y="185" width="160" height="200" rx="14" fill="#e8f3ff" stroke="#4f83bf"/>
    <text class="card-title" x="125" y="226" text-anchor="middle">Request Demo Token</text>
    <text class="mono" x="125" y="270" text-anchor="middle" data-code-snippet="http"><tspan class="syntax-type">POST</tspan> <tspan class="syntax-operator">/</tspan>tokens</text>
    <text class="mono" x="129" y="300" text-anchor="end">subject</text>
    <circle cx="135" cy="296.5" r="1.6" fill="#536476"/>
    <text class="mono" x="141" y="300">role</text>
    <text class="mono" x="129" y="330" text-anchor="end">scopes</text>
    <circle cx="135" cy="326.5" r="1.6" fill="#536476"/>
    <text class="mono" x="141" y="330">ttl</text>
  </g>

  <g id="stage-2">
    <circle cx="257" cy="147" r="19" fill="#755bc6"/>
    <text class="step" x="257" y="152" text-anchor="middle">2</text>
    <rect class="card" x="235" y="185" width="160" height="200" rx="14" fill="#f1ecff" stroke="#755bc6"/>
    <text class="card-title" x="315" y="226" text-anchor="middle">Sign Claims</text>
    <text class="mono" x="302" y="262" text-anchor="end">HS256</text>
    <circle cx="308" cy="258.5" r="1.6" fill="#536476"/>
    <text class="mono" x="314" y="262" data-code-snippet="config">issuer<tspan class="syntax-operator">=</tspan></text>
    <text class="mono" x="315" y="287" text-anchor="middle">id-jwt-boundary</text>
    <text class="mono" x="315" y="322" text-anchor="middle" data-code-snippet="config">audience<tspan class="syntax-operator">=</tspan>orders<tspan class="syntax-operator">-</tspan>api</text>
  </g>

  <g id="stage-3">
    <circle cx="447" cy="147" r="19" fill="#4f83bf"/>
    <text class="step" x="447" y="152" text-anchor="middle">3</text>
    <rect class="card" x="425" y="185" width="160" height="200" rx="14" fill="#e8f3ff" stroke="#4f83bf"/>
    <text class="card-title" x="505" y="226" text-anchor="middle">Submit Order</text>
    <text class="mono" x="505" y="270" text-anchor="middle" data-code-snippet="http"><tspan class="syntax-type">POST</tspan> <tspan class="syntax-operator">/</tspan>orders</text>
    <text class="mono" x="505" y="300" text-anchor="middle">Authorization:</text>
    <text class="mono" x="505" y="330" text-anchor="middle">Bearer JWT</text>
  </g>

  <g id="stage-4">
    <circle cx="637" cy="147" r="19" fill="#755bc6"/>
    <text class="step" x="637" y="152" text-anchor="middle">4</text>
    <rect class="card" x="615" y="185" width="160" height="200" rx="14" fill="#f1ecff" stroke="#755bc6"/>
    <text class="card-title" x="695" y="226" text-anchor="middle">Verify Trust</text>
    <text class="mono" x="699" y="270" text-anchor="end">signature</text>
    <circle cx="705" cy="266.5" r="1.6" fill="#536476"/>
    <text class="mono" x="711" y="270">issuer</text>
    <text class="mono" x="686" y="310" text-anchor="end">audience</text>
    <circle cx="692" cy="306.5" r="1.6" fill="#536476"/>
    <text class="mono" x="698" y="310">expiration</text>
  </g>

  <g id="stage-5">
    <circle cx="827" cy="147" r="19" fill="#6f8b45"/>
    <text class="step" x="827" y="152" text-anchor="middle">5</text>
    <rect class="card" x="805" y="185" width="160" height="200" rx="14" fill="#f0f5e8" stroke="#6f8b45"/>
    <text class="card-title" x="885" y="226" text-anchor="middle">Authorize + Validate</text>
    <text class="mono" x="885" y="262" text-anchor="middle" data-code-snippet="config">role<tspan class="syntax-operator">=</tspan>customer</text>
    <text class="mono" x="885" y="287" text-anchor="middle" data-code-snippet="jwt-scope">orders<tspan class="syntax-operator">:</tspan>create</text>
    <text class="mono" x="864" y="322" text-anchor="end">SKU</text>
    <circle cx="870" cy="318.5" r="1.6" fill="#536476"/>
    <text class="mono" x="876" y="322">quantity</text>
  </g>

  <g id="stage-6">
    <circle cx="1017" cy="147" r="19" fill="#6f8b45"/>
    <text class="step" x="1017" y="152" text-anchor="middle">6</text>
    <rect class="card" x="995" y="185" width="160" height="200" rx="14" fill="#f0f5e8" stroke="#6f8b45"/>
    <text class="card-title" x="1075" y="226" text-anchor="middle">Create Internal IDs</text>
    <text class="mono" x="1075" y="262" text-anchor="middle">UUID v7</text>
    <text class="mono" x="1075" y="287" text-anchor="middle" data-code-snippet="go">order_id <tspan class="syntax-operator">+</tspan> request_id</text>
    <text class="mono" x="1075" y="322" text-anchor="middle">201 Created</text>
  </g>

  <path class="main-blue" data-connector="request-to-sign" d="M 205 285 H 235" marker-end="url(#arrow-blue)"/>
  <path class="main-violet" data-connector="sign-to-submit" d="M 395 285 H 425" marker-end="url(#arrow-violet)"/>
  <path class="main-blue" data-connector="submit-to-verify" d="M 585 285 H 615" marker-end="url(#arrow-blue)"/>
  <path class="main-violet" data-connector="verify-to-authorize" d="M 775 285 H 805" marker-end="url(#arrow-violet)"/>
  <path class="main-olive" data-connector="authorize-to-create" d="M 965 285 H 995" marker-end="url(#arrow-olive)"/>

  <g id="trust-notes">
    <rect x="45" y="435" width="1110" height="145" rx="18" fill="#f8fafc" stroke="#d6e3ef" stroke-width="1.6"/>
    <text class="band-title" x="70" y="469">TRUST NOTES</text>
    <line class="divider" x1="410" y1="490" x2="410" y2="552"/>
    <line class="divider" x1="790" y1="490" x2="790" y2="552"/>

    <line x1="78" y1="505" x2="112" y2="505" stroke="#755bc6" stroke-width="3" stroke-linecap="round"/>
    <text class="note" x="78" y="535">Signed claims are not encrypted</text>

    <line x1="438" y1="505" x2="472" y2="505" stroke="#6f8b45" stroke-width="3" stroke-linecap="round"/>
    <text class="note" x="438" y="535">UUIDs are identifiers, not credentials</text>

    <line x1="818" y1="505" x2="852" y2="505" stroke="#4f83bf" stroke-width="3" stroke-linecap="round"/>
    <text class="note" x="818" y="528">The fixed HMAC secret is local</text>
    <text class="note" x="818" y="550">demo material only</text>
  </g>
</svg>
