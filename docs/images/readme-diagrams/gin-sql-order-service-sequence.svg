<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100" role="img" aria-labelledby="title desc">
  <title id="title">Gin SQL order service request sequence</title>
  <desc id="desc">Create order request sequence showing Gin parsing, service validation, service-owned transaction, repository writes, PostgreSQL commit or rollback, and aggregate response.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2.2; }
      .client { fill: #eef2ff; stroke: #4338ca; stroke-width: 2.5; }
      .http { fill: #f0fdf4; stroke: #047857; stroke-width: 2.5; }
      .service { fill: #fff7ed; stroke: #c2410c; stroke-width: 2.5; }
      .repo { fill: #ecfeff; stroke: #0e7490; stroke-width: 2.5; }
      .db { fill: #fefce8; stroke: #a16207; stroke-width: 2.5; }
      .note { fill: #f8fafc; stroke: #64748b; stroke-width: 2; }
      .altOk { fill: #dcfce7; fill-opacity: .38; stroke: #047857; stroke-width: 2.2; }
      .altErr { fill: #fee2e2; fill-opacity: .34; stroke: #b91c1c; stroke-width: 2.2; }
      .divider { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 8; }
      .lifeline { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 9 7; }
      .title { font: 700 31px "Architects Daughter", "Comic Mono", "Comic Sans MS", sans-serif; fill: #0f172a; }
      .label { font: 700 21px "Architects Daughter", "Comic Mono", "Comic Sans MS", sans-serif; fill: #0f172a; }
      .text { font: 18px "Architects Daughter", "Comic Mono", "Comic Sans MS", sans-serif; fill: #1e293b; }
      .small { font: 15px "Architects Daughter", "Comic Mono", "Comic Sans MS", sans-serif; fill: #334155; }
      .tiny { font: 13px "Architects Daughter", "Comic Mono", "Comic Sans MS", sans-serif; fill: #475569; }
      .msgBlue { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrowBlue); stroke-linecap: round; stroke-linejoin: round; }
      .msgGreen { stroke: #047857; stroke-width: 3; fill: none; marker-end: url(#arrowGreen); stroke-linecap: round; stroke-linejoin: round; }
      .msgCyan { stroke: #0e7490; stroke-width: 3; fill: none; marker-end: url(#arrowCyan); stroke-linecap: round; stroke-linejoin: round; }
      .msgOrange { stroke: #c2410c; stroke-width: 3; fill: none; marker-end: url(#arrowOrange); stroke-linecap: round; stroke-linejoin: round; }
      .msgRed { stroke: #b91c1c; stroke-width: 3; fill: none; marker-end: url(#arrowRed); stroke-linecap: round; stroke-linejoin: round; }
      .return { stroke: #64748b; stroke-width: 2.6; fill: none; stroke-dasharray: 8 7; marker-end: url(#arrowGrey); stroke-linecap: round; stroke-linejoin: round; }
      .labelBox { fill: #ffffff; fill-opacity: .94; stroke: #cbd5e1; stroke-width: 1.6; }
    </style>
    <marker id="arrowBlue" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M2,2 L14,8 L2,14 Z" fill="#334155" stroke="#334155" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrowGreen" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M2,2 L14,8 L2,14 Z" fill="#047857" stroke="#047857" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrowCyan" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M2,2 L14,8 L2,14 Z" fill="#0e7490" stroke="#0e7490" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrowOrange" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M2,2 L14,8 L2,14 Z" fill="#c2410c" stroke="#c2410c" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrowRed" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M2,2 L14,8 L2,14 Z" fill="#b91c1c" stroke="#b91c1c" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrowGrey" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M2,2 L14,8 L2,14 Z" fill="#64748b" stroke="#64748b" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
