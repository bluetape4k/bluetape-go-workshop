<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1030" viewBox="0 0 1600 1030" role="img" aria-labelledby="title description">
  <title id="title">Graph abuse cluster architecture</title>
  <desc id="description">A local CLI validates an opaque fixture, owns the official Neo4j driver and released graph adapter, persists a bounded fixture through Neo4j, analyzes connected components in Go, and emits deterministic JSON.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#334155" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="12" refY="7" orient="auto" viewBox="0 0 14 14" data-role="secondary" data-tip-direction="positive-x">
      <path d="M 0 1 L 12 7 L 0 13 Z" fill="#3b6f9f" stroke-dasharray="none"/>
    </marker>
    <marker id="arrow-green" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="12" refY="7" orient="auto" viewBox="0 0 14 14" data-role="secondary" data-tip-direction="positive-x">
      <path d="M 0 1 L 12 7 L 0 13 Z" fill="#4f8a5b" stroke-dasharray="none"/>
    </marker>
    <marker id="arrow-purple" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="12" refY="7" orient="auto" viewBox="0 0 14 14" data-role="secondary" data-tip-direction="positive-x">
      <path d="M 0 1 L 12 7 L 0 13 Z" fill="#7c3aed" stroke-dasharray="none"/>
    </marker>
    <marker id="arrow-amber" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="12" refY="7" orient="auto" viewBox="0 0 14 14" data-role="secondary" data-tip-direction="positive-x">
      <path d="M 0 1 L 12 7 L 0 13 Z" fill="#b7791f" stroke-dasharray="none"/>
    </marker>
    <style>
      .title { font-family: 'Architects Daughter', cursive; font-size: 48px; fill: #203746; }
      .subtitle, .small, .legend { font-family: 'Comic Mono', monospace; fill: #526579; }
      .subtitle { font-size: 20px; }
      .region-title { font-family: 'Architects Daughter', cursive; font-size: 27px; fill: #29465b; }
      .card-title { font-family: 'Architects Daughter', cursive; font-size: 25px; fill: #213547; }
      .small { font-size: 17px; }
      .label { font-family: 'Comic Mono', monospace; font-size: 15px; font-weight: 700; }
      .region { stroke-width: 2.5; stroke-dasharray: 9 7; }
      .card { stroke-width: 3; filter: url(#shadow); }
      .connector { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect x="20" y="20" width="1560" height="990" rx="28" fill="#fffdf8" stroke="#c9d8e4" stroke-width="2"/>
  <text x="70" y="82" class="title">Opaque graph in, deterministic evidence out</text>
  <text x="72" y="118" class="subtitle">Neo4j stores one bounded fixture; released adapters move graph values; Go owns abuse policy.</text>

  <rect x="55" y="155" width="645" height="750" rx="24" fill="#f3f8fc" stroke="#9db8cb" class="region"/>
  <text x="82" y="198" class="region-title">Example application</text>
  <rect x="730" y="155" width="365" height="750" rx="24" fill="#f5f4fb" stroke="#aaa1c6" class="region"/>
  <text x="757" y="198" class="region-title">Released boundary</text>
  <rect x="1125" y="155" width="420" height="750" rx="24" fill="#f4f9f1" stroke="#98b789" class="region"/>
  <text x="1152" y="198" class="region-title">Neo4j persistence</text>

  <g data-card="fixture-builder">
    <rect x="90" y="240" width="250" height="170" rx="18" fill="#ffffff" stroke="#648198" class="card"/>
    <text x="215" y="283" text-anchor="middle" class="card-title">Fixture Builder</text>
    <text x="115" y="321" class="small">12 opaque vertices</text>
    <text x="115" y="351" class="small">10 directed edges</text>
    <text x="115" y="381" class="small">schema + endpoint checks</text>
  </g>

  <g data-card="cli-runtime">
    <rect x="400" y="240" width="250" height="170" rx="18" fill="#fff8e6" stroke="#b49342" class="card"/>
    <text x="525" y="283" text-anchor="middle" class="card-title">CLI Runtime</text>
    <text x="425" y="321" class="small">strict loopback bolt URI</text>
    <text x="425" y="351" class="small">15s operation deadline</text>
    <text x="425" y="381" class="small">3s bounded cleanup</text>
  </g>

  <g data-card="neo4j-store">
    <rect x="400" y="490" width="250" height="170" rx="18" fill="#edf8f3" stroke="#4f8067" class="card"/>
    <text x="525" y="533" text-anchor="middle" class="card-title">Neo4j Store</text>
    <text x="425" y="571" class="small">atomic reset + seed</text>
    <text x="425" y="601" class="small">vertices LIMIT 257</text>
    <text x="425" y="631" class="small">edges LIMIT 1025</text>
  </g>

  <g data-card="go-analyzer">
    <rect x="90" y="720" width="250" height="150" rx="18" fill="#eefaf9" stroke="#438f8a" class="card"/>
    <text x="215" y="763" text-anchor="middle" class="card-title">Go Analyzer</text>
    <text x="115" y="801" class="small">connected components</text>
    <text x="115" y="831" class="small">weights 5 / 3 / 1</text>
    <text x="115" y="858" class="small">deterministic ordering</text>
  </g>

  <g data-card="json-report">
    <rect x="400" y="720" width="250" height="150" rx="18" fill="#fff0ef" stroke="#bd5757" class="card"/>
    <text x="525" y="763" text-anchor="middle" class="card-title">Buffered JSON</text>
    <text x="425" y="801" class="small">2 ranked clusters</text>
    <text x="425" y="831" class="small">usr-006 isolated</text>
    <text x="425" y="858" class="small">stdout after cleanup</text>
  </g>

  <g data-card="official-driver">
    <rect x="770" y="240" width="285" height="150" rx="18" fill="#ffffff" stroke="#7a6fa3" class="card"/>
    <text x="912" y="283" text-anchor="middle" class="card-title">Official Neo4j Driver</text>
    <text x="795" y="321" class="small">caller-owned lifecycle</text>
    <text x="795" y="351" class="small">connectivity + Bolt I/O</text>
    <text x="795" y="378" class="small">closed before stdout</text>
  </g>

  <g data-card="released-client">
    <rect x="770" y="500" width="285" height="160" rx="18" fill="#eef2ff" stroke="#6678b8" class="card"/>
    <text x="912" y="543" text-anchor="middle" class="card-title">graph/neo4j.Client</text>
    <text x="795" y="581" class="small">wraps caller driver</text>
    <text x="795" y="611" class="small">ExecuteWrite</text>
    <text x="795" y="641" class="small">ReadVertices + ReadEdges</text>
  </g>

  <g data-card="neo4j-database">
    <rect x="1170" y="345" width="330" height="300" rx="20" fill="#ffffff" stroke="#4581c3" class="card"/>
    <circle cx="1335" cy="420" r="45" fill="#eaf4fb" stroke="#4581c3" stroke-width="3"/>
    <g transform="translate(1311 396) scale(2)" fill="#4581c3" aria-label="Neo4j icon">
      <path d="M9.629 13.227c-.593 0-1.139.2-1.58.533l-2.892-1.976a2.61 2.61 0 0 0 .101-.711 2.633 2.633 0 0 0-2.629-2.629A2.632 2.632 0 0 0 0 11.073a2.632 2.632 0 0 0 2.629 2.629c.593 0 1.139-.2 1.579-.533L7.1 15.145c-.063.226-.1.465-.1.711 0 .247.037.484.1.711l-2.892 1.976a2.608 2.608 0 0 0-1.579-.533A2.632 2.632 0 0 0 0 20.639a2.632 2.632 0 0 0 2.629 2.629 2.632 2.632 0 0 0 2.629-2.629c0-.247-.037-.485-.101-.711l2.892-1.976c.441.333.987.533 1.58.533a2.633 2.633 0 0 0 2.629-2.629c0-1.45-1.18-2.629-2.629-2.629ZM16.112.732c-4.72 0-7.888 2.748-7.888 8.082v3.802a3.525 3.525 0 0 1 3.071.008v-3.81c0-3.459 1.907-5.237 4.817-5.237s4.817 1.778 4.817 5.237v8.309H24V8.814C24 3.448 20.832.732 16.112.732Z"/>
    </g>
    <text x="1335" y="503" text-anchor="middle" class="card-title">Neo4j</text>
    <text x="1205" y="548" class="small">fixed fixture namespace</text>
    <text x="1205" y="580" class="small">parameterized Cypher</text>
    <text x="1205" y="612" class="small">backend ElementIDs</text>
  </g>

  <path d="M 340 325 H 400" stroke="#3b6f9f" marker-end="url(#arrow-blue)" class="connector" data-connector="validated-fixture"/>
  <text x="370" y="307" text-anchor="middle" class="label" fill="#3b6f9f">validated</text>

  <path d="M 525 410 V 490" stroke="#b7791f" marker-end="url(#arrow-amber)" class="connector" data-connector="orchestrates-store"/>
  <text x="542" y="456" class="label" fill="#b7791f">orchestrates</text>

  <path d="M 650 315 H 770" stroke="#b7791f" marker-end="url(#arrow-amber)" class="connector" data-connector="owns-driver"/>
  <text x="710" y="297" text-anchor="middle" class="label" fill="#b7791f">owns</text>

  <path d="M 650 575 H 770" stroke="#3b6f9f" marker-end="url(#arrow-blue)" class="connector" data-connector="uses-client"/>
  <text x="710" y="557" text-anchor="middle" class="label" fill="#3b6f9f">uses</text>

  <path d="M 912 500 V 390" stroke="#b7791f" marker-end="url(#arrow-amber)" class="connector" data-connector="wraps-driver"/>
  <text x="930" y="451" class="label" fill="#b7791f">wraps</text>

  <path d="M 1055 315 H 1118 Q 1138 315 1138 335 V 420 Q 1138 440 1158 440 H 1170" stroke="#4f8a5b" marker-end="url(#arrow-green)" class="connector" data-connector="bolt-io"/>
  <text x="1137" y="299" text-anchor="middle" class="label" fill="#4f8a5b">Bolt</text>

  <path d="M 400 575 H 385 Q 365 575 365 595 V 655 Q 365 675 345 675 H 235 Q 215 675 215 695 V 720" stroke="#7c3aed" marker-end="url(#arrow-purple)" class="connector" data-connector="bounded-graph"/>
  <text x="281" y="657" text-anchor="middle" class="label" fill="#7c3aed">bounded graph values</text>

  <path d="M 340 795 H 400" stroke="#7c3aed" marker-end="url(#arrow-purple)" class="connector" data-connector="deterministic-report"/>
  <text x="370" y="777" text-anchor="middle" class="label" fill="#7c3aed">report</text>

  <g class="legend">
    <line x1="95" y1="960" x2="135" y2="960" stroke="#3b6f9f" stroke-width="4" marker-end="url(#arrow-blue)"/>
    <text x="148" y="966" font-size="15">validated graph flow</text>
    <line x1="340" y1="960" x2="380" y2="960" stroke="#b7791f" stroke-width="4" marker-end="url(#arrow-amber)"/>
    <text x="393" y="966" font-size="15">runtime ownership</text>
    <line x1="585" y1="960" x2="625" y2="960" stroke="#4f8a5b" stroke-width="4" marker-end="url(#arrow-green)"/>
    <text x="638" y="966" font-size="15">persistence boundary</text>
    <line x1="870" y1="960" x2="910" y2="960" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrow-purple)"/>
    <text x="923" y="966" font-size="15">application analysis</text>
  </g>
</svg>
