<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Measured shipping quote request sequence</title>
  <desc id="desc">Sequence diagram for parsing measurements, deriving volume and dimensional weight, then returning a quote.</desc>
  <defs>
    <marker id="seq-blue" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 16 8 L 0 16 Z" fill="#2563eb" stroke="#2563eb"/>
    </marker>
    <marker id="seq-green" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 16 8 L 0 16 Z" fill="#047857" stroke="#047857"/>
    </marker>
    <style>
      .canvas { fill: #f8fafc; }
      .title { font: 30px 'Architects Daughter', 'Comic Mono', cursive; fill: #0f172a; }
      .subtitle { font: 17px 'Comic Mono', ui-monospace, monospace; fill: #475569; }
      .participant { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .participantAlt { fill: #ecfdf5; stroke: #86efac; stroke-width: 2; rx: 8; }
      .pText { font: 22px 'Architects Daughter', 'Comic Mono', cursive; fill: #111827; text-anchor: middle; }
      .life { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 8; }
      .msg { stroke: #2563eb; stroke-width: 3.5; fill: none; stroke-linecap: round; marker-end: url(#seq-blue); }
      .return { stroke: #047857; stroke-width: 3.5; fill: none; stroke-linecap: round; marker-end: url(#seq-green); }
      .label { font: 15px 'Comic Mono', ui-monospace, monospace; fill: #1e293b; }
      .region { fill: #dbeafe; fill-opacity: .22; stroke: #93c5fd; stroke-width: 1.5; rx: 8; }
      .regionText { font: 16px 'Architects Daughter', 'Comic Mono', cursive; fill: #1e40af; }
    </style>
  </defs>
  <rect class="canvas" width="1200" height="720"/>
  <text class="title" x="60" y="58">Request Sequence</text>
  <text class="subtitle" x="60" y="90">The app never strips measurements down to untyped floats before the domain decision.</text>

  <rect class="participant" x="70" y="125" width="190" height="64"/>
  <text class="pText" x="165" y="164">Client</text>
  <rect class="participant" x="330" y="125" width="190" height="64"/>
  <text class="pText" x="425" y="164">Gin Router</text>
  <rect class="participantAlt" x="590" y="125" width="190" height="64"/>
  <text class="pText" x="685" y="164">Quote Service</text>
  <rect class="participantAlt" x="850" y="125" width="230" height="64"/>
  <text class="pText" x="965" y="164">measure package</text>

  <line class="life" x1="165" y1="189" x2="165" y2="655"/>
  <line class="life" x1="425" y1="189" x2="425" y2="655"/>
  <line class="life" x1="685" y1="189" x2="685" y2="655"/>
  <line class="life" x1="965" y1="189" x2="965" y2="655"/>

  <path class="msg" d="M165 245 H425"/>
  <text class="label" x="190" y="234">POST /quotes with strings</text>

  <path class="msg" d="M425 305 H685"/>
  <text class="label" x="454" y="294">bind JSON, call Quote()</text>

  <rect class="region" x="585" y="335" width="505" height="190"/>
  <text class="regionText" x="610" y="365">typed measure work</text>

  <path class="msg" d="M685 405 H965"/>
  <text class="label" x="712" y="394">ParseLength / Parse mass</text>

  <path class="return" d="M965 455 H685"/>
  <text class="label" x="725" y="444">Measure[Length], Measure[Mass]</text>

  <path class="msg" d="M685 505 H965"/>
  <text class="label" x="716" y="494">AreaFromLength + VolumeFromAreaLength</text>

  <path class="return" d="M685 585 H425"/>
  <text class="label" x="462" y="574">QuoteResponse</text>

  <path class="return" d="M425 635 H165"/>
  <text class="label" x="190" y="624">200 or stable 400 error_code</text>
</svg>
