<svg xmlns="http://www.w3.org/2000/svg" width="1568" height="928" viewBox="-60 0 1568 928" role="img" aria-labelledby="title desc">
  <title id="title">Compensation Workflow Sequence</title>
  <desc id="desc">Best-practices sequence diagram with participant cards, lifelines, activations, numbered labels, and branch frame.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
    <marker id="arrow-call" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 13 13" data-role="sequence" data-tip-direction="positive-x"><path d="M 1.04 1.3 L 11.96 6.5 L 1.04 11.7 Z" fill="#3F7D9C" stroke="#3F7D9C" stroke-width="0" stroke-dasharray="none"/></marker>
    <marker id="arrow-return" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 13 13" data-role="sequence" data-tip-direction="positive-x"><path d="M 1.04 1.3 L 11.96 6.5 L 1.04 11.7 Z" fill="#6E8F4F" stroke="#6E8F4F" stroke-width="0" stroke-dasharray="none"/></marker>
    <marker id="arrow-async" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 13 13" data-role="sequence" data-tip-direction="positive-x"><path d="M 1.04 1.3 L 11.96 6.5 L 1.04 11.7 Z" fill="#755BC6" stroke="#755BC6" stroke-width="0" stroke-dasharray="none"/></marker>
    <marker id="arrow-fail" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 13 13" data-role="sequence" data-tip-direction="positive-x"><path d="M 1.04 1.3 L 11.96 6.5 L 1.04 11.7 Z" fill="#B86868" stroke="#B86868" stroke-width="0" stroke-dasharray="none"/></marker>
    <style>
      @font-face { font-family: 'Architects Daughter'; src: url('file:///Users/debop/Library/Fonts/ArchitectsDaughter-Regular.ttf') format('truetype'); }
      @font-face { font-family: 'Comic Mono'; src: url('file:///Users/debop/Library/Fonts/ComicMono.ttf') format('truetype'); }
      .canvas{fill:#fbfcf8}.title{font-family:'Architects Daughter';font-size:40px;fill:#263238}.subtitle,.detail,.footer{font-family:'Comic Mono';fill:#36464f}.subtitle{font-size:16px}.footer{font-size:14px;fill:#60727d}.cardTitle{font-family:'Architects Daughter';font-size:21px;fill:#1f3138}.role{font-family:'Comic Mono';font-size:12px;fill:#546a73}.card{fill:#ffffff;stroke-width:2;filter:url(#shadow)}.lifeline{stroke:#9aaab1;stroke-width:2;stroke-dasharray:7 8;stroke-linecap:round}.activation{fill:#e6f2ec;stroke:#5b7e67;stroke-width:1.5}.call,.return,.async,.fail{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.call{stroke:#3F7D9C;marker-end:url(#arrow-call)}.return{stroke:#6E8F4F;stroke-width:2.6;stroke-dasharray:8 6;marker-end:url(#arrow-return)}.async{stroke:#755BC6;marker-end:url(#arrow-async)}.fail{stroke:#B86868;marker-end:url(#arrow-fail)}.alt{fill:#eef7f0;fill-opacity:.14;stroke:#78909c;stroke-width:2.4;stroke-dasharray:12 7}.divider{stroke:#78909c;stroke-width:2;stroke-dasharray:10 8}rect.label{fill:#ffffff;stroke:#d7e0e4;stroke-width:1.3}.callLabel{stroke:#9cc2d1}.returnLabel{stroke:#b6c9a4}.asyncLabel{stroke:#b8a9d5}.failLabel{stroke:#d9abab}.badgeText,.msg{font-family:'Comic Mono';font-size:12px;font-weight:700}.msg{font-size:13px}.callText{fill:#2f6f8e}.returnText{fill:#55783F}.asyncText{fill:#674b91}.failText{fill:#9d4f4f}
    </style>
  </defs>
  <rect class="canvas" x="-60" y="0" width="1568" height="928"/>
  <text class="title" x="724" y="64" text-anchor="middle">Compensation Workflow Sequence</text>
  <text class="subtitle" x="724" y="98" text-anchor="middle">The forward runner stops on the first failure, then a reverse runner reports cleanup without replacing the original error.</text>
  <g id="participant-1"><rect class="card" x="-5" y="160" width="190" height="78" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/><text class="cardTitle" x="90" y="203" text-anchor="middle">Client</text><line class="lifeline" x1="90" y1="238" x2="90" y2="816"/></g>
  <g id="participant-2"><rect class="card" x="312" y="160" width="190" height="78" rx="10" fill="#FFF3D9" stroke="#D6A441"/><text class="cardTitle" x="407" y="203" text-anchor="middle">Handler</text><line class="lifeline" x1="407" y1="238" x2="407" y2="816"/></g>
  <g id="participant-3"><rect class="card" x="617" y="160" width="214" height="78" rx="10" fill="#EAF7EF" stroke="#58A978"/><text class="cardTitle" x="724" y="203" text-anchor="middle">Forward RunnerStopOnFailure</text><line class="lifeline" x1="724" y1="238" x2="724" y2="816"/></g>
  <g id="participant-4"><rect class="card" x="943" y="160" width="196" height="78" rx="10" fill="#F1ECFF" stroke="#8A72D6"/><text class="cardTitle" x="1041" y="203" text-anchor="middle">Stackrelease, void</text><line class="lifeline" x1="1041" y1="238" x2="1041" y2="816"/></g>
  <g id="participant-5"><rect class="card" x="1249" y="160" width="218" height="78" rx="10" fill="#FDECEF" stroke="#DC6B82"/><text class="cardTitle" x="1358" y="203" text-anchor="middle">Reverse RunnerContinueOnFailure</text><line class="lifeline" x1="1358" y1="238" x2="1358" y2="816"/></g>
  <rect class="activation" x="400" y="306" width="14" height="500" rx="6"/>
  <rect class="activation" x="717" y="306" width="14" height="164" rx="6"/>
  <rect class="activation" x="1034" y="360" width="14" height="110" rx="6"/>
  <rect class="activation" x="1351" y="706" width="14" height="56" rx="6"/>
  <rect class="alt" x="64" y="680" width="1320" height="106" rx="16"/>
  <rect class="label failLabel" x="88" y="666" width="230" height="28" rx="8"/>
  <text class="msg failText" x="203" y="685" text-anchor="middle">alt failure / branch path</text>
  <g id="message-1"><rect class="label returnLabel" x="411.2" y="288" width="308.6" height="28" rx="8"/><circle cx="429.2" cy="302" r="12" fill="#6E8F4F"/><text class="badgeText" x="429.2" y="306" text-anchor="middle" fill="#fff">1</text><text class="msg returnText" x="573.5" y="306" text-anchor="middle">Run forward Sequential(ctx)</text><path class="return" d="M 407 324 H 724"/></g>
  <g id="message-2"><rect class="label returnLabel" x="722.5" y="342" width="320" height="28" rx="8"/><circle cx="740.5" cy="356" r="12" fill="#6E8F4F"/><text class="badgeText" x="740.5" y="360" text-anchor="middle" fill="#fff">2</text><text class="msg returnText" x="890.5" y="360" text-anchor="middle">reserve-inventory pushes release</text><path class="return" d="M 724 378 H 1041"/></g>
  <g id="message-3"><rect class="label returnLabel" x="722.5" y="396" width="320" height="28" rx="8"/><circle cx="740.5" cy="410" r="12" fill="#6E8F4F"/><text class="badgeText" x="740.5" y="414" text-anchor="middle" fill="#fff">3</text><text class="msg returnText" x="890.5" y="414" text-anchor="middle">authorize-payment pushes void</text><path class="return" d="M 724 432 H 1041"/></g>
  <g id="message-4"><rect class="label failLabel" x="722.5" y="688" width="320" height="28" rx="8"/><circle cx="740.5" cy="702" r="12" fill="#B86868"/><text class="badgeText" x="740.5" y="706" text-anchor="middle" fill="#fff">4</text><text class="msg failText" x="890.5" y="706" text-anchor="middle">forward report + compensation report + original_error</text><path class="fail" d="M 1358 724 H 407"/></g>
  <g id="message-5"><rect class="label returnLabel" x="94.2" y="742" width="308.6" height="28" rx="8"/><circle cx="112.2" cy="756" r="12" fill="#6E8F4F"/><text class="badgeText" x="112.2" y="760" text-anchor="middle" fill="#fff">5</text><text class="msg returnText" x="256.5" y="760" text-anchor="middle">200 / 409 / 408 stable JSON</text><path class="return" d="M 407 778 H 90"/></g>
  <g><rect x="202.7" y="858" width="1042.6" height="42" rx="12" fill="#ffffff" stroke="#D6E3EF" stroke-width="1.6"/><text class="footer" x="724" y="885" text-anchor="middle">Caller cancellation before side effects returns cancelled; cancellation after a side effect still runs registered cleanup.</text></g>
</svg>
