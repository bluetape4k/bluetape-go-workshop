<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="860" viewBox="0 0 1500 860" role="img" aria-labelledby="title desc">
  <title id="title">Account Migration Checkpoint Restart Architecture</title>
  <desc id="desc">Architecture for the local batch account migration using batch.Job, batch.Step, a checkpoint reader, account processor, target writer, checkpoint store, and target store.</desc>
  <defs>
    <marker id="arch-blue" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polygon points="1,1 7,4 1,7" fill="#3f6f8f"/></marker>
    <marker id="arch-green" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polygon points="1,1 7,4 1,7" fill="#5d8a62"/></marker>
    <marker id="arch-purple" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polygon points="1,1 7,4 1,7" fill="#8a6bb0"/></marker>
    <marker id="arch-amber" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polygon points="1,1 7,4 1,7" fill="#c07a42"/></marker>
    <style>
      @font-face { font-family: 'Architects Daughter'; src: url('file:///Users/debop/Library/Fonts/ArchitectsDaughter-Regular.ttf') format('truetype'); }
      @font-face { font-family: 'Comic Mono'; src: url('file:///Users/debop/Library/Fonts/ComicMono.ttf') format('truetype'); }
      .title { font-family: 'Architects Daughter'; font-size: 38px; fill: #24313f; }
      .subtitle, .detail, .label, .footer { font-family: 'Comic Mono'; fill: #536d7d; }
      .subtitle { font-size: 15px; }
      .layer-label, .card-title { font-family: 'Architects Daughter'; fill: #24313f; }
      .layer-label { font-size: 22px; }
      .card-title { font-size: 23px; }
      .detail { font-size: 13px; }
      .label { font-size: 12px; }
      .footer { font-size: 13px; }
      .frame { fill: #fffefa; stroke: #d8e2e8; stroke-width: 2; rx: 20; }
      .layer { fill: #ffffff; stroke: #d8e2e8; stroke-width: 2; rx: 16; }
      .blue { fill: none; stroke: #3f6f8f; stroke-width: 3; marker-end: url(#arch-blue); }
      .green { fill: none; stroke: #5d8a62; stroke-width: 3; marker-end: url(#arch-green); }
      .purple { fill: none; stroke: #8a6bb0; stroke-width: 3; marker-end: url(#arch-purple); }
      .amber { fill: none; stroke: #c07a42; stroke-width: 3; marker-end: url(#arch-amber); }
    </style>
  </defs>
  <rect width="1500" height="860" fill="#fbfaf6"/>
  <rect class="frame" x="44" y="34" width="1412" height="792"/>
  <text class="title" x="750" y="82" text-anchor="middle">Account Migration Checkpoint Restart Architecture</text>
  <text class="subtitle" x="750" y="116" text-anchor="middle">The replaceable checkpoint store and target store keep the restart contract visible and testable.</text>

  <rect class="layer" x="84" y="158" width="300" height="590"/>
  <text class="layer-label" x="234" y="196" text-anchor="middle">Runnable demo</text>
  <rect class="layer" x="436" y="158" width="430" height="590"/>
  <text class="layer-label" x="651" y="196" text-anchor="middle">batch.Step components</text>
  <rect class="layer" x="918" y="158" width="498" height="590"/>
  <text class="layer-label" x="1167" y="196" text-anchor="middle">Stores and evidence</text>

  <g transform="translate(126 246)"><rect width="216" height="64" rx="12" fill="#d7ecf2" stroke="#48758d" stroke-width="2"/><text class="card-title" x="108" y="40" text-anchor="middle">go run</text></g>
  <g transform="translate(118 394)"><rect width="232" height="86" rx="12" fill="#fef3c7" stroke="#b99b5d" stroke-width="2"/><text class="card-title" x="116" y="35" text-anchor="middle">batch.Job</text><text class="detail" x="116" y="61" text-anchor="middle">account-migration</text></g>
  <g transform="translate(118 590)"><rect width="232" height="86" rx="12" fill="#e0f2fe" stroke="#48758d" stroke-width="2"/><text class="card-title" x="116" y="35" text-anchor="middle">Stable JSON</text><text class="detail" x="116" y="61" text-anchor="middle">restart evidence</text></g>

  <g transform="translate(504 220)"><rect width="294" height="92" rx="12" fill="#dbeafe" stroke="#4f7e9d" stroke-width="2"/><text class="card-title" x="147" y="33" text-anchor="middle">Reader</text><text class="detail" x="147" y="58" text-anchor="middle">CheckpointReader</text><text class="detail" x="147" y="76" text-anchor="middle">cursor = next_index</text></g>
  <g transform="translate(504 384)"><rect width="294" height="92" rx="12" fill="#dcfce7" stroke="#5d8a62" stroke-width="2"/><text class="card-title" x="147" y="33" text-anchor="middle">Processor</text><text class="detail" x="147" y="58" text-anchor="middle">normalize fields</text><text class="detail" x="147" y="76" text-anchor="middle">crash hook</text></g>
  <g transform="translate(504 548)"><rect width="294" height="92" rx="12" fill="#f3e8ff" stroke="#8a6bb0" stroke-width="2"/><text class="card-title" x="147" y="33" text-anchor="middle">Writer</text><text class="detail" x="147" y="58" text-anchor="middle">chunk commits</text><text class="detail" x="147" y="76" text-anchor="middle">unique target IDs</text></g>

  <g transform="translate(988 228)"><rect width="350" height="62" rx="12" fill="#e0f2fe" stroke="#48758d" stroke-width="2"/><text class="card-title" x="175" y="39" text-anchor="middle">CheckpointStore</text></g>
  <g transform="translate(1004 342)"><rect width="318" height="62" rx="12" fill="#ede9fe" stroke="#8a6bb0" stroke-width="2"/><text class="card-title" x="159" y="39" text-anchor="middle">account-migration-v1</text></g>
  <g transform="translate(1016 510)"><rect width="294" height="92" rx="12" fill="#fff7ed" stroke="#c07a42" stroke-width="2"/><text class="card-title" x="147" y="33" text-anchor="middle">Target</text><text class="detail" x="147" y="58" text-anchor="middle">snapshot</text><text class="detail" x="147" y="76" text-anchor="middle">write log</text></g>

  <path class="blue" d="M 234 310 V 394"/><text class="label" x="286" y="356" text-anchor="middle">run twice</text>
  <path class="blue" d="M 350 437 H 418 Q 430 437 430 425 V 278 Q 430 266 442 266 H 504"/><text class="label" x="431" y="250" text-anchor="middle">read + restore</text>
  <path class="green" d="M 651 312 V 384"/><text class="label" x="704" y="354" text-anchor="middle">rows</text>
  <path class="purple" d="M 651 476 V 548"/><text class="label" x="704" y="518" text-anchor="middle">targets</text>
  <path class="amber" d="M 798 594 H 1016"/><text class="label" x="907" y="574" text-anchor="middle">put</text>
  <path class="blue" d="M 798 594 H 886 Q 898 594 898 582 V 271 Q 898 259 910 259 H 988"/><text class="label" x="914" y="414" text-anchor="middle" transform="rotate(-90 914 414)">save after committed chunk</text>
  <path class="purple" d="M 1004 373 H 942 Q 930 373 930 361 V 290 Q 930 278 942 278 H 988"/><text class="label" x="936" y="334" text-anchor="middle" transform="rotate(-90 936 334)">same key</text>
  <path class="blue" d="M 234 480 V 590"/><text class="label" x="286" y="540" text-anchor="middle">print result</text>

  <rect x="214" y="778" width="1072" height="36" rx="12" fill="#ffffff" stroke="#d8e2e8"/>
  <text class="footer" x="750" y="802" text-anchor="middle">Production replacements: durable checkpoint persistence, transactional target writes, audit events, and retry/dead-letter policy.</text>
</svg>
