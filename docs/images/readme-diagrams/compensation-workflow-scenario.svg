<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="920" viewBox="0 0 1520 920" role="img" aria-labelledby="title desc">
  <title id="title">Compensation Workflow Scenario</title>
  <desc id="desc">Request-scoped fulfillment workflow showing forward steps, original failure preservation, and reverse compensation cleanup.</desc>
  <defs>
    <marker id="scenario-request" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse" data-role="secondary" data-tip-direction="positive-x"><path d="M 0.8 1 L 9.2 5 L 0.8 9 Z" fill="#3f6f8f" stroke="#3f6f8f" stroke-width="0" stroke-dasharray="none"/></marker>
    <marker id="scenario-success" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse" data-role="secondary" data-tip-direction="positive-x"><path d="M 0.8 1 L 9.2 5 L 0.8 9 Z" fill="#5d8a62" stroke="#5d8a62" stroke-width="0" stroke-dasharray="none"/></marker>
    <marker id="scenario-failure" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse" data-role="secondary" data-tip-direction="positive-x"><path d="M 0.8 1 L 9.2 5 L 0.8 9 Z" fill="#b95f7a" stroke="#b95f7a" stroke-width="0" stroke-dasharray="none"/></marker>
    <marker id="scenario-comp" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse" data-role="secondary" data-tip-direction="positive-x"><path d="M 0.8 1 L 9.2 5 L 0.8 9 Z" fill="#8a6bb0" stroke="#8a6bb0" stroke-width="0" stroke-dasharray="none"/></marker>
    <style>
      @font-face { font-family: 'Architects Daughter'; src: url('file:///Users/debop/Library/Fonts/ArchitectsDaughter-Regular.ttf') format('truetype'); }
      @font-face { font-family: 'Comic Mono'; src: url('file:///Users/debop/Library/Fonts/ComicMono.ttf') format('truetype'); }
      .title { font-family: 'Architects Daughter'; font-size: 38px; fill: #24313f; }
      .subtitle, .detail, .label, .footer { font-family: 'Comic Mono'; fill: #536d7d; }
      .subtitle { font-size: 15px; }
      .layer-label, .card-title { font-family: 'Architects Daughter'; fill: #24313f; }
      .layer-label { font-size: 22px; }
      .card-title { font-size: 23px; }
      .detail { font-size: 13px; }
      .label { font-size: 12px; }
      .footer { font-size: 13px; }
      .frame { fill: #fffefa; stroke: #d8e2e8; stroke-width: 2; rx: 20; }
      .layer { fill: #ffffff; stroke: #d8e2e8; stroke-width: 2; rx: 16; }
      .request { fill: none; stroke: #3f6f8f; stroke-width: 3; marker-end: url(#scenario-request); }
      .success { fill: none; stroke: #5d8a62; stroke-width: 3; marker-end: url(#scenario-success); }
      .failure { fill: none; stroke: #b95f7a; stroke-width: 3; marker-end: url(#scenario-failure); }
      .comp { fill: none; stroke: #8a6bb0; stroke-width: 3; marker-end: url(#scenario-comp); }
    </style>
  </defs>
  <rect width="1520" height="920" fill="#fbfaf6"/>
  <rect class="frame" x="44" y="26" width="1432" height="858"/>
  <text class="title" x="760" y="72" text-anchor="middle">Compensation Workflow Scenario</text>
  <text class="subtitle" x="760" y="105" text-anchor="middle">Forward work records reversible side effects; a later failure triggers reverse cleanup without hiding the original error.</text>

  <rect class="layer" x="84" y="146" width="260" height="632"/>
  <text class="layer-label" x="214" y="184" text-anchor="middle">Input</text>
  <rect class="layer" x="402" y="146" width="324" height="632"/>
  <text class="layer-label" x="564" y="184" text-anchor="middle">Forward workflow</text>
  <rect class="layer" x="784" y="146" width="324" height="632"/>
  <text class="layer-label" x="946" y="184" text-anchor="middle">Compensation stack</text>
  <rect class="layer" x="1166" y="146" width="270" height="632"/>
  <text class="layer-label" x="1301" y="184" text-anchor="middle">Response</text>

  <g transform="translate(114 396)"><rect width="200" height="92" rx="12" fill="#d7ecf2" stroke="#48758d" stroke-width="2"/><text class="card-title" x="100" y="36" text-anchor="middle">Request</text><text class="detail" x="100" y="62" text-anchor="middle">order + scenario flags</text></g>

  <g transform="translate(450 214)"><rect width="228" height="100" rx="12" fill="#dbeafe" stroke="#4f7e9d" stroke-width="2"/><text class="card-title" x="114" y="34" text-anchor="middle">reserve-inventory</text><text class="detail" x="114" y="60" text-anchor="middle">sets inventory_reserved</text><text class="detail" x="114" y="80" text-anchor="middle">push release-inventory</text></g>
  <g transform="translate(450 386)"><rect width="228" height="100" rx="12" fill="#dbeafe" stroke="#4f7e9d" stroke-width="2"/><text class="card-title" x="114" y="34" text-anchor="middle">authorize-payment</text><text class="detail" x="114" y="60" text-anchor="middle">sets payment_authorized</text><text class="detail" x="114" y="80" text-anchor="middle">push void-payment</text></g>
  <g transform="translate(450 558)"><rect width="228" height="100" rx="12" fill="#fee2e2" stroke="#bf6672" stroke-width="2"/><text class="card-title" x="114" y="34" text-anchor="middle">create-shipment</text><text class="detail" x="114" y="60" text-anchor="middle">last forward side effect</text><text class="detail" x="114" y="80" text-anchor="middle">may fail</text></g>

  <g transform="translate(832 214)"><rect width="228" height="92" rx="12" fill="#ffe4e6" stroke="#b95f7a" stroke-width="2"/><text class="card-title" x="114" y="34" text-anchor="middle">Original error</text><text class="detail" x="114" y="60" text-anchor="middle">shipment provider</text><text class="detail" x="114" y="78" text-anchor="middle">stays caller-visible</text></g>
  <g transform="translate(832 386)"><rect width="228" height="108" rx="12" fill="#f3e8ff" stroke="#8a6bb0" stroke-width="2"/><text class="card-title" x="114" y="34" text-anchor="middle">void-payment</text><text class="detail" x="114" y="60" text-anchor="middle">reverse step 1</text><text class="detail" x="114" y="80" text-anchor="middle">may fail independently</text><text class="detail" x="114" y="98" text-anchor="middle">ContinueOnFailure</text></g>
  <g transform="translate(832 568)"><rect width="228" height="108" rx="12" fill="#f3e8ff" stroke="#8a6bb0" stroke-width="2"/><text class="card-title" x="114" y="34" text-anchor="middle">release-inventory</text><text class="detail" x="114" y="60" text-anchor="middle">reverse step 2</text><text class="detail" x="114" y="80" text-anchor="middle">runs even if void fails</text><text class="detail" x="114" y="98" text-anchor="middle">clears reservation</text></g>

  <g transform="translate(1204 244)"><rect width="194" height="58" rx="12" fill="#dcfce7" stroke="#5d8a62" stroke-width="2"/><text class="card-title" x="97" y="38" text-anchor="middle">200 completed</text></g>
  <g transform="translate(1204 420)"><rect width="194" height="58" rx="12" fill="#e0f2fe" stroke="#48758d" stroke-width="2"/><text class="card-title" x="97" y="38" text-anchor="middle">JSON report</text></g>
  <g transform="translate(1204 608)"><rect width="194" height="58" rx="12" fill="#fee2e2" stroke="#b95f7a" stroke-width="2"/><text class="card-title" x="97" y="38" text-anchor="middle">409 compensated</text></g>

  <path class="request" d="M 314 442 H 374 Q 386 442 386 430 V 264 Q 386 252 398 252 H 450"/><text class="label" x="372" y="423" text-anchor="middle">POST</text>
  <path class="success" d="M 564 314 V 386"/><text class="label" x="616" y="356" text-anchor="middle">success</text>
  <path class="success" d="M 564 486 V 558"/><text class="label" x="616" y="528" text-anchor="middle">success</text>
  <path class="success" d="M 678 608 H 744 Q 756 608 756 596 V 204 Q 756 192 768 192 H 1130 Q 1142 192 1142 204 V 273 Q 1142 285 1154 285 H 1204"/><text class="label" x="982" y="212" text-anchor="middle">all forward steps complete</text>

  <path class="failure" d="M 678 608 H 744 Q 756 608 756 596 V 260 Q 756 248 768 248 H 832"/><text class="label" x="758" y="430" text-anchor="middle" transform="rotate(-90 758 430)">later step fails</text>
  <path class="comp" d="M 946 306 V 386"/><text class="label" x="1000" y="350" text-anchor="middle">reverse stack top</text>
  <path class="comp" d="M 946 494 V 568"/><text class="label" x="1002" y="536" text-anchor="middle">continue cleanup</text>
  <path class="comp" d="M 1060 622 H 1204"/><text class="label" x="1132" y="602" text-anchor="middle">cleanup outcome</text>
  <path class="request" d="M 946 676 V 704 Q 946 716 958 716 H 1289 Q 1301 716 1301 704 V 666"/><text class="label" x="1132" y="737" text-anchor="middle">report preserves original error</text>
  <path class="request" d="M 1301 420 V 302"/><text class="label" x="1358" y="364" text-anchor="middle">stable report</text>

  <rect x="214" y="810" width="1092" height="42" rx="12" fill="#ffffff" stroke="#d8e2e8"/>
  <text class="footer" x="760" y="836" text-anchor="middle">Teaching boundary: request-scoped flags stand in for durable inventory, payment, and shipment commands.</text>
</svg>
