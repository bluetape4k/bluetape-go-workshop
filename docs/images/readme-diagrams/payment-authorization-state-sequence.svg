<svg xmlns="http://www.w3.org/2000/svg" width="1518" height="876" viewBox="-60 0 1518 876" role="img" aria-labelledby="title desc">
  <title id="title">Payment Authorization State Sequence</title>
  <desc id="desc">Best-practices sequence diagram with participant cards, lifelines, activations, numbered labels, and branch frame.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
    <marker id="arrow-call" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 13 13" data-role="sequence" data-tip-direction="positive-x"><path d="M 1.04 1.3 L 11.96 6.5 L 1.04 11.7 Z" fill="#3F7D9C" stroke="#3F7D9C" stroke-width="0" stroke-dasharray="none"/></marker>
    <marker id="arrow-return" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 13 13" data-role="sequence" data-tip-direction="positive-x"><path d="M 1.04 1.3 L 11.96 6.5 L 1.04 11.7 Z" fill="#6E8F4F" stroke="#6E8F4F" stroke-width="0" stroke-dasharray="none"/></marker>
    <marker id="arrow-async" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 13 13" data-role="sequence" data-tip-direction="positive-x"><path d="M 1.04 1.3 L 11.96 6.5 L 1.04 11.7 Z" fill="#755BC6" stroke="#755BC6" stroke-width="0" stroke-dasharray="none"/></marker>
    <marker id="arrow-fail" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 13 13" data-role="sequence" data-tip-direction="positive-x"><path d="M 1.04 1.3 L 11.96 6.5 L 1.04 11.7 Z" fill="#B86868" stroke="#B86868" stroke-width="0" stroke-dasharray="none"/></marker>
    <style>
      @font-face { font-family: 'Architects Daughter'; src: url('file:///Users/debop/Library/Fonts/ArchitectsDaughter-Regular.ttf') format('truetype'); }
      @font-face { font-family: 'Comic Mono'; src: url('file:///Users/debop/Library/Fonts/ComicMono.ttf') format('truetype'); }
      .canvas{fill:#fbfcf8}.title{font-family:'Architects Daughter';font-size:40px;fill:#263238}.subtitle,.detail,.footer{font-family:'Comic Mono';fill:#36464f}.subtitle{font-size:16px}.footer{font-size:14px;fill:#60727d}.cardTitle{font-family:'Architects Daughter';font-size:21px;fill:#1f3138}.role{font-family:'Comic Mono';font-size:12px;fill:#546a73}.card{fill:#ffffff;stroke-width:2;filter:url(#shadow)}.lifeline{stroke:#9aaab1;stroke-width:2;stroke-dasharray:7 8;stroke-linecap:round}.activation{fill:#e6f2ec;stroke:#5b7e67;stroke-width:1.5}.call,.return,.async,.fail{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.call{stroke:#3F7D9C;marker-end:url(#arrow-call)}.return{stroke:#6E8F4F;stroke-width:2.6;stroke-dasharray:8 6;marker-end:url(#arrow-return)}.async{stroke:#755BC6;marker-end:url(#arrow-async)}.fail{stroke:#B86868;marker-end:url(#arrow-fail)}.alt{fill:#eef7f0;fill-opacity:.14;stroke:#78909c;stroke-width:2.4;stroke-dasharray:12 7}.divider{stroke:#78909c;stroke-width:2;stroke-dasharray:10 8}rect.label{fill:#ffffff;stroke:#d7e0e4;stroke-width:1.3}.callLabel{stroke:#9cc2d1}.returnLabel{stroke:#b6c9a4}.asyncLabel{stroke:#b8a9d5}.failLabel{stroke:#d9abab}.badgeText,.msg{font-family:'Comic Mono';font-size:12px;font-weight:700}.msg{font-size:13px}.callText{fill:#2f6f8e}.returnText{fill:#55783F}.asyncText{fill:#674b91}.failText{fill:#9d4f4f}
    </style>
  </defs>
  <rect class="canvas" x="-60" y="0" width="1518" height="876"/>
  <text class="title" x="699" y="64" text-anchor="middle">Payment Authorization State Sequence</text>
  <text class="subtitle" x="699" y="98" text-anchor="middle">Successful transitions are replayable by key; failed transitions are not stored as success.</text>
  <g id="participant-1"><rect class="card" x="-5" y="160" width="190" height="78" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/><text class="cardTitle" x="90" y="203" text-anchor="middle">Client</text><line class="lifeline" x1="90" y1="238" x2="90" y2="764"/></g>
  <g id="participant-2"><rect class="card" x="299.5" y="160" width="190" height="78" rx="10" fill="#FFF3D9" stroke="#D6A441"/><text class="cardTitle" x="394.5" y="203" text-anchor="middle">Handler</text><line class="lifeline" x1="394.5" y1="238" x2="394.5" y2="764"/></g>
  <g id="participant-3"><rect class="card" x="596" y="160" width="206" height="78" rx="10" fill="#EAF7EF" stroke="#58A978"/><text class="cardTitle" x="699" y="203" text-anchor="middle">Idempotency</text><line class="lifeline" x1="699" y1="238" x2="699" y2="764"/></g>
  <g id="participant-4"><rect class="card" x="905.5" y="160" width="196" height="78" rx="10" fill="#F1ECFF" stroke="#8A72D6"/><text class="cardTitle" x="1003.5" y="203" text-anchor="middle">State Machine</text><line class="lifeline" x1="1003.5" y1="238" x2="1003.5" y2="764"/></g>
  <g id="participant-5"><rect class="card" x="1213" y="160" width="190" height="78" rx="10" fill="#FDECEF" stroke="#DC6B82"/><text class="cardTitle" x="1308" y="203" text-anchor="middle">Response</text><line class="lifeline" x1="1308" y1="238" x2="1308" y2="764"/></g>
  <rect class="activation" x="387.5" y="324" width="14" height="200" rx="6"/>
  <rect class="activation" x="692" y="340" width="14" height="248" rx="6"/>
  <rect class="activation" x="996.5" y="468" width="14" height="248" rx="6"/>
  <rect class="activation" x="1301" y="404" width="14" height="312" rx="6"/>
  <rect class="alt" x="64" y="634" width="1270" height="106" rx="16"/>
  <rect class="label failLabel" x="88" y="620" width="230" height="28" rx="8"/>
  <text class="msg failText" x="203" y="639" text-anchor="middle">alt failure / branch path</text>
  <g id="message-1"><rect class="label callLabel" x="82.2" y="258" width="320" height="28" rx="8"/><circle cx="100.2" cy="272" r="12" fill="#3F7D9C"/><text class="badgeText" x="100.2" y="276" text-anchor="middle" fill="#fff">1</text><text class="msg callText" x="250.2" y="276" text-anchor="middle">POST event + idempotency_key</text><path class="call" d="M 90 294 H 394.5"/></g>
  <g id="message-2"><rect class="label callLabel" x="471.8" y="322" width="150" height="28" rx="8"/><circle cx="489.8" cy="336" r="12" fill="#3F7D9C"/><text class="badgeText" x="489.8" y="340" text-anchor="middle" fill="#fff">2</text><text class="msg callText" x="554.8" y="340" text-anchor="middle">lookup key</text><path class="call" d="M 394.5 358 H 699"/></g>
  <g id="message-3"><rect class="label callLabel" x="843.5" y="386" width="320" height="28" rx="8"/><circle cx="861.5" cy="400" r="12" fill="#3F7D9C"/><text class="badgeText" x="861.5" y="404" text-anchor="middle" fill="#fff">3</text><text class="msg callText" x="1011.5" y="404" text-anchor="middle">same key + event replays stored response</text><path class="call" d="M 699 422 H 1308"/></g>
  <g id="message-4"><rect class="label callLabel" x="579" y="450" width="240" height="28" rx="8"/><circle cx="597" cy="464" r="12" fill="#3F7D9C"/><text class="badgeText" x="597" y="468" text-anchor="middle" fill="#fff">4</text><text class="msg callText" x="707" y="468" text-anchor="middle">Transition(ctx,event)</text><path class="call" d="M 394.5 486 H 1003.5"/></g>
  <g id="message-5"><rect class="label callLabel" x="776.2" y="514" width="150" height="28" rx="8"/><circle cx="794.2" cy="528" r="12" fill="#3F7D9C"/><text class="badgeText" x="794.2" y="532" text-anchor="middle" fill="#fff">5</text><text class="msg callText" x="859.2" y="532" text-anchor="middle">store success</text><path class="call" d="M 1003.5 550 H 699"/></g>
  <g id="message-6"><rect class="label callLabel" x="1058.6" y="578" width="194.3" height="28" rx="8"/><circle cx="1076.6" cy="592" r="12" fill="#3F7D9C"/><text class="badgeText" x="1076.6" y="596" text-anchor="middle" fill="#fff">6</text><text class="msg callText" x="1163.8" y="596" text-anchor="middle">snapshot response</text><path class="call" d="M 1003.5 614 H 1308"/></g>
  <g id="message-7"><rect class="label failLabel" x="1012.9" y="642" width="285.7" height="28" rx="8"/><circle cx="1030.9" cy="656" r="12" fill="#B86868"/><text class="badgeText" x="1030.9" y="660" text-anchor="middle" fill="#fff">7</text><text class="msg failText" x="1163.8" y="660" text-anchor="middle">invalid or guard rejected</text><path class="fail" d="M 1003.5 678 H 1308"/></g>
  <g><rect x="195.7" y="806" width="1006.6" height="42" rx="12" fill="#ffffff" stroke="#D6E3EF" stroke-width="1.6"/><text class="footer" x="699" y="833" text-anchor="middle">A key reused for a different event returns idempotency_conflict.</text></g>
</svg>
