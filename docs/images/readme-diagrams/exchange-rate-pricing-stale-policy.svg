<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font-family: "Architects Daughter", "Comic Sans MS", cursive; font-size: 52px; fill: #0f172a; }
      .subtitle { font-family: "Comic Mono", "SFMono-Regular", monospace; font-size: 24px; fill: #475569; }
      .label { font-family: "Architects Daughter", "Comic Sans MS", cursive; font-size: 31px; fill: #0f172a; }
      .small { font-family: "Comic Mono", "SFMono-Regular", monospace; font-size: 21px; fill: #334155; }
      .head { fill: #e0f2fe; stroke: #0284c7; stroke-width: 3; rx: 20; }
      .ok { fill: #ecfdf5; stroke: #059669; stroke-width: 4; rx: 22; }
      .warn { fill: #fff7ed; stroke: #f97316; stroke-width: 4; rx: 22; }
      .fail { fill: #fef2f2; stroke: #dc2626; stroke-width: 4; rx: 22; }
      .cell { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 16; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="900"/>
  <text class="title" x="70" y="95">Freshness and failure policy</text>
  <text class="subtitle" x="74" y="138">The example makes quote freshness visible instead of blending provider I/O into ordinary pricing.</text>

  <rect class="head" x="95" y="190" width="330" height="90"/>
  <text class="label" x="150" y="247">Provider result</text>
  <rect class="head" x="465" y="190" width="330" height="90"/>
  <text class="label" x="530" y="247">Caller policy</text>
  <rect class="head" x="835" y="190" width="330" height="90"/>
  <text class="label" x="905" y="247">HTTP result</text>
  <rect class="head" x="1205" y="190" width="300" height="90"/>
  <text class="label" x="1260" y="247">Reader lesson</text>

  <rect class="ok" x="95" y="315" width="330" height="110"/>
  <text class="label" x="135" y="365">fresh quote</text>
  <text class="small" x="135" y="400">stale is false</text>
  <rect class="cell" x="465" y="315" width="330" height="110"/>
  <text class="small" x="505" y="365">no special opt-in</text>
  <text class="small" x="505" y="400">required</text>
  <rect class="ok" x="835" y="315" width="330" height="110"/>
  <text class="label" x="895" y="365">200 OK</text>
  <text class="small" x="895" y="400">display_total returned</text>
  <rect class="cell" x="1205" y="315" width="300" height="110"/>
  <text class="small" x="1245" y="365">normal quote path</text>
  <text class="small" x="1245" y="400">is still metadata-rich</text>

  <rect class="warn" x="95" y="460" width="330" height="120"/>
  <text class="label" x="135" y="512">stale fallback</text>
  <text class="small" x="135" y="548">refresh_error present</text>
  <rect class="ok" x="465" y="460" width="330" height="120"/>
  <text class="small" x="505" y="512">allow_stale_quote</text>
  <text class="small" x="505" y="548">is true</text>
  <rect class="ok" x="835" y="460" width="330" height="120"/>
  <text class="label" x="895" y="512">200 OK</text>
  <text class="small" x="895" y="548">stale is true in rate</text>
  <rect class="cell" x="1205" y="460" width="300" height="120"/>
  <text class="small" x="1245" y="512">caller sees the</text>
  <text class="small" x="1245" y="548">freshness tradeoff</text>

  <rect class="warn" x="95" y="615" width="330" height="120"/>
  <text class="label" x="135" y="667">stale fallback</text>
  <text class="small" x="135" y="703">refresh_error present</text>
  <rect class="fail" x="465" y="615" width="330" height="120"/>
  <text class="small" x="505" y="667">allow_stale_quote</text>
  <text class="small" x="505" y="703">is false</text>
  <rect class="fail" x="835" y="615" width="330" height="120"/>
  <text class="label" x="895" y="667">503</text>
  <text class="small" x="895" y="703">stale_quote</text>
  <rect class="cell" x="1205" y="615" width="300" height="120"/>
  <text class="small" x="1245" y="667">fail closed instead</text>
  <text class="small" x="1245" y="703">of hiding stale trust</text>

  <rect class="fail" x="95" y="770" width="330" height="80"/>
  <text class="small" x="135" y="817">provider error, no quote</text>
  <rect class="cell" x="465" y="770" width="330" height="80"/>
  <text class="small" x="505" y="817">no fallback available</text>
  <rect class="fail" x="835" y="770" width="330" height="80"/>
  <text class="small" x="895" y="817">503 provider unavailable</text>
  <rect class="cell" x="1205" y="770" width="300" height="80"/>
  <text class="small" x="1245" y="817">provider detail stays private</text>
</svg>
