<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320" role="img" aria-labelledby="title desc">
  <title id="title">SQS Floci worker sequence</title>
  <desc id="desc">Sequence for enqueue, handler success delete acknowledgement, and handler failure retry visibility.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Architects+Daughter&amp;family=Comic+Mono:wght@400;700&amp;display=swap');
      .title{font-family:'Architects Daughter','Comic Mono',sans-serif;font-size:48px;fill:#172033}
      .subtitle,.label,.small{font-family:'Comic Mono','Architects Daughter',monospace;fill:#4b5568}
      .subtitle{font-size:21px}.label{font-size:23px}.small{font-size:18px}.head{font-family:'Architects Daughter','Comic Mono',sans-serif;font-size:27px;fill:#172033}
      .participant{fill:#fff;stroke:#cbd5e1;stroke-width:3}.worker{fill:#dcfce7;stroke:#86efac;stroke-width:3}.sdk{fill:#dbeafe;stroke:#93c5fd;stroke-width:3}.floci{fill:#f3e8ff;stroke:#c084fc;stroke-width:3}
      .note{fill:#fff7ed;stroke:#fed7aa;stroke-width:3}.error{fill:#fee2e2;stroke:#f87171;stroke-width:3}
      .life{stroke:#94a3b8;stroke-width:3;stroke-dasharray:12 14}.sep{stroke:#cbd5e1;stroke-width:3;stroke-dasharray:14 16}
      .arrow{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:5}
    </style>
    <marker id="blue" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 16 16" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 16 8 L 0 16 Z" fill="#2563eb" stroke="#2563eb" stroke-dasharray="none"/></marker>
    <marker id="green" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 16 16" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 16 8 L 0 16 Z" fill="#059669" stroke="#059669" stroke-dasharray="none"/></marker>
    <marker id="red" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 16 16" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 16 8 L 0 16 Z" fill="#dc2626" stroke="#dc2626" stroke-dasharray="none"/></marker>
  </defs>
  <rect width="1800" height="1320" fill="#f8fafc"/>
  <text x="90" y="86" class="title">SQS Floci worker sequence</text>
  <text x="90" y="128" class="subtitle">Success deletes the message; failure changes visibility so SQS can redeliver the same idempotent task.</text>

  <rect x="110" y="185" width="290" height="105" rx="16" class="participant"/>
  <text x="150" y="231" class="head">Caller</text><text x="150" y="265" class="small">checkout flow</text>
  <rect x="545" y="185" width="310" height="105" rx="16" class="worker"/>
  <text x="585" y="231" class="head">TaskQueue</text><text x="585" y="265" class="small">payload + ack boundary</text>
  <rect x="990" y="185" width="310" height="105" rx="16" class="sdk"/>
  <text x="1030" y="231" class="head">AWS SDK SQS</text><text x="1030" y="265" class="small">caller-owned client</text>
  <rect x="1435" y="185" width="270" height="105" rx="16" class="floci"/>
  <text x="1475" y="231" class="head">Floci SQS</text><text x="1475" y="265" class="small">local endpoint</text>

  <path class="life" d="M255 290 V1260"/><path class="life" d="M700 290 V1260"/><path class="life" d="M1145 290 V1260"/><path class="life" d="M1570 290 V1260"/>
  <path class="sep" d="M90 505 H1710"/><path class="sep" d="M90 960 H1710"/>
  <text x="100" y="360" class="label">1. Enqueue task</text>
  <path class="arrow" stroke="#2563eb" marker-end="url(#blue)" d="M285 395 H680"/>
  <text x="390" y="374" class="label">Enqueue(task)</text>
  <path class="arrow" stroke="#059669" marker-end="url(#green)" d="M730 455 H1125"/>
  <text x="800" y="434" class="label">SendMessage JSON + attributes</text>
  <path class="arrow" stroke="#059669" marker-end="url(#green)" d="M1175 455 H1550"/>
  <text x="1280" y="434" class="small">local SQS endpoint</text>

  <text x="100" y="570" class="label">2. Handler success</text>
  <path class="arrow" stroke="#2563eb" marker-end="url(#blue)" d="M285 615 H680"/>
  <text x="395" y="594" class="label">PollOnce(success handler)</text>
  <path class="arrow" stroke="#059669" marker-end="url(#green)" d="M730 675 H1125"/>
  <text x="820" y="654" class="label">ReceiveMessage</text>
  <path class="arrow" stroke="#059669" marker-end="url(#green)" d="M1125 735 H730"/>
  <text x="805" y="714" class="label">task message</text>
  <rect x="455" y="745" width="430" height="70" rx="14" class="note"/>
  <text x="500" y="790" class="label">handler succeeds after idempotent work</text>
  <path class="arrow" stroke="#059669" marker-end="url(#green)" d="M730 865 H1125"/>
  <text x="805" y="842" class="label">DeleteMessage ack</text>
  <path class="arrow" stroke="#059669" marker-end="url(#green)" d="M680 925 H285"/>
  <text x="405" y="902" class="label">WorkResult acked</text>

  <text x="100" y="1030" class="label">3. Handler failure and retry</text>
  <path class="arrow" stroke="#2563eb" marker-end="url(#blue)" d="M285 1080 H680"/>
  <text x="400" y="1057" class="label">PollOnce(failing handler)</text>
  <rect x="465" y="1125" width="390" height="65" rx="14" class="error"/>
  <text x="505" y="1166" class="label">handler error: no delete</text>
  <path class="arrow" stroke="#dc2626" marker-end="url(#red)" d="M730 1220 H1125"/>
  <text x="805" y="1197" class="label">ChangeMessageVisibility(0)</text>
  <path class="arrow" stroke="#dc2626" marker-end="url(#red)" d="M1125 1265 H730"/>
  <text x="790" y="1245" class="small">same task can be delivered again</text>
</svg>
