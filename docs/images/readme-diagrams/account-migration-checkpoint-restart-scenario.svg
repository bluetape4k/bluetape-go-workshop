<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="860" viewBox="0 0 1500 860" role="img" aria-labelledby="title desc">
  <title id="title">Account Migration Checkpoint Restart Scenario</title>
  <desc id="desc">Scenario showing an account migration, checkpoint after the first chunk, a deterministic processor crash, restart from the saved cursor, and completed migration.</desc>
  <defs>
    <marker id="sc-read" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse" data-role="secondary" data-tip-direction="positive-x"><path d="M 0.8 1 L 9.2 5 L 0.8 9 Z" fill="#3f6f8f" stroke="#3f6f8f" stroke-width="0" stroke-dasharray="none"/></marker>
    <marker id="sc-ok" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse" data-role="secondary" data-tip-direction="positive-x"><path d="M 0.8 1 L 9.2 5 L 0.8 9 Z" fill="#5d8a62" stroke="#5d8a62" stroke-width="0" stroke-dasharray="none"/></marker>
    <marker id="sc-fail" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse" data-role="secondary" data-tip-direction="positive-x"><path d="M 0.8 1 L 9.2 5 L 0.8 9 Z" fill="#b95f7a" stroke="#b95f7a" stroke-width="0" stroke-dasharray="none"/></marker>
    <marker id="sc-restart" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse" data-role="secondary" data-tip-direction="positive-x"><path d="M 0.8 1 L 9.2 5 L 0.8 9 Z" fill="#8a6bb0" stroke="#8a6bb0" stroke-width="0" stroke-dasharray="none"/></marker>
    <style>
      @font-face { font-family: 'Architects Daughter'; src: url('file:///Users/debop/Library/Fonts/ArchitectsDaughter-Regular.ttf') format('truetype'); }
      @font-face { font-family: 'Comic Mono'; src: url('file:///Users/debop/Library/Fonts/ComicMono.ttf') format('truetype'); }
      .title { font-family: 'Architects Daughter'; font-size: 38px; fill: #24313f; }
      .subtitle, .detail, .label, .footer { font-family: 'Comic Mono'; fill: #536d7d; }
      .subtitle { font-size: 15px; }
      .layer-label, .card-title { font-family: 'Architects Daughter'; fill: #24313f; }
      .layer-label { font-size: 22px; }
      .card-title { font-size: 23px; }
      .detail { font-size: 13px; }
      .label { font-size: 12px; }
      .footer { font-size: 13px; }
      .frame { fill: #fffefa; stroke: #d8e2e8; stroke-width: 2; rx: 20; }
      .layer { fill: #ffffff; stroke: #d8e2e8; stroke-width: 2; rx: 16; }
      .read { fill: none; stroke: #3f6f8f; stroke-width: 3; marker-end: url(#sc-read); }
      .ok { fill: none; stroke: #5d8a62; stroke-width: 3; marker-end: url(#sc-ok); }
      .fail { fill: none; stroke: #b95f7a; stroke-width: 3; marker-end: url(#sc-fail); }
      .restart { fill: none; stroke: #8a6bb0; stroke-width: 3; marker-end: url(#sc-restart); }
    </style>
  </defs>
  <rect width="1500" height="860" fill="#fbfaf6"/>
  <rect class="frame" x="44" y="34" width="1412" height="792"/>
  <text class="title" x="750" y="82" text-anchor="middle">Account Migration Checkpoint Restart Scenario</text>
  <text class="subtitle" x="750" y="116" text-anchor="middle">A saved source cursor lets the restart skip completed work and continue from the failed account.</text>

  <rect class="layer" x="84" y="158" width="370" height="594"/>
  <text class="layer-label" x="269" y="196" text-anchor="middle">First run</text>
  <rect class="layer" x="516" y="158" width="354" height="594"/>
  <text class="layer-label" x="693" y="196" text-anchor="middle">Checkpoint handoff</text>
  <rect class="layer" x="932" y="158" width="484" height="594"/>
  <text class="layer-label" x="1174" y="196" text-anchor="middle">Restart run</text>

  <g transform="translate(132 248)"><rect width="274" height="86" rx="12" fill="#fef3c7" stroke="#b99b5d" stroke-width="2"/><text class="card-title" x="137" y="34" text-anchor="middle">Legacy accounts</text><text class="detail" x="137" y="60" text-anchor="middle">acct-1001..1005</text></g>
  <g transform="translate(132 414)"><rect width="274" height="86" rx="12" fill="#dcfce7" stroke="#5d8a62" stroke-width="2"/><text class="card-title" x="137" y="34" text-anchor="middle">Chunk 1</text><text class="detail" x="137" y="60" text-anchor="middle">write acct-1001..1002</text></g>
  <g transform="translate(132 580)"><rect width="274" height="86" rx="12" fill="#fee2e2" stroke="#bf6672" stroke-width="2"/><text class="card-title" x="137" y="34" text-anchor="middle">Crash point</text><text class="detail" x="137" y="60" text-anchor="middle">acct-1003 processor error</text></g>

  <g transform="translate(568 300)"><rect width="250" height="90" rx="12" fill="#dbeafe" stroke="#4f7e9d" stroke-width="2"/><text class="card-title" x="125" y="34" text-anchor="middle">Checkpoint</text><text class="detail" x="125" y="60" text-anchor="middle">next_index = 2</text></g>
  <g transform="translate(566 500)"><rect width="254" height="90" rx="12" fill="#ede9fe" stroke="#8a6bb0" stroke-width="2"/><text class="card-title" x="127" y="34" text-anchor="middle">Saved key</text><text class="detail" x="127" y="60" text-anchor="middle">account-migration-v1</text></g>

  <g transform="translate(984 236)"><rect width="286" height="86" rx="12" fill="#ede9fe" stroke="#8a6bb0" stroke-width="2"/><text class="card-title" x="143" y="34" text-anchor="middle">New process</text><text class="detail" x="143" y="60" text-anchor="middle">load saved cursor</text></g>
  <g transform="translate(984 398)"><rect width="322" height="108" rx="12" fill="#f3e8ff" stroke="#8a6bb0" stroke-width="2"/><text class="card-title" x="161" y="34" text-anchor="middle">Restore cursor</text><text class="detail" x="161" y="61" text-anchor="middle">read acct-1003..1005</text><text class="detail" x="161" y="84" text-anchor="middle">completed chunk is not read</text></g>
  <g transform="translate(984 590)"><rect width="286" height="86" rx="12" fill="#dcfce7" stroke="#5d8a62" stroke-width="2"/><text class="card-title" x="143" y="34" text-anchor="middle">Complete</text><text class="detail" x="143" y="60" text-anchor="middle">checkpoint next_index = 5</text></g>

  <path class="read" d="M 269 334 V 414"/><text class="label" x="318" y="378" text-anchor="middle">read</text>
  <path class="ok" d="M 406 457 H 486 Q 498 457 498 445 V 345 Q 498 333 510 333 H 568"/><text class="label" x="507" y="392" text-anchor="middle" transform="rotate(-90 507 392)">save after write</text>
  <path class="fail" d="M 269 500 V 580"/><text class="label" x="326" y="544" text-anchor="middle">next account</text>
  <path class="restart" d="M 406 623 H 486 Q 498 623 498 611 V 545 Q 498 533 510 533 H 566"/><text class="label" x="504" y="594" text-anchor="middle" transform="rotate(-90 504 594)">checkpoint at 2</text>
  <path class="restart" d="M 820 545 H 902 Q 914 545 914 533 V 279 Q 914 267 926 267 H 984"/><text class="label" x="920" y="410" text-anchor="middle" transform="rotate(-90 920 410)">restart reads key</text>
  <path class="restart" d="M 1127 322 V 398"/><text class="label" x="1184" y="364" text-anchor="middle">restore</text>
  <path class="ok" d="M 1145 506 V 590"/><text class="label" x="1206" y="552" text-anchor="middle">write remaining</text>

  <rect x="214" y="784" width="1072" height="42" rx="12" fill="#ffffff" stroke="#d8e2e8"/>
  <text class="footer" x="750" y="810" text-anchor="middle">The checkpoint key identifies one migration cursor; replacing the store changes persistence, not step behavior.</text>
</svg>
