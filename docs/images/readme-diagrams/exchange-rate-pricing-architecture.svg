<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 14 7 L 0 14 Z" fill="#2563eb" stroke="#2563eb" stroke-dasharray="none"/>
    </marker>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 14 7 L 0 14 Z" fill="#059669" stroke="#059669" stroke-dasharray="none"/>
    </marker>
    <marker id="arrow-purple" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 14 7 L 0 14 Z" fill="#7c3aed" stroke="#7c3aed" stroke-dasharray="none"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font-family: "Architects Daughter", "Comic Sans MS", cursive; font-size: 52px; fill: #0f172a; }
      .subtitle { font-family: "Comic Mono", "SFMono-Regular", monospace; font-size: 24px; fill: #475569; }
      .label { font-family: "Architects Daughter", "Comic Sans MS", cursive; font-size: 33px; fill: #0f172a; }
      .small { font-family: "Comic Mono", "SFMono-Regular", monospace; font-size: 22px; fill: #334155; }
      .tiny { font-family: "Comic Mono", "SFMono-Regular", monospace; font-size: 19px; fill: #475569; }
      .lane { fill: #eef6ff; stroke: #bfdbfe; stroke-width: 3; rx: 28; }
      .lane2 { fill: #ecfdf5; stroke: #a7f3d0; stroke-width: 3; rx: 28; }
      .card { fill: #ffffff; stroke: #334155; stroke-width: 4; rx: 24; }
      .code { fill: #fff7ed; stroke: #f97316; stroke-width: 4; rx: 24; }
      .provider { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 4; rx: 24; }
      .result { fill: #ecfeff; stroke: #0891b2; stroke-width: 4; rx: 24; }
      .line-blue { fill: none; stroke: #2563eb; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-blue); }
      .line-green { fill: none; stroke: #059669; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-green); }
      .line-purple { fill: none; stroke: #7c3aed; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-purple); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="900"/>
  <text class="title" x="70" y="95">Provider-backed exchange-rate pricing</text>
  <text class="subtitle" x="74" y="138">The app owns pricing, while bluetape-go/money owns locale currency and provider conversion boundaries.</text>

  <rect class="lane" x="70" y="175" width="1460" height="290"/>
  <text class="subtitle" x="105" y="220">Request boundary</text>
  <rect class="card" x="115" y="255" width="290" height="150"/>
  <text class="label" x="150" y="322">Buyer request</text>
  <text class="small" x="150" y="360">locale: ko-KR</text>
  <text class="small" x="150" y="390">base: USD</text>

  <rect class="card" x="530" y="245" width="350" height="170"/>
  <g data-bluetape4k-icon="generic-microservice" transform="translate(560 290) scale(0.484)">
    <rect x="10" y="12" width="108" height="104" rx="18" fill="#f8fafc" stroke="#334155" stroke-width="6"/>
    <rect x="28" y="30" width="72" height="22" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="5"/>
    <rect x="28" y="76" width="72" height="22" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="5"/>
    <path d="M48 52v10c0 5 4 9 9 9h14c5 0 9-4 9-9V52" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="42" cy="41" r="4" fill="#2563eb"/>
    <circle cx="42" cy="87" r="4" fill="#16a34a"/>
    <path d="M86 40h10M86 86h10" fill="none" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text class="label" x="650" y="308">Gin pricing API</text>
  <text class="small" x="650" y="348">POST /quotes</text>
  <text class="small" x="650" y="382">bounded HTTP body</text>

  <rect class="code" x="1030" y="245" width="390" height="170"/>
  <text class="label" x="1070" y="302">Service.Quote</text>
  <text class="small" x="1070" y="342">subtotal in base currency</text>
  <text class="small" x="1070" y="376">provider call gets deadline</text>

  <path class="line-blue" d="M 405 330 H 515"/>
  <path class="line-blue" d="M 880 330 H 1015"/>

  <rect class="lane2" x="70" y="510" width="1460" height="290"/>
  <text class="subtitle" x="105" y="555">Money conversion boundary</text>
  <rect class="code" x="115" y="610" width="330" height="135"/>
  <text class="label" x="150" y="662">CurrencyByLocale</text>
  <text class="small" x="150" y="704">ko-KR becomes KRW</text>

  <rect class="code" x="535" y="600" width="405" height="155"/>
  <text class="label" x="575" y="655">ConvertWithProvider</text>
  <text class="small" x="575" y="696">uses ExchangeRateProvider</text>
  <text class="small" x="575" y="728">returns quote metadata</text>

  <rect class="provider" x="1035" y="600" width="390" height="155"/>
  <text class="label" x="1075" y="655">Rate provider</text>
  <text class="small" x="1075" y="696">ECB/IMF shape</text>
  <text class="small" x="1075" y="728">fresh or stale snapshot</text>

  <path class="line-green" d="M 1225 415 V 585"/>
  <path class="line-green" d="M 445 678 H 520"/>
  <path class="line-purple" d="M 940 678 H 1020"/>

  <rect class="result" x="910" y="806" width="560" height="70"/>
  <text class="small" x="945" y="834">
    <tspan x="945" dy="0">response includes display total</tspan>
    <tspan x="945" dy="31">and rate freshness</tspan>
  </text>
  <path class="line-blue" d="M 1230 755 V 797"/>
</svg>
