<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="992" viewBox="-60 0 1500 992" role="img" aria-labelledby="title desc">
  <title id="title">Order Fulfillment Integration Sequence</title>
  <desc id="desc">Best-practices sequence diagram with participant cards, lifelines, activations, numbered labels, and branch frame.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
    <marker id="arrow-call" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 13 13" data-role="sequence" data-tip-direction="positive-x"><path d="M 1.04 1.3 L 11.96 6.5 L 1.04 11.7 Z" fill="#3F7D9C" stroke="#3F7D9C" stroke-width="0" stroke-dasharray="none"/></marker>
    <marker id="arrow-return" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 13 13" data-role="sequence" data-tip-direction="positive-x"><path d="M 1.04 1.3 L 11.96 6.5 L 1.04 11.7 Z" fill="#6E8F4F" stroke="#6E8F4F" stroke-width="0" stroke-dasharray="none"/></marker>
    <marker id="arrow-async" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 13 13" data-role="sequence" data-tip-direction="positive-x"><path d="M 1.04 1.3 L 11.96 6.5 L 1.04 11.7 Z" fill="#755BC6" stroke="#755BC6" stroke-width="0" stroke-dasharray="none"/></marker>
    <marker id="arrow-fail" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 13 13" data-role="sequence" data-tip-direction="positive-x"><path d="M 1.04 1.3 L 11.96 6.5 L 1.04 11.7 Z" fill="#B86868" stroke="#B86868" stroke-width="0" stroke-dasharray="none"/></marker>
    <style>
      @font-face { font-family: 'Architects Daughter'; src: url('file:///Users/debop/Library/Fonts/ArchitectsDaughter-Regular.ttf') format('truetype'); }
      @font-face { font-family: 'Comic Mono'; src: url('file:///Users/debop/Library/Fonts/ComicMono.ttf') format('truetype'); }
      .canvas{fill:#fbfcf8}.title{font-family:'Architects Daughter';font-size:40px;fill:#263238}.subtitle,.detail,.footer{font-family:'Comic Mono';fill:#36464f}.subtitle{font-size:16px}.footer{font-size:14px;fill:#60727d}.cardTitle{font-family:'Architects Daughter';font-size:21px;fill:#1f3138}.role{font-family:'Comic Mono';font-size:12px;fill:#546a73}.card{fill:#ffffff;stroke-width:2;filter:url(#shadow)}.lifeline{stroke:#9aaab1;stroke-width:2;stroke-dasharray:7 8;stroke-linecap:round}.activation{fill:#e6f2ec;stroke:#5b7e67;stroke-width:1.5}.call,.return,.async,.fail{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.call{stroke:#3F7D9C;marker-end:url(#arrow-call)}.return{stroke:#6E8F4F;stroke-width:2.6;stroke-dasharray:8 6;marker-end:url(#arrow-return)}.async{stroke:#755BC6;marker-end:url(#arrow-async)}.fail{stroke:#B86868;marker-end:url(#arrow-fail)}.alt{fill:#eef7f0;fill-opacity:.14;stroke:#78909c;stroke-width:2.4;stroke-dasharray:12 7}.label{fill:#ffffff;stroke:#d7e0e4;stroke-width:1.3}.callLabel{stroke:#9cc2d1}.returnLabel{stroke:#b6c9a4}.asyncLabel{stroke:#b8a9d5}.failLabel{stroke:#d9abab}.badgeText,.msg{font-family:'Comic Mono';font-size:12px;font-weight:700}.msg{font-size:13px}.callText{fill:#2f6f8e}.returnText{fill:#55783F}.asyncText{fill:#674b91}.failText{fill:#9d4f4f}
    </style>
  </defs>
  <rect class="canvas" x="-60" y="0" width="1500" height="992"/>
  <text class="title" x="690" y="64" text-anchor="middle">Order Fulfillment Integration Sequence</text>
  <text class="subtitle" x="690" y="98" text-anchor="middle">A single POST drives forward work, optional reverse compensation, cancellation-safe cleanup, and stable report projection.</text>
  <g id="participant-1"><rect class="card" x="0" y="150" width="190" height="78" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/><text class="cardTitle" x="95" y="188" text-anchor="middle">Client</text><text class="role" x="95" y="210" text-anchor="middle"></text><line class="lifeline" x1="95" y1="228" x2="95" y2="884"/></g>
  <g id="participant-2"><rect class="card" x="297.5" y="150" width="190" height="78" rx="10" fill="#FFF3D9" stroke="#D6A441"/><text class="cardTitle" x="392.5" y="188" text-anchor="middle">Handler</text><text class="role" x="392.5" y="210" text-anchor="middle"></text><line class="lifeline" x1="392.5" y1="228" x2="392.5" y2="884"/></g>
  <g id="participant-3"><rect class="card" x="586" y="150" width="208" height="78" rx="10" fill="#EAF7EF" stroke="#58A978"/><text class="cardTitle" x="690" y="188" text-anchor="middle">Forward</text><text class="role" x="690" y="210" text-anchor="middle">StopOnFailure</text><line class="lifeline" x1="690" y1="228" x2="690" y2="884"/></g>
  <g id="participant-4"><rect class="card" x="892.5" y="150" width="190" height="78" rx="10" fill="#F1ECFF" stroke="#8A72D6"/><text class="cardTitle" x="987.5" y="188" text-anchor="middle">State</text><text class="role" x="987.5" y="210" text-anchor="middle">lifecycle</text><line class="lifeline" x1="987.5" y1="228" x2="987.5" y2="884"/></g>
  <g id="participant-5"><rect class="card" x="1175" y="150" width="220" height="78" rx="10" fill="#FDECEF" stroke="#DC6B82"/><text class="cardTitle" x="1285" y="188" text-anchor="middle">Compensation</text><text class="role" x="1285" y="210" text-anchor="middle">reverse stack</text><line class="lifeline" x1="1285" y1="228" x2="1285" y2="884"/></g>
  <rect class="activation" x="385.5" y="302" width="14" height="562" rx="6"/>
  <rect class="activation" x="683" y="356" width="14" height="232" rx="6"/>
  <rect class="activation" x="980.5" y="410" width="14" height="412" rx="6"/>
  <rect class="activation" x="1278" y="464" width="14" height="358" rx="6"/>
  <rect class="alt" x="64" y="503" width="1252" height="399" rx="16"/><rect class="label failLabel" x="88" y="489" width="230" height="28" rx="8"/><text class="msg failText" x="203" y="508" text-anchor="middle">alt failure / retry path</text>
  <g id="message-1"><rect class="label callLabel" x="115.8" y="286" width="256" height="28" rx="8"/><circle cx="133.8" cy="300" r="12" fill="#3F7D9C"/><text class="badgeText" x="133.8" y="304" text-anchor="middle" fill="#fff">1</text><text class="msg callText" x="251.8" y="304" text-anchor="middle">POST order fulfillment</text><path class="call" d="M 95 322 H 392.5"/></g>
  <g id="message-2"><rect class="label returnLabel" x="422.2" y="338" width="238" height="28" rx="8"/><circle cx="440.2" cy="352" r="12" fill="#6E8F4F"/><text class="badgeText" x="440.2" y="356" text-anchor="middle" fill="#fff">2</text><text class="msg returnText" x="549.2" y="356" text-anchor="middle">Run forward workflow</text><path class="return" d="M 392.5 376 H 690"/></g>
  <g id="message-3"><rect class="label returnLabel" x="706.2" y="392" width="265" height="28" rx="8"/><circle cx="724.2" cy="406" r="12" fill="#6E8F4F"/><text class="badgeText" x="724.2" y="410" text-anchor="middle" fill="#fff">3</text><text class="msg returnText" x="846.8" y="410" text-anchor="middle">submit, pay, pack, ship</text><path class="return" d="M 690 430 H 987.5"/></g>
  <g id="message-4"><rect class="label asyncLabel" x="822.5" y="446" width="330" height="28" rx="8"/><circle cx="840.5" cy="460" r="12" fill="#755BC6"/><text class="badgeText" x="840.5" y="464" text-anchor="middle" fill="#fff">4</text><text class="msg asyncText" x="995.5" y="464" text-anchor="middle">reserve pushes release; payment pushes void</text><path class="async" d="M 690 484 H 1285"/></g>
  <g id="message-5"><rect class="label failLabel" x="376.2" y="510" width="330" height="28" rx="8"/><circle cx="394.2" cy="524" r="12" fill="#B86868"/><text class="badgeText" x="394.2" y="528" text-anchor="middle" fill="#fff">5</text><text class="msg failText" x="549.2" y="528" text-anchor="middle">invalid transition or shipment failure</text><path class="fail" d="M 690 548 H 392.5"/></g>
  <g id="message-6"><rect class="label failLabel" x="673.8" y="576" width="330" height="28" rx="8"/><circle cx="691.8" cy="590" r="12" fill="#B86868"/><text class="badgeText" x="691.8" y="594" text-anchor="middle" fill="#fff">6</text><text class="msg failText" x="846.8" y="594" text-anchor="middle">Run reverse stack with ContinueOnFailure</text><path class="fail" d="M 392.5 614 H 1285"/></g>
  <g id="message-7"><rect class="label asyncLabel" x="1053.2" y="636" width="166" height="28" rx="8"/><circle cx="1071.2" cy="650" r="12" fill="#755BC6"/><text class="badgeText" x="1071.2" y="654" text-anchor="middle" fill="#fff">7</text><text class="msg asyncText" x="1144.2" y="654" text-anchor="middle">void-payment</text><path class="async" d="M 1285 674 H 987.5"/></g>
  <g id="message-8"><rect class="label asyncLabel" x="1030.8" y="690" width="211" height="28" rx="8"/><circle cx="1048.8" cy="704" r="12" fill="#755BC6"/><text class="badgeText" x="1048.8" y="708" text-anchor="middle" fill="#fff">8</text><text class="msg asyncText" x="1144.2" y="708" text-anchor="middle">release-inventory</text><path class="async" d="M 1285 728 H 987.5"/></g>
  <g id="message-9"><rect class="label failLabel" x="1030.8" y="744" width="211" height="28" rx="8"/><circle cx="1048.8" cy="758" r="12" fill="#B86868"/><text class="badgeText" x="1048.8" y="762" text-anchor="middle" fill="#fff">9</text><text class="msg failText" x="1144.2" y="762" text-anchor="middle">cancel when legal</text><path class="fail" d="M 1285 782 H 987.5"/></g>
  <g id="message-10"><rect class="label failLabel" x="78.8" y="804" width="330" height="28" rx="8"/><circle cx="96.8" cy="818" r="12" fill="#B86868"/><text class="badgeText" x="96.8" y="822" text-anchor="middle" fill="#fff">10</text><text class="msg failText" x="251.8" y="822" text-anchor="middle">state, summary, report, original_error</text><path class="fail" d="M 392.5 842 H 95"/></g>
  <g><rect x="165.6" y="922" width="1048.8" height="42" rx="12" fill="#ffffff" stroke="#D6E3EF" stroke-width="1.6"/><text class="footer" x="690" y="949" text-anchor="middle">Cancellation before side effects returns 408; cancellation after reservation still releases inventory before returning.</text></g>
</svg>
