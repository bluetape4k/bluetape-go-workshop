<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="760" viewBox="0 0 1420 760" role="img" aria-labelledby="title desc">
  <title id="title">Catalog Near-Cache Cold-Miss Scenario</title>
  <desc id="desc">Two catalog peers miss the same SKU, Redis stampede coordination selects one backing loader, and Redis result keys return the same product to both peers.</desc>
  <defs>
    <marker id="scenario-neutral" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="1,1 7,4 1,7" fill="#47616f"/>
    </marker>
    <marker id="scenario-load" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="1,1 7,4 1,7" fill="#4f8b63"/>
    </marker>
    <marker id="scenario-invalidate" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="1,1 7,4 1,7" fill="#8a6bb0"/>
    </marker>
    <marker id="scenario-write" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="1,1 7,4 1,7" fill="#b95f7a"/>
    </marker>
    <style>
      @font-face { font-family: 'Architects Daughter'; src: url('file:///Users/debop/Library/Fonts/ArchitectsDaughter-Regular.ttf') format('truetype'); }
      @font-face { font-family: 'Comic Mono'; src: url('file:///Users/debop/Library/Fonts/ComicMono.ttf') format('truetype'); }
      .title { font-family: 'Architects Daughter'; font-size: 36px; fill: #243845; }
      .subtitle { font-family: 'Comic Mono'; font-size: 15px; fill: #536d7d; }
      .card-title { font-family: 'Architects Daughter'; font-size: 24px; fill: #243845; }
      .card-text { font-family: 'Comic Mono'; font-size: 15px; fill: #344b59; }
      .label { font-family: 'Comic Mono'; font-size: 13px; fill: #35505f; }
      .small { font-family: 'Comic Mono'; font-size: 12px; fill: #536d7d; }
      .neutral { fill: none; stroke: #47616f; stroke-width: 3; marker-end: url(#scenario-neutral); }
      .load { fill: none; stroke: #4f8b63; stroke-width: 3; marker-end: url(#scenario-load); }
      .invalidate { fill: none; stroke: #8a6bb0; stroke-width: 3; marker-end: url(#scenario-invalidate); }
      .write { fill: none; stroke: #b95f7a; stroke-width: 3; marker-end: url(#scenario-write); }
    </style>
  </defs>

  <rect x="0" y="0" width="1420" height="760" fill="#fbfaf6"/>
  <text class="title" x="710" y="58" text-anchor="middle">Catalog Near-Cache Cold Miss</text>
  <text class="subtitle" x="710" y="91" text-anchor="middle">A cold burst shares one backing loader while waiters read the Redis result envelope.</text>

  <g transform="translate(92 200)">
    <rect width="210" height="130" rx="12" fill="#d7ecf2" stroke="#48758d" stroke-width="2"/>
    <text class="card-title" x="105" y="48" text-anchor="middle">Peer A Read</text>
    <text class="card-text" x="105" y="80" text-anchor="middle">GetProduct(sku-2)</text>
    <text class="card-text" x="105" y="104" text-anchor="middle">cold local miss</text>
  </g>

  <g transform="translate(92 465)">
    <rect width="210" height="130" rx="12" fill="#f7e5aa" stroke="#b99b5d" stroke-width="2"/>
    <text class="card-title" x="105" y="48" text-anchor="middle">Peer B Read</text>
    <text class="card-text" x="105" y="80" text-anchor="middle">same SKU burst</text>
    <text class="card-text" x="105" y="104" text-anchor="middle">waits for result</text>
  </g>

  <g transform="translate(560 315)">
    <rect width="260" height="150" rx="12" fill="#f5d3df" stroke="#b95f7a" stroke-width="2"/>
    <image data-bluetape4k-icon="redis" href="data:image/svg+xml;base64," x="28" y="36" width="54" height="54"/>
    <text class="card-title" x="158" y="52" text-anchor="middle">Redis</text>
    <text class="card-text" x="158" y="84" text-anchor="middle">owner lock</text>
    <text class="card-text" x="158" y="108" text-anchor="middle">result envelope</text>
  </g>

  <g transform="translate(1030 315)">
    <rect width="280" height="150" rx="12" fill="#dbe8d4" stroke="#5d8a62" stroke-width="2"/>
    <text class="card-title" x="140" y="52" text-anchor="middle">Authoritative Store</text>
    <text class="card-text" x="140" y="84" text-anchor="middle">Store.Load</text>
    <text class="card-text" x="140" y="108" text-anchor="middle">one LoadCount hit</text>
  </g>

  <path class="neutral" d="M 302 265 H 474 Q 486 265 486 277 V 356 Q 486 368 498 368 H 560"/><rect x="350" y="235" width="132" height="22" rx="7" fill="#fbfaf6"/><text class="label" x="416" y="251" text-anchor="middle">owner attempt</text>
  <path class="neutral" d="M 302 530 H 410 Q 422 530 422 518 V 410 Q 422 398 434 398 H 560"/><rect x="336" y="500" width="136" height="22" rx="7" fill="#fbfaf6"/><text class="label" x="404" y="516" text-anchor="middle">waiter attempt</text>
  <path class="load" d="M 820 390 H 1030"/><rect x="878" y="360" width="132" height="22" rx="7" fill="#fbfaf6"/><text class="label" x="944" y="376" text-anchor="middle">single loader</text>
  <path class="load" d="M 1170 315 V 250 Q 1170 238 1158 238 H 702 Q 690 238 690 250 V 315"/><rect x="842" y="210" width="144" height="22" rx="7" fill="#fbfaf6"/><text class="label" x="914" y="226" text-anchor="middle">result stored</text>
  <path class="load" d="M 560 350 H 330 Q 318 350 318 338 V 292 Q 318 280 306 280 H 302"/><rect x="390" y="320" width="108" height="22" rx="7" fill="#fbfaf6"/><text class="label" x="444" y="336" text-anchor="middle">Product v1</text>
  <path class="load" d="M 560 452 H 500 Q 488 452 488 464 V 560 Q 488 572 476 572 H 302"/><rect x="354" y="542" width="108" height="22" rx="7" fill="#fbfaf6"/><text class="label" x="408" y="558" text-anchor="middle">same result</text>

  <rect x="185" y="682" width="1070" height="42" rx="12" fill="#edf1e9" stroke="#5d8a62"/>
  <text class="subtitle" x="720" y="709" text-anchor="middle">Test evidence: two peer reads share one Store.Load call for the same SKU.</text>
</svg>
