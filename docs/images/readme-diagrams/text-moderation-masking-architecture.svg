<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc">
  <title id="title">Text moderation masking architecture</title>
  <desc id="desc">Application-owned moderation policy calls textsearch blockword matching, allowlist subtraction, and deterministic masking.</desc>
  <defs>
    <style>
      text { font-family: "Comic Mono", "Architects Daughter", "Comic Sans MS", monospace; fill: #172033; }
      .title { font-family: "Architects Daughter", "Comic Mono", cursive; font-size: 46px; font-weight: 700; }
      .subtitle { font-size: 24px; fill: #46546a; }
      .lane-title { font-size: 29px; font-weight: 700; }
      .card-title { font-size: 29px; font-weight: 700; }
      .card-sub { font-size: 22px; fill: #334155; }
      .small { font-size: 20px; fill: #475569; }
      .label { font-size: 20px; fill: #475569; }
      .label-pill { fill: #ffffff; stroke: #86efac; stroke-width: 3; }
      .canvas { fill: #f8fafc; }
      .lane-app { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 4; }
      .lane-policy { fill: #ecfdf5; stroke: #86efac; stroke-width: 4; }
      .lane-helper { fill: #fff7ed; stroke: #fed7aa; stroke-width: 4; }
      .card-blue { fill: #dbeafe; stroke: #60a5fa; stroke-width: 4; }
      .card-green { fill: #dcfce7; stroke: #22c55e; stroke-width: 4; }
      .card-orange { fill: #ffedd5; stroke: #f97316; stroke-width: 4; }
      .card-red { fill: #fee2e2; stroke: #ef4444; stroke-width: 4; }
      .note { fill: #ffffff; stroke: #cbd5e1; stroke-width: 4; }
      .flow { fill: none; stroke: #2563eb; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-blue); }
      .policy-flow { fill: none; stroke: #059669; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-green); }
      .helper-flow { fill: none; stroke: #ea580c; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-orange); }
    </style>
    <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 14 7 L 0 14 z" fill="#2563eb" stroke-dasharray="none"/>
    </marker>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 14 7 L 0 14 z" fill="#059669" stroke-dasharray="none"/>
    </marker>
    <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 14 7 L 0 14 z" fill="#ea580c" stroke-dasharray="none"/>
    </marker>
  </defs>

  <rect class="canvas" width="1800" height="1080"/>
  <text class="title" x="70" y="80">Text moderation masking</text>
  <text class="subtitle" x="70" y="122">A local policy pass uses textsearch for exact matching, not a network model or tokenizer pipeline.</text>

  <rect class="lane-app" x="70" y="170" width="1660" height="250" rx="26"/>
  <text class="lane-title" x="110" y="220">Application review boundary</text>
  <rect class="card-blue" x="145" y="270" width="330" height="105" rx="18"/>
  <text class="card-title" x="190" y="318">Caller</text>
  <text class="card-sub" x="190" y="352">content id + comment</text>
  <rect class="card-green" x="650" y="260" width="500" height="125" rx="18"/>
  <text class="card-title" x="710" y="310">Moderation service</text>
  <text class="card-sub" x="710" y="345">decision + masked projection</text>
  <rect class="card-blue" x="1330" y="270" width="330" height="105" rx="18"/>
  <text class="card-title" x="1380" y="318">Reader</text>
  <text class="card-sub" x="1380" y="352">stable JSON result</text>
  <path class="flow" d="M 475 322 H 650"/>
  <text class="label" x="520" y="300">Evaluate</text>
  <path class="flow" d="M 1150 322 H 1330"/>
  <text class="label" x="1190" y="300">ReviewResult</text>

  <rect class="lane-policy" x="70" y="500" width="760" height="390" rx="26"/>
  <text class="lane-title" x="110" y="550">Application-owned policy</text>
  <rect class="note" x="140" y="610" width="260" height="110" rx="16"/>
  <text class="card-title" x="175" y="655">Blockwords</text>
  <text class="small" x="175" y="688">bad, bad wolf, scam</text>
  <text class="small" x="175" y="716">ko abuse, ko fraud</text>
  <rect class="note" x="500" y="610" width="260" height="110" rx="16"/>
  <text class="card-title" x="535" y="655">Allowlist</text>
  <text class="small" x="535" y="688">bad wolf book club</text>
  <rect class="card-red" x="230" y="775" width="380" height="78" rx="16"/>
  <text class="card-title" x="285" y="825">Not a security boundary</text>

  <rect class="lane-helper" x="970" y="500" width="760" height="390" rx="26"/>
  <text class="lane-title" x="1010" y="550">textsearch deterministic helpers</text>
  <rect class="card-orange" x="1045" y="610" width="300" height="110" rx="16"/>
  <text class="card-title" x="1085" y="655">Dictionary</text>
  <text class="small" x="1085" y="688">immutable Aho-Corasick</text>
  <rect class="card-orange" x="1410" y="610" width="250" height="110" rx="16"/>
  <text class="card-title" x="1450" y="655">Boundary</text>
  <text class="small" x="1450" y="688">Unicode word spans</text>
  <rect class="card-orange" x="1210" y="775" width="300" height="78" rx="16"/>
  <text class="card-title" x="1265" y="825">Mask exact spans</text>

  <path class="policy-flow" d="M 900 385 V 455 Q 900 500 855 500 H 455 Q 420 500 420 610"/>
  <text class="label" x="665" y="480">compile policy</text>
  <path class="helper-flow" d="M 1040 385 V 455 Q 1040 500 1085 500 H 1195 Q 1195 500 1195 610"/>
  <text class="label" x="1055" y="480">match text</text>
  <path class="helper-flow" d="M 1345 665 H 1410"/>
  <path class="helper-flow" d="M 1535 720 V 775 H 1510"/>
  <path class="policy-flow" d="M 760 665 H 1045"/>
  <rect class="label-pill" x="760" y="588" width="405" height="42" rx="21"/>
  <text class="label" x="790" y="616">allowlist subtracts safe spans</text>

  <rect class="note" x="215" y="950" width="1370" height="70" rx="18"/>
  <text class="small" x="260" y="993">Reader contract: exact phrase search and masking are deterministic; tokenizer and language detection remain separate v0.8.0 lessons.</text>
</svg>
