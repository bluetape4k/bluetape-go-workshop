<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="780" viewBox="0 0 1420 780" role="img" aria-labelledby="title desc">
  <title id="title">Catalog Near-Cache Redis Architecture</title>
  <desc id="desc">A catalog peer composes cache.NewMemory, redisnear.NewPubSub, and rediscoord.NewStampedeCache around a caller-owned Redis client and authoritative store.</desc>
  <defs>
    <marker id="arch-main" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polygon points="1,1 7,4 1,7" fill="#47616f"/></marker>
    <marker id="arch-cache" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polygon points="1,1 7,4 1,7" fill="#4f8b63"/></marker>
    <marker id="arch-redis" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polygon points="1,1 7,4 1,7" fill="#b95f7a"/></marker>
    <style>
      @font-face { font-family: 'Architects Daughter'; src: url('file:///Users/debop/Library/Fonts/ArchitectsDaughter-Regular.ttf') format('truetype'); }
      @font-face { font-family: 'Comic Mono'; src: url('file:///Users/debop/Library/Fonts/ComicMono.ttf') format('truetype'); }
      .title { font-family: 'Architects Daughter'; font-size: 36px; fill: #243845; }
      .subtitle { font-family: 'Comic Mono'; font-size: 15px; fill: #536d7d; }
      .layer-label { font-family: 'Architects Daughter'; font-size: 20px; fill: #49606d; }
      .card-title { font-family: 'Architects Daughter'; font-size: 23px; fill: #243845; }
      .card-text { font-family: 'Comic Mono'; font-size: 14px; fill: #344b59; }
      .label { font-family: 'Comic Mono'; font-size: 13px; fill: #35505f; }
      .layer { fill: #ffffff; stroke: #d8e2e8; stroke-width: 2; rx: 18; }
      .main { fill: none; stroke: #47616f; stroke-width: 3; marker-end: url(#arch-main); }
      .cache { fill: none; stroke: #4f8b63; stroke-width: 3; marker-end: url(#arch-cache); }
      .redis { fill: none; stroke: #b95f7a; stroke-width: 3; marker-end: url(#arch-redis); }
    </style>
  </defs>

  <rect x="0" y="0" width="1420" height="780" fill="#fbfaf6"/>
  <text class="title" x="710" y="58" text-anchor="middle">Catalog Near-Cache Architecture</text>
  <text class="subtitle" x="710" y="91" text-anchor="middle">The example peer is a small composition boundary, not a reusable catalog framework.</text>

  <rect class="layer" x="42" y="146" width="276" height="506" fill="#f4f9fb" stroke="#c8dce5"/>
  <text class="layer-label" x="180" y="180" text-anchor="middle">Domain API</text>
  <rect class="layer" x="372" y="146" width="400" height="506" fill="#fbf7e7" stroke="#e6d8a8"/>
  <text class="layer-label" x="572" y="180" text-anchor="middle">Cache composition</text>
  <rect class="layer" x="826" y="146" width="318" height="506" fill="#f7f0f8" stroke="#dcc9e8"/>
  <text class="layer-label" x="985" y="180" text-anchor="middle">Store and Redis</text>
  <rect class="layer" x="1198" y="146" width="180" height="506" fill="#edf7e9" stroke="#c9ddc1"/>
  <text class="layer-label" x="1288" y="180" text-anchor="middle">Local memory</text>

  <g transform="translate(78 284)">
    <rect width="204" height="128" rx="12" fill="#d7ecf2" stroke="#48758d" stroke-width="2"/>
    <text class="card-title" x="102" y="42" text-anchor="middle">Peer API</text>
    <text class="card-text" x="102" y="75" text-anchor="middle">GetProduct</text>
    <text class="card-text" x="102" y="99" text-anchor="middle">PutProduct</text>
  </g>

  <g transform="translate(420 228)">
    <rect width="304" height="132" rx="12" fill="#f7e5aa" stroke="#b99b5d" stroke-width="2"/>
    <text class="card-title" x="152" y="45" text-anchor="middle">StampedeCache</text>
    <text class="card-text" x="152" y="77" text-anchor="middle">owner token per key</text>
    <text class="card-text" x="152" y="101" text-anchor="middle">result envelope waiters</text>
  </g>
  <g transform="translate(420 456)">
    <rect width="304" height="132" rx="12" fill="#eadcf5" stroke="#8a6bb0" stroke-width="2"/>
    <text class="card-title" x="152" y="45" text-anchor="middle">NearCache Pub/Sub</text>
    <text class="card-text" x="152" y="77" text-anchor="middle">origin id filtering</text>
    <text class="card-text" x="152" y="101" text-anchor="middle">local delete on peer event</text>
  </g>

  <g transform="translate(870 222)">
    <rect width="230" height="110" rx="12" fill="#efe7d2" stroke="#a78335" stroke-width="2"/>
    <text class="card-title" x="115" y="42" text-anchor="middle">Store</text>
    <text class="card-text" x="115" y="72" text-anchor="middle">authoritative projection</text>
    <text class="card-text" x="115" y="96" text-anchor="middle">LoadCount proves misses</text>
  </g>
  <g transform="translate(858 486)">
    <rect width="254" height="120" rx="12" fill="#f5d3df" stroke="#b95f7a" stroke-width="2"/>
    <image href="data:image/svg+xml;base64," x="22" y="34" width="52" height="52"/>
    <text class="card-title" x="154" y="45" text-anchor="middle">Redis Client</text>
    <text class="card-text" x="154" y="76" text-anchor="middle">Pub/Sub channel</text>
    <text class="card-text" x="154" y="100" text-anchor="middle">lock + result keys</text>
  </g>

  <g transform="translate(1218 302)">
    <rect width="140" height="132" rx="12" fill="#dbe8d4" stroke="#5d8a62" stroke-width="2"/>
    <text class="card-title" x="70" y="38" text-anchor="middle">Memory</text>
    <text class="card-title" x="70" y="65" text-anchor="middle">Cache</text>
    <text class="card-text" x="70" y="96" text-anchor="middle">TTL entries</text>
    <text class="card-text" x="70" y="116" text-anchor="middle">per peer</text>
  </g>

  <path class="main" d="M 282 330 H 420"/><rect x="300" y="300" width="92" height="22" rx="7" fill="#fbfaf6"/><text class="label" x="346" y="316" text-anchor="middle">GetOrLoad</text>
  <path class="redis" d="M 282 366 H 342 Q 354 366 354 378 V 510 Q 354 522 366 522 H 420"/><rect x="290" y="436" width="154" height="22" rx="7" fill="#fbfaf6"/><text class="label" x="367" y="452" text-anchor="middle">Set invalidates</text>
  <path class="main" d="M 180 412 V 646 Q 180 658 192 658 H 830 Q 842 658 842 646 V 277 Q 842 265 854 265 H 870"/><rect x="322" y="626" width="178" height="22" rx="7" fill="#fbfaf6"/><text class="label" x="411" y="642" text-anchor="middle">PutProduct writes source</text>

  <path class="cache" d="M 572 360 V 456"/><rect x="590" y="398" width="136" height="22" rx="7" fill="#fbfaf6"/><text class="label" x="658" y="414" text-anchor="middle">cache read/write</text>
  <path class="main" d="M 724 294 H 870"/><rect x="752" y="266" width="104" height="22" rx="7" fill="#fbfaf6"/><text class="label" x="804" y="282" text-anchor="middle">owner loader</text>
  <path class="redis" d="M 724 320 H 792 Q 804 320 804 332 V 510 Q 804 522 816 522 H 858"/><rect x="738" y="404" width="136" height="22" rx="7" fill="#fbfaf6"/><text class="label" x="806" y="420" text-anchor="middle">lock/result keys</text>
  <path class="redis" d="M 724 522 H 858"/><rect x="740" y="492" width="100" height="22" rx="7" fill="#fbfaf6"/><text class="label" x="790" y="508" text-anchor="middle">channel</text>
  <path class="cache" d="M 724 486 H 760 Q 772 486 772 474 V 452 Q 772 440 784 440 H 1180 Q 1192 440 1192 428 V 368 Q 1192 356 1218 356"/><rect x="1042" y="410" width="108" height="22" rx="7" fill="#fbfaf6"/><text class="label" x="1096" y="426" text-anchor="middle">local entries</text>

  <rect x="236" y="704" width="948" height="42" rx="12" fill="#edf1e9" stroke="#5d8a62"/>
  <text class="subtitle" x="710" y="731" text-anchor="middle">Redis clients remain caller-owned; Peer.Close only stops the near-cache subscriber.</text>
</svg>
