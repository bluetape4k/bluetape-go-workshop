<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="780" viewBox="0 0 1420 780" role="img" aria-labelledby="title desc">
  <title id="title">Catalog Near-Cache Redis Architecture</title>
  <desc id="desc">A catalog peer composes cache.NewMemory, redisnear.NewPubSub, and rediscoord.NewStampedeCache around a caller-owned Redis client and authoritative store.</desc>
  <defs>
    <marker id="arch-main" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse" data-role="secondary" data-tip-direction="positive-x"><path d="M 0.8 1 L 9.2 5 L 0.8 9 Z" fill="#47616f" stroke="#47616f" stroke-width="0" stroke-dasharray="none"/></marker>
    <marker id="arch-cache" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse" data-role="secondary" data-tip-direction="positive-x"><path d="M 0.8 1 L 9.2 5 L 0.8 9 Z" fill="#4f8b63" stroke="#4f8b63" stroke-width="0" stroke-dasharray="none"/></marker>
    <marker id="arch-redis" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse" data-role="secondary" data-tip-direction="positive-x"><path d="M 0.8 1 L 9.2 5 L 0.8 9 Z" fill="#b95f7a" stroke="#b95f7a" stroke-width="0" stroke-dasharray="none"/></marker>
    <style>
      @font-face { font-family: 'Architects Daughter'; src: url('file:///Users/debop/Library/Fonts/ArchitectsDaughter-Regular.ttf') format('truetype'); }
      @font-face { font-family: 'Comic Mono'; src: url('file:///Users/debop/Library/Fonts/ComicMono.ttf') format('truetype'); }
      .title { font-family: 'Architects Daughter'; font-size: 36px; fill: #243845; }
      .subtitle { font-family: 'Comic Mono'; font-size: 15px; fill: #536d7d; }
      .layer-label { font-family: 'Architects Daughter'; font-size: 20px; fill: #49606d; }
      .card-title { font-family: 'Architects Daughter'; font-size: 23px; fill: #243845; }
      .card-text { font-family: 'Comic Mono'; font-size: 14px; fill: #344b59; }
      .label { font-family: 'Comic Mono'; font-size: 13px; fill: #35505f; }
      .layer { fill: #ffffff; stroke: #d8e2e8; stroke-width: 2; rx: 18; }
      .main { fill: none; stroke: #47616f; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arch-main); }
      .cache { fill: none; stroke: #4f8b63; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arch-cache); }
      .redis { fill: none; stroke: #b95f7a; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arch-redis); }
    </style>
  </defs>

  <rect x="0" y="0" width="1420" height="780" fill="#fbfaf6"/>
  <text class="title" x="710" y="58" text-anchor="middle">Catalog Near-Cache Architecture</text>
  <text class="subtitle" x="710" y="91" text-anchor="middle">The example peer is a small composition boundary, not a reusable catalog framework.</text>

  <rect class="layer" x="44" y="146" width="276" height="506" fill="#f4f9fb" stroke="#c8dce5"/>
  <text class="layer-label" x="182" y="180" text-anchor="middle">Domain API</text>
  <rect class="layer" x="374" y="146" width="514" height="506" fill="#fbf7e7" stroke="#e6d8a8"/>
  <text class="layer-label" x="631" y="180" text-anchor="middle">Peer cache boundary</text>
  <rect class="layer" x="942" y="146" width="400" height="506" fill="#f7f0f8" stroke="#dcc9e8"/>
  <text class="layer-label" x="1142" y="180" text-anchor="middle">Store and Redis</text>

  <g transform="translate(84 284)">
    <rect width="204" height="128" rx="12" fill="#d7ecf2" stroke="#48758d" stroke-width="2"/>
    <text class="card-title" x="102" y="42" text-anchor="middle">Peer API</text>
    <text class="card-text" x="102" y="75" text-anchor="middle">GetProduct</text>
    <text class="card-text" x="102" y="99" text-anchor="middle">PutProduct</text>
  </g>

  <g transform="translate(432 218)">
    <rect width="304" height="132" rx="12" fill="#f7e5aa" stroke="#b99b5d" stroke-width="2"/>
    <text class="card-title" x="152" y="45" text-anchor="middle">StampedeCache</text>
    <text class="card-text" x="152" y="77" text-anchor="middle">owner token per key</text>
    <text class="card-text" x="152" y="101" text-anchor="middle">result envelope waiters</text>
  </g>
  <g transform="translate(432 438)">
    <rect width="304" height="132" rx="12" fill="#eadcf5" stroke="#8a6bb0" stroke-width="2"/>
    <text class="card-title" x="152" y="45" text-anchor="middle">NearCache Pub/Sub</text>
    <text class="card-text" x="152" y="77" text-anchor="middle">origin id filtering</text>
    <text class="card-text" x="152" y="101" text-anchor="middle">local delete on peer event</text>
  </g>
  <g transform="translate(760 520)">
    <rect width="120" height="76" rx="12" fill="#dbe8d4" stroke="#5d8a62" stroke-width="2"/>
    <text class="card-title" x="60" y="31" text-anchor="middle">Memory</text>
    <text class="card-text" x="60" y="55" text-anchor="middle">TTL entries</text>
  </g>

  <g transform="translate(1000 220)">
    <rect width="270" height="112" rx="12" fill="#efe7d2" stroke="#a78335" stroke-width="2"/>
    <text class="card-title" x="135" y="42" text-anchor="middle">Store</text>
    <text class="card-text" x="135" y="72" text-anchor="middle">authoritative projection</text>
    <text class="card-text" x="135" y="96" text-anchor="middle">LoadCount proves misses</text>
  </g>
  <g transform="translate(1008 474)">
    <rect width="254" height="120" rx="12" fill="#f5d3df" stroke="#b95f7a" stroke-width="2"/>
    <image data-bluetape4k-icon="redis" href="data:image/svg+xml;base64," x="22" y="34" width="52" height="52"/>
    <text class="card-title" x="154" y="45" text-anchor="middle">Redis Client</text>
    <text class="card-text" x="154" y="76" text-anchor="middle">Pub/Sub channel</text>
    <text class="card-text" x="154" y="100" text-anchor="middle">lock + result keys</text>
  </g>

  <path class="main" d="M 288 330 H 432"/><rect x="314" y="300" width="92" height="22" rx="7" fill="#fbfaf6"/><text class="label" x="360" y="316" text-anchor="middle">GetOrLoad</text>
  <path class="redis" d="M 288 366 H 344 Q 356 366 356 378 V 492 Q 356 504 368 504 H 432"/><rect x="292" y="428" width="154" height="22" rx="7" fill="#fbfaf6"/><text class="label" x="369" y="444" text-anchor="middle">Set invalidates</text>
  <path class="main" d="M 186 412 V 614 Q 186 626 198 626 H 1296 Q 1308 626 1308 614 V 288 Q 1308 276 1296 276 H 1270"/><rect x="338" y="600" width="178" height="22" rx="7" fill="#fbfaf6"/><text class="label" x="427" y="616" text-anchor="middle">PutProduct writes source</text>

  <path class="cache" d="M 584 350 V 438"/><rect x="602" y="385" width="136" height="22" rx="7" fill="#fbfaf6"/><text class="label" x="670" y="401" text-anchor="middle">cache read/write</text>
  <path class="main" d="M 736 284 H 1000"/><rect x="800" y="256" width="104" height="22" rx="7" fill="#fbfaf6"/><text class="label" x="852" y="272" text-anchor="middle">owner loader</text>
  <path class="redis" d="M 736 322 H 910 Q 922 322 922 334 V 420 Q 922 432 934 432 H 1123 Q 1135 432 1135 444 V 474"/><rect x="970" y="404" width="136" height="22" rx="7" fill="#fbfaf6"/><text class="label" x="1038" y="420" text-anchor="middle">lock/result keys</text>
  <path class="redis" d="M 736 504 H 1008"/><rect x="827" y="474" width="100" height="22" rx="7" fill="#fbfaf6"/><text class="label" x="877" y="490" text-anchor="middle">channel</text>
  <path class="cache" d="M 736 558 H 760"/><rect x="740" y="592" width="108" height="22" rx="7" fill="#fbfaf6"/><text class="label" x="794" y="608" text-anchor="middle">local entries</text>

  <rect x="236" y="704" width="948" height="42" rx="12" fill="#edf1e9" stroke="#5d8a62"/>
  <text class="subtitle" x="710" y="731" text-anchor="middle">Redis clients remain caller-owned; Peer.Close only stops the near-cache subscriber.</text>
</svg>
