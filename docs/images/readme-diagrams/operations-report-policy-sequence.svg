<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="868" viewBox="-60 0 1500 868" role="img" aria-labelledby="title desc">
  <title id="title">Operations Report Policy Sequence</title>
  <desc id="desc">Best-practices sequence diagram with participant cards, lifelines, activations, numbered labels, and branch frame.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
    <marker id="arrow-call" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 13 13" data-role="sequence" data-tip-direction="positive-x"><path d="M 1.04 1.3 L 11.96 6.5 L 1.04 11.7 Z" fill="#3F7D9C" stroke="#3F7D9C" stroke-width="0" stroke-dasharray="none"/></marker>
    <marker id="arrow-return" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 13 13" data-role="sequence" data-tip-direction="positive-x"><path d="M 1.04 1.3 L 11.96 6.5 L 1.04 11.7 Z" fill="#6E8F4F" stroke="#6E8F4F" stroke-width="0" stroke-dasharray="none"/></marker>
    <marker id="arrow-async" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 13 13" data-role="sequence" data-tip-direction="positive-x"><path d="M 1.04 1.3 L 11.96 6.5 L 1.04 11.7 Z" fill="#755BC6" stroke="#755BC6" stroke-width="0" stroke-dasharray="none"/></marker>
    <marker id="arrow-fail" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 13 13" data-role="sequence" data-tip-direction="positive-x"><path d="M 1.04 1.3 L 11.96 6.5 L 1.04 11.7 Z" fill="#B86868" stroke="#B86868" stroke-width="0" stroke-dasharray="none"/></marker>
    <style>
      @font-face { font-family: 'Architects Daughter'; src: url('file:///Users/debop/Library/Fonts/ArchitectsDaughter-Regular.ttf') format('truetype'); }
      @font-face { font-family: 'Comic Mono'; src: url('file:///Users/debop/Library/Fonts/ComicMono.ttf') format('truetype'); }
      .canvas{fill:#fbfcf8}.title{font-family:'Architects Daughter';font-size:40px;fill:#263238}.subtitle,.detail,.footer{font-family:'Comic Mono';fill:#36464f}.subtitle{font-size:16px}.footer{font-size:14px;fill:#60727d}.cardTitle{font-family:'Architects Daughter';font-size:21px;fill:#1f3138}.role{font-family:'Comic Mono';font-size:12px;fill:#546a73}.card{fill:#ffffff;stroke-width:2;filter:url(#shadow)}.lifeline{stroke:#9aaab1;stroke-width:2;stroke-dasharray:7 8;stroke-linecap:round}.activation{fill:#e6f2ec;stroke:#5b7e67;stroke-width:1.5}.call,.return,.async,.fail{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.call{stroke:#3F7D9C;marker-end:url(#arrow-call)}.return{stroke:#6E8F4F;stroke-width:2.6;stroke-dasharray:8 6;marker-end:url(#arrow-return)}.async{stroke:#755BC6;marker-end:url(#arrow-async)}.fail{stroke:#B86868;marker-end:url(#arrow-fail)}.alt{fill:#eef7f0;fill-opacity:.14;stroke:#78909c;stroke-width:2.4;stroke-dasharray:12 7}.divider{stroke:#78909c;stroke-width:2;stroke-dasharray:10 8}rect.label{fill:#ffffff;stroke:#d7e0e4;stroke-width:1.3}.callLabel{stroke:#9cc2d1}.returnLabel{stroke:#b6c9a4}.asyncLabel{stroke:#b8a9d5}.failLabel{stroke:#d9abab}.badgeText,.msg{font-family:'Comic Mono';font-size:12px;font-weight:700}.msg{font-size:13px}.callText{fill:#2f6f8e}.returnText{fill:#55783F}.asyncText{fill:#674b91}.failText{fill:#9d4f4f}
    </style>
  </defs>
  <rect class="canvas" x="-60" y="0" width="1500" height="868"/>
  <text class="title" x="690" y="64" text-anchor="middle">Operations Report Policy Sequence</text>
  <text class="subtitle" x="690" y="98" text-anchor="middle">The report body is deterministic even though workreport timestamps are created at runtime.</text>
  <g id="participant-1"><rect class="card" x="-5" y="160" width="190" height="78" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/><text class="cardTitle" x="90" y="203" text-anchor="middle">Client</text><line class="lifeline" x1="90" y1="238" x2="90" y2="756"/></g>
  <g id="participant-2"><rect class="card" x="295" y="160" width="190" height="78" rx="10" fill="#FFF3D9" stroke="#D6A441"/><text class="cardTitle" x="390" y="203" text-anchor="middle">Handler</text><line class="lifeline" x1="390" y1="238" x2="390" y2="756"/></g>
  <g id="participant-3"><rect class="card" x="595" y="160" width="190" height="78" rx="10" fill="#EAF7EF" stroke="#58A978"/><text class="cardTitle" x="690" y="203" text-anchor="middle">Checklist</text><line class="lifeline" x1="690" y1="238" x2="690" y2="756"/></g>
  <g id="participant-4"><rect class="card" x="895" y="160" width="190" height="78" rx="10" fill="#F1ECFF" stroke="#8A72D6"/><text class="cardTitle" x="990" y="203" text-anchor="middle">Aggregate</text><line class="lifeline" x1="990" y1="238" x2="990" y2="756"/></g>
  <g id="participant-5"><rect class="card" x="1192" y="160" width="196" height="78" rx="10" fill="#FDECEF" stroke="#DC6B82"/><text class="cardTitle" x="1290" y="203" text-anchor="middle">Projector</text><line class="lifeline" x1="1290" y1="238" x2="1290" y2="756"/></g>
  <rect class="activation" x="383" y="316" width="14" height="328" rx="6"/>
  <rect class="activation" x="683" y="332" width="14" height="376" rx="6"/>
  <rect class="activation" x="983" y="396" width="14" height="120" rx="6"/>
  <rect class="activation" x="1283" y="460" width="14" height="120" rx="6"/>
  <rect class="alt" x="64" y="626" width="1252" height="106" rx="16"/>
  <rect class="label failLabel" x="88" y="612" width="230" height="28" rx="8"/>
  <text class="msg failText" x="203" y="631" text-anchor="middle">alt failure / branch path</text>
  <g id="message-1"><rect class="label callLabel" x="108.6" y="250" width="262.9" height="28" rx="8"/><circle cx="126.6" cy="264" r="12" fill="#3F7D9C"/><text class="badgeText" x="126.6" y="268" text-anchor="middle" fill="#fff">1</text><text class="msg callText" x="248" y="268" text-anchor="middle">POST /operations/report</text><path class="call" d="M 90 286 H 390"/></g>
  <g id="message-2"><rect class="label callLabel" x="420" y="314" width="240" height="28" rx="8"/><circle cx="438" cy="328" r="12" fill="#3F7D9C"/><text class="badgeText" x="438" y="332" text-anchor="middle" fill="#fff">2</text><text class="msg callText" x="548" y="332" text-anchor="middle">run steps with policy</text><path class="call" d="M 390 350 H 690"/></g>
  <g id="message-3"><rect class="label callLabel" x="765" y="378" width="150" height="28" rx="8"/><circle cx="783" cy="392" r="12" fill="#3F7D9C"/><text class="badgeText" x="783" y="396" text-anchor="middle" fill="#fff">3</text><text class="msg callText" x="848" y="396" text-anchor="middle">child reports</text><path class="call" d="M 690 414 H 990"/></g>
  <g id="message-4"><rect class="label callLabel" x="1065" y="442" width="150" height="28" rx="8"/><circle cx="1083" cy="456" r="12" fill="#3F7D9C"/><text class="badgeText" x="1083" y="460" text-anchor="middle" fill="#fff">4</text><text class="msg callText" x="1148" y="460" text-anchor="middle">root report</text><path class="call" d="M 990 478 H 1290"/></g>
  <g id="message-5"><rect class="label callLabel" x="685.7" y="506" width="308.6" height="28" rx="8"/><circle cx="703.7" cy="520" r="12" fill="#3F7D9C"/><text class="badgeText" x="703.7" y="524" text-anchor="middle" fill="#fff">5</text><text class="msg callText" x="848" y="524" text-anchor="middle">stable DTO + summary counts</text><path class="call" d="M 1290 542 H 390"/></g>
  <g id="message-6"><rect class="label callLabel" x="120" y="570" width="240" height="28" rx="8"/><circle cx="138" cy="584" r="12" fill="#3F7D9C"/><text class="badgeText" x="138" y="588" text-anchor="middle" fill="#fff">6</text><text class="msg callText" x="248" y="588" text-anchor="middle">200 / 207 / 409 / 408</text><path class="call" d="M 390 606 H 90"/></g>
  <g id="message-7"><rect class="label failLabel" x="600" y="634" width="320" height="28" rx="8"/><circle cx="618" cy="648" r="12" fill="#B86868"/><text class="badgeText" x="618" y="652" text-anchor="middle" fill="#fff">7</text><text class="msg failText" x="768" y="652" text-anchor="middle">stop_on_failure omits later steps</text><path class="fail" d="M 690 670 H 526 Q 514 670 514 682 V 722 Q 514 734 526 734 H 990"/></g>
  <g><rect x="193.2" y="798" width="993.6" height="42" rx="12" fill="#ffffff" stroke="#D6E3EF" stroke-width="1.6"/><text class="footer" x="690" y="825" text-anchor="middle">The retry branch stays partial when a failed attempt remains visible.</text></g>
</svg>
