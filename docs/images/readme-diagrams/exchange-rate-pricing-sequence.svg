<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <marker id="seq-blue" markerWidth="16" markerHeight="16" refX="15" refY="8" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 16 16" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 16 8 L 0 16 Z" fill="#2563eb" stroke="#2563eb" stroke-dasharray="none"/>
    </marker>
    <marker id="seq-green" markerWidth="16" markerHeight="16" refX="15" refY="8" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 16 16" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 16 8 L 0 16 Z" fill="#059669" stroke="#059669" stroke-dasharray="none"/>
    </marker>
    <marker id="seq-purple" markerWidth="16" markerHeight="16" refX="15" refY="8" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 16 16" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 16 8 L 0 16 Z" fill="#7c3aed" stroke="#7c3aed" stroke-dasharray="none"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font-family: "Architects Daughter", "Comic Sans MS", cursive; font-size: 52px; fill: #0f172a; }
      .subtitle { font-family: "Comic Mono", "SFMono-Regular", monospace; font-size: 24px; fill: #475569; }
      .label { font-family: "Architects Daughter", "Comic Sans MS", cursive; font-size: 32px; fill: #0f172a; }
      .small { font-family: "Comic Mono", "SFMono-Regular", monospace; font-size: 21px; fill: #334155; }
      .head { fill: #ffffff; stroke: #334155; stroke-width: 4; rx: 22; }
      .life { stroke: #94a3b8; stroke-width: 3; stroke-dasharray: 9 11; }
      .msg-blue { stroke: #2563eb; stroke-width: 6; marker-end: url(#seq-blue); stroke-linecap: round; }
      .msg-green { stroke: #059669; stroke-width: 6; marker-end: url(#seq-green); stroke-linecap: round; }
      .msg-purple { stroke: #7c3aed; stroke-width: 6; marker-end: url(#seq-purple); stroke-linecap: round; }
      .return { stroke: #64748b; stroke-width: 5; stroke-dasharray: 10 9; marker-end: url(#seq-blue); stroke-linecap: round; }
      .note { fill: #fff7ed; stroke: #f97316; stroke-width: 3; rx: 18; }
      .alt { fill: #fef2f2; stroke: #fca5a5; stroke-width: 3; rx: 18; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="980"/>
  <text class="title" x="70" y="95">Quote request sequence</text>
  <text class="subtitle" x="74" y="138">Provider I/O is explicit, deadline-bound, and reflected in the public response policy.</text>

  <rect class="head" x="95" y="180" width="230" height="92"/>
  <text class="label" x="145" y="235">Client</text>
  <rect class="head" x="445" y="180" width="270" height="92"/>
  <g data-bluetape4k-icon="generic-microservice" transform="translate(472 202) scale(0.406)">
    <rect x="10" y="12" width="108" height="104" rx="18" fill="#f8fafc" stroke="#334155" stroke-width="6"/>
    <rect x="28" y="30" width="72" height="22" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="5"/>
    <rect x="28" y="76" width="72" height="22" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="5"/>
    <path d="M48 52v10c0 5 4 9 9 9h14c5 0 9-4 9-9V52" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="42" cy="41" r="4" fill="#2563eb"/>
    <circle cx="42" cy="87" r="4" fill="#16a34a"/>
    <path d="M86 40h10M86 86h10" fill="none" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text class="label" x="545" y="235">Gin API</text>
  <rect class="head" x="840" y="180" width="300" height="92"/>
  <text class="label" x="900" y="235">Service.Quote</text>
  <rect class="head" x="1260" y="180" width="260" height="92"/>
  <text class="label" x="1305" y="235">Provider</text>

  <line class="life" x1="210" y1="272" x2="210" y2="900"/>
  <line class="life" x1="580" y1="272" x2="580" y2="900"/>
  <line class="life" x1="990" y1="272" x2="990" y2="900"/>
  <line class="life" x1="1390" y1="272" x2="1390" y2="900"/>

  <text class="small" x="250" y="335">POST /quotes</text>
  <line class="msg-blue" x1="220" y1="350" x2="560" y2="350"/>
  <text class="small" x="625" y="415">validate JSON and body size</text>
  <line class="msg-blue" x1="590" y1="430" x2="970" y2="430"/>
  <text class="small" x="675" y="500">subtotal from money.Money</text>
  <line class="msg-green" x1="970" y1="515" x2="610" y2="515"/>
  <text class="small" x="765" y="584">CurrencyByLocale(locale)</text>
  <line class="msg-green" x1="970" y1="600" x2="970" y2="640"/>
  <text class="small" x="1035" y="665">ConvertWithProvider(ctx, subtotal, target)</text>
  <line class="msg-purple" x1="1005" y1="680" x2="1370" y2="680"/>
  <text class="small" x="1045" y="745">rate quote with source + freshness</text>
  <line class="return" x1="1375" y1="760" x2="1010" y2="760"/>

  <rect class="alt" x="815" y="795" width="630" height="92"/>
  <text class="small" x="850" y="833">if quote.stale and allow_stale_quote is false</text>
  <text class="small" x="850" y="863">return stale_quote instead of hiding refresh failure</text>

  <rect class="note" x="95" y="890" width="870" height="74"/>
  <text class="small" x="125" y="922">
    <tspan x="125" dy="0">Normal tests use deterministic provider doubles.</tspan>
    <tspan x="125" dy="34">No live ECB/IMF endpoint is required.</tspan>
  </text>
</svg>
