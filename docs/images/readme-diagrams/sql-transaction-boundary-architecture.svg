<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="760" viewBox="0 0 1320 760" role="img" aria-labelledby="title desc">
  <title id="title">SQL transaction boundary architecture</title>
  <desc id="desc">Service owns sqlkit.WithTx, repositories receive the transaction, and PostgreSQL commits or rolls back order and stock changes together.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .svc { fill: #eef2ff; stroke: #3730a3; stroke-width: 3; rx: 8; }
      .repo { fill: #ecfdf5; stroke: #047857; stroke-width: 2.5; rx: 8; }
      .db { fill: #fff7ed; stroke: #c2410c; stroke-width: 2.5; rx: 8; }
      .risk { fill: #fef2f2; stroke: #b91c1c; stroke-width: 2.5; rx: 8; }
      .test { fill: #fefce8; stroke: #a16207; stroke-width: 2.5; rx: 8; }
      .title { font: 700 30px "Architects Daughter", "Comic Mono", "Comic Sans MS", sans-serif; fill: #0f172a; }
      .label { font: 700 22px "Architects Daughter", "Comic Mono", "Comic Sans MS", sans-serif; fill: #0f172a; }
      .text { font: 18px "Architects Daughter", "Comic Mono", "Comic Sans MS", sans-serif; fill: #1e293b; }
      .small { font: 16px "Architects Daughter", "Comic Mono", "Comic Sans MS", sans-serif; fill: #334155; }
      .arrow { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .red { stroke: #b91c1c; stroke-width: 3; fill: none; marker-end: url(#arrowRed); }
      .green { stroke: #047857; stroke-width: 3; fill: none; marker-end: url(#arrowGreen); }
    </style>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2,2 L12,7 L2,12 Z" fill="#334155"/>
    </marker>
    <marker id="arrowRed" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2,2 L12,7 L2,12 Z" fill="#b91c1c"/>
    </marker>
    <marker id="arrowGreen" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2,2 L12,7 L2,12 Z" fill="#047857"/>
    </marker>
  </defs>
  <rect class="bg" width="1320" height="760"/>
  <text x="60" y="68" class="title">SQL transaction boundary: one service owns the lifetime</text>
  <text x="60" y="104" class="text">Repositories are narrow. They do not begin, commit, retry, or hide transactions.</text>

  <rect x="70" y="165" width="310" height="380" class="svc"/>
  <text x="105" y="210" class="label">PlaceOrder service</text>
  <text x="105" y="252" class="text">validate request</text>
  <text x="105" y="286" class="text">sqlkit.WithTx</text>
  <text x="105" y="320" class="text">lock products</text>
  <text x="105" y="354" class="text">debit stock</text>
  <text x="105" y="388" class="text">insert order rows</text>
  <text x="105" y="422" class="text">commit or rollback</text>
  <text x="105" y="486" class="small">Context cancellation and</text>
  <text x="105" y="512" class="small">transaction errors return here.</text>

  <rect x="475" y="155" width="290" height="175" class="repo"/>
  <text x="510" y="200" class="label">ProductRepository</text>
  <text x="510" y="242" class="text">select ... for update</text>
  <text x="510" y="276" class="text">sorted lock order</text>
  <text x="510" y="310" class="text">stock debit</text>

  <rect x="475" y="395" width="290" height="155" class="repo"/>
  <text x="510" y="440" class="label">OrderRepository</text>
  <text x="510" y="482" class="text">order header</text>
  <text x="510" y="516" class="text">order lines</text>

  <rect x="880" y="190" width="300" height="270" class="db"/>
  <text x="925" y="235" class="label">PostgreSQL</text>
  <text x="925" y="280" class="text">products stock</text>
  <text x="925" y="314" class="text">orders header</text>
  <text x="925" y="348" class="text">order lines</text>
  <line x1="925" y1="374" x2="1135" y2="374" stroke="#c2410c" stroke-width="2"/>
  <text x="925" y="412" class="text">commit all</text>
  <text x="1040" y="412" class="text">rollback all</text>

  <rect x="830" y="540" width="390" height="95" class="risk"/>
  <text x="860" y="578" class="label">Rollback triggers</text>
  <text x="860" y="610" class="text">stock conflict, payment rejection, cancellation</text>

  <rect x="250" y="630" width="600" height="72" class="test"/>
  <text x="280" y="662" class="label">PostgreSQL Testcontainers</text>
  <text x="280" y="690" class="text">prove committed rows and rolled-back stock/order state.</text>

  <path d="M380 270 C425 250, 435 238, 472 238" class="arrow"/>
  <text x="392" y="238" class="small">tx passed in</text>
  <path d="M380 440 C425 455, 435 468, 472 468" class="arrow"/>
  <text x="390" y="475" class="small">same tx</text>
  <path d="M765 255 C815 260, 830 280, 878 286" class="arrow"/>
  <path d="M765 488 C820 485, 835 428, 878 405" class="arrow"/>
  <path d="M1030 462 C1008 500, 970 520, 930 540" class="red"/>
  <text x="980" y="520" class="small">error rolls back</text>
  <path d="M1030 462 C970 490, 815 590, 610 630" class="green"/>
  <text x="660" y="610" class="small">tests assert state</text>
</svg>
