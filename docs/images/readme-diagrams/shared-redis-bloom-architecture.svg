<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 14 7 L 0 14 Z" fill="#2563eb" stroke="#2563eb" stroke-dasharray="none"/>
    </marker>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 14 7 L 0 14 Z" fill="#059669" stroke="#059669" stroke-dasharray="none"/>
    </marker>
    <marker id="arrow-purple" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 14 7 L 0 14 Z" fill="#7c3aed" stroke="#7c3aed" stroke-dasharray="none"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font-family: "Architects Daughter", "Comic Sans MS", cursive; font-size: 52px; fill: #0f172a; }
      .subtitle { font-family: "Comic Mono", "SFMono-Regular", monospace; font-size: 24px; fill: #475569; }
      .label { font-family: "Architects Daughter", "Comic Sans MS", cursive; font-size: 33px; fill: #0f172a; }
      .small { font-family: "Comic Mono", "SFMono-Regular", monospace; font-size: 22px; fill: #334155; }
      .lane { fill: #eef6ff; stroke: #bfdbfe; stroke-width: 3; rx: 28; }
      .lane2 { fill: #ecfdf5; stroke: #a7f3d0; stroke-width: 3; rx: 28; }
      .card { fill: #ffffff; stroke: #334155; stroke-width: 4; rx: 24; }
      .api { fill: #fff7ed; stroke: #f97316; stroke-width: 4; rx: 24; }
      .redis { fill: #fef2f2; stroke: #dc2626; stroke-width: 4; rx: 24; }
      .store { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 4; rx: 24; }
      .note { fill: #ecfeff; stroke: #0891b2; stroke-width: 4; rx: 22; }
      .line-blue { fill: none; stroke: #2563eb; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-blue); }
      .line-green { fill: none; stroke: #059669; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-green); }
      .line-purple { fill: none; stroke: #7c3aed; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-purple); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="900"/>
  <text class="title" x="70" y="95">Shared Redis Bloom admission</text>
  <text class="subtitle" x="74" y="138">Multiple API instances share probabilistic state, but the Bloom filter is not exact dedupe or authorization.</text>

  <rect class="lane" x="70" y="175" width="1460" height="285"/>
  <text class="subtitle" x="105" y="220">Application instances</text>
  <rect class="card" x="115" y="255" width="300" height="145"/>
  <text class="label" x="150" y="317">Webhook request</text>
  <text class="small" x="150" y="354">event_id: evt-1001</text>
  <text class="small" x="150" y="384">source: checkout</text>

  <rect class="api" x="520" y="235" width="345" height="175"/>
  <text class="label" x="560" y="292">Instance A</text>
  <text class="small" x="560" y="332">POST /events/admit</text>
  <text class="small" x="560" y="366">Put returns changed</text>

  <rect class="api" x="965" y="235" width="345" height="175"/>
  <text class="label" x="1005" y="292">Instance B</text>
  <text class="small" x="1005" y="332">same namespace</text>
  <text class="small" x="1005" y="366">sees shared bits</text>

  <path class="line-blue" d="M 415 328 H 505"/>
  <path class="line-blue" d="M 865 322 H 950"/>

  <rect class="lane2" x="70" y="505" width="1460" height="265"/>
  <text class="subtitle" x="105" y="550">Shared probabilistic boundary</text>

  <rect class="redis" x="155" y="605" width="415" height="130"/>
  <g data-bluetape4k-icon="redis" transform="translate(185 632) scale(1.55)">
    <path d="M45.536 34.95c-2.013 1.05-12.44 5.337-14.66 6.494s-3.453 1.146-5.207.308-12.85-5.32-14.85-6.276-2.04-1.613-.077-2.382l15.332-5.936c2.332-.836 3.14-.867 5.126-.14S43.55 31.87 45.51 32.6s2.037 1.31.024 2.36z" fill="#d82c20"/>
    <path d="M45.536 38.764c-2.013 1.05-12.44 5.337-14.66 6.494s-3.453 1.146-5.207.308-12.85-5.32-14.85-6.276c-1-.478-1.524-.88-1.524-1.26v-3.813s14.447-3.145 16.78-3.982 3.14-.867 5.126-.14 13.853 2.868 15.814 3.587v3.76c0 .377-.452.8-1.477 1.324z" fill="#a41e11"/>
    <path d="M45.536 28.733c-2.013 1.05-12.44 5.337-14.66 6.494s-3.453 1.146-5.207.308-12.85-5.32-14.85-6.276-2.04-1.613-.077-2.382l15.332-5.935c2.332-.837 3.14-.867 5.126-.14s12.35 4.853 14.312 5.57 2.037 1.31.024 2.36z" fill="#d82c20"/>
    <path d="M29.096 20.712l-1.182-1.965-3.774-.34 2.816-1.016-.845-1.56 2.636 1.03 2.486-.814-.672 1.612 2.534.95-3.268.34zM22.8 24.624l8.74-1.342-2.64 3.872z" fill="#ffffff"/>
    <ellipse cx="20.444" cy="21.402" rx="4.672" ry="1.811" fill="#ffffff"/>
  </g>
  <text class="label" x="280" y="653">Redis Bloom</text>
  <text class="small" x="280" y="690">bits key + config key</text>
  <text class="small" x="280" y="720">metadata fingerprint</text>

  <rect class="store" x="705" y="595" width="375" height="150"/>
  <text class="label" x="745" y="650">Authoritative store</text>
  <text class="small" x="745" y="690">idempotency table</text>
  <text class="small" x="745" y="720">log or workflow state</text>

  <rect class="note" x="1190" y="595" width="285" height="150"/>
  <text class="label" x="1225" y="650">Reader rule</text>
  <text class="small" x="1225" y="690">probably-seen is</text>
  <text class="small" x="1225" y="720">not proof</text>

  <path class="line-green" d="M 690 410 C 690 475 535 510 505 590"/>
  <path class="line-green" d="M 1135 410 C 1135 475 560 510 505 590"/>
  <path class="line-purple" d="M 570 670 H 690"/>
  <path class="line-blue" d="M 1080 670 H 1175"/>
</svg>
