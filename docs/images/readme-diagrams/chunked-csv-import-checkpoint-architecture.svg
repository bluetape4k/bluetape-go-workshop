<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="860" viewBox="0 0 1500 860" role="img" aria-labelledby="title desc">
  <title id="title">Chunked CSV Import Checkpoint Architecture</title>
  <desc id="desc">Architecture for the local batch example using batch.Job, batch.Step, CSV reader, processor, idempotent writer, checkpoint store, and sink.</desc>
  <defs>
    <marker id="arch-blue" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polygon points="1,1 7,4 1,7" fill="#3f6f8f"/></marker>
    <marker id="arch-green" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polygon points="1,1 7,4 1,7" fill="#5d8a62"/></marker>
    <marker id="arch-purple" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polygon points="1,1 7,4 1,7" fill="#8a6bb0"/></marker>
    <marker id="arch-amber" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polygon points="1,1 7,4 1,7" fill="#c07a42"/></marker>
    <style>
      @font-face { font-family: 'Architects Daughter'; src: url('file:///Users/debop/Library/Fonts/ArchitectsDaughter-Regular.ttf') format('truetype'); }
      @font-face { font-family: 'Comic Mono'; src: url('file:///Users/debop/Library/Fonts/ComicMono.ttf') format('truetype'); }
      .title { font-family: 'Architects Daughter'; font-size: 38px; fill: #24313f; }
      .subtitle, .detail, .label, .footer { font-family: 'Comic Mono'; fill: #536d7d; }
      .subtitle { font-size: 15px; }
      .layer-label, .card-title { font-family: 'Architects Daughter'; fill: #24313f; }
      .layer-label { font-size: 22px; }
      .card-title { font-size: 23px; }
      .detail { font-size: 13px; }
      .label { font-size: 12px; }
      .footer { font-size: 13px; }
      .frame { fill: #fffefa; stroke: #d8e2e8; stroke-width: 2; rx: 20; }
      .layer { fill: #ffffff; stroke: #d8e2e8; stroke-width: 2; rx: 16; }
      .blue { fill: none; stroke: #3f6f8f; stroke-width: 3; marker-end: url(#arch-blue); }
      .green { fill: none; stroke: #5d8a62; stroke-width: 3; marker-end: url(#arch-green); }
      .purple { fill: none; stroke: #8a6bb0; stroke-width: 3; marker-end: url(#arch-purple); }
      .amber { fill: none; stroke: #c07a42; stroke-width: 3; marker-end: url(#arch-amber); }
    </style>
  </defs>
  <rect width="1500" height="860" fill="#fbfaf6"/>
  <rect class="frame" x="44" y="34" width="1412" height="792"/>
  <text class="title" x="750" y="82" text-anchor="middle">Chunked CSV Import Checkpoint Architecture</text>
  <text class="subtitle" x="750" y="116" text-anchor="middle">The workshop keeps the batch interfaces visible: reader, processor, writer, checkpoint store, and report projection.</text>

  <rect class="layer" x="82" y="158" width="300" height="590"/><text class="layer-label" x="232" y="194" text-anchor="middle">Runnable demo</text>
  <rect class="layer" x="432" y="158" width="520" height="590"/><text class="layer-label" x="692" y="194" text-anchor="middle">batch.Step components</text>
  <rect class="layer" x="1002" y="158" width="416" height="590"/><text class="layer-label" x="1210" y="194" text-anchor="middle">Checkpoint contract</text>

  <g transform="translate(130 220)"><rect width="218" height="58" rx="12" fill="#d7ecf2" stroke="#48758d" stroke-width="2"/><text class="card-title" x="109" y="35" text-anchor="middle">go run</text></g>
  <g transform="translate(120 360)"><rect width="244" height="82" rx="12" fill="#fef3c7" stroke="#b99b5d" stroke-width="2"/><text class="card-title" x="122" y="33" text-anchor="middle">batch.Job</text><text class="detail" x="122" y="59" text-anchor="middle">customer-csv-import</text></g>
  <g transform="translate(124 560)"><rect width="236" height="82" rx="12" fill="#e0f2fe" stroke="#48758d" stroke-width="2"/><text class="card-title" x="118" y="33" text-anchor="middle">Stable JSON</text><text class="detail" x="118" y="59" text-anchor="middle">no timestamps</text></g>

  <g transform="translate(500 220)"><rect width="228" height="74" rx="12" fill="#dbeafe" stroke="#4f7e9d" stroke-width="2"/><text class="card-title" x="114" y="31" text-anchor="middle">CSVReader</text><text class="detail" x="114" y="54" text-anchor="middle">CheckpointReader</text></g>
  <g transform="translate(496 360)"><rect width="236" height="98" rx="12" fill="#dcfce7" stroke="#5d8a62" stroke-width="2"/><text class="card-title" x="118" y="34" text-anchor="middle">Processor</text><text class="detail" x="118" y="59" text-anchor="middle">validate rows</text><text class="detail" x="118" y="78" text-anchor="middle">normalize email/tier</text></g>
  <g transform="translate(490 505)"><rect width="260" height="98" rx="12" fill="#f3e8ff" stroke="#8a6bb0" stroke-width="2"/><text class="card-title" x="130" y="34" text-anchor="middle">CustomerWriter</text><text class="detail" x="130" y="59" text-anchor="middle">chunk writes</text><text class="detail" x="130" y="78" text-anchor="middle">idempotent by ID</text></g>
  <g transform="translate(770 610)"><rect width="168" height="98" rx="12" fill="#fff7ed" stroke="#c07a42" stroke-width="2"/><text class="card-title" x="84" y="34" text-anchor="middle">Sink</text><text class="detail" x="84" y="59" text-anchor="middle">unique commits</text><text class="detail" x="84" y="78" text-anchor="middle">duplicate skips</text></g>

  <g transform="translate(1040 510)"><rect width="320" height="54" rx="12" fill="#e0f2fe" stroke="#48758d" stroke-width="2"/><text class="card-title" x="160" y="34" text-anchor="middle">MemoryCheckpointStore</text></g>
  <g transform="translate(1050 620)"><rect width="300" height="54" rx="12" fill="#ede9fe" stroke="#8a6bb0" stroke-width="2"/><text class="card-title" x="150" y="34" text-anchor="middle">Checkpoint{NextRow}</text></g>

  <rect x="130" y="772" width="1240" height="36" rx="12" fill="#ffffff" stroke="#d8e2e8" stroke-width="2"/><text class="footer" x="750" y="796" text-anchor="middle">Production replacement points: durable checkpoint store, transactional sink, database upsert, retry/dead-letter policy, and audit records.</text>

  <path class="blue" d="M 239 278 V 360"/><text class="label" x="258" y="324" text-anchor="start">run first + restart</text>
  <path class="blue" d="M 364 401 H 496"/><text class="label" x="432" y="381" text-anchor="middle">read + restore</text>
  <path class="blue" d="M 242 442 V 560"/><text class="label" x="260" y="506" text-anchor="start">project report</text>
  <path class="green" d="M 614 294 V 360"/><text class="label" x="632" y="330" text-anchor="start">rows</text>
  <path class="purple" d="M 614 458 V 505"/><text class="label" x="632" y="488" text-anchor="start">customers</text>
  <path class="amber" d="M 620 603 V 647 Q 620 659 632 659 H 770"/><text class="label" x="700" y="639" text-anchor="middle">upsert</text>
  <path class="blue" d="M 750 554 H 1040"/><text class="label" x="892" y="534" text-anchor="middle">save after committed chunk</text>
  <path class="blue" d="M 1200 564 V 620"/><text class="label" x="1218" y="596" text-anchor="start">persist cursor</text>
  <path class="purple" d="M 1050 647 H 982 Q 970 647 970 635 V 238 Q 970 226 958 226 H 728"/><text class="label" x="835" y="206" text-anchor="middle">restore on restart</text>
</svg>
