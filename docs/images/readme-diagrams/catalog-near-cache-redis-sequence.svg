<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="820" viewBox="0 0 1480 820" role="img" aria-labelledby="title desc">
  <title id="title">Catalog Near-Cache Redis Sequence</title>
  <desc id="desc">Sequence diagram showing a cold miss owner loading once, peer waiters receiving the Redis result envelope, and a later write invalidating the peer local cache.</desc>
  <defs>
    <marker id="seq-main" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#47616f"/>
    </marker>
    <marker id="seq-load" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#4f8b63"/>
    </marker>
    <marker id="seq-redis" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#b95f7a"/>
    </marker>
    <marker id="seq-invalidate" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#8a6bb0"/>
    </marker>
    <style>
      @font-face { font-family: 'Architects Daughter'; src: url('file:///Users/debop/Library/Fonts/ArchitectsDaughter-Regular.ttf') format('truetype'); }
      @font-face { font-family: 'Comic Mono'; src: url('file:///Users/debop/Library/Fonts/ComicMono.ttf') format('truetype'); }
      .title { font-family: 'Architects Daughter'; font-size: 36px; fill: #243845; }
      .subtitle { font-family: 'Comic Mono'; font-size: 15px; fill: #536d7d; }
      .actor { font-family: 'Architects Daughter'; font-size: 19px; fill: #243845; }
      .label { font-family: 'Comic Mono'; font-size: 13px; fill: #35505f; }
      .small { font-family: 'Comic Mono'; font-size: 12px; fill: #536d7d; }
      .lifeline { stroke: #a9bac5; stroke-width: 2; stroke-dasharray: 7 7; }
      .main { fill: none; stroke: #47616f; stroke-width: 2.7; marker-end: url(#seq-main); }
      .load { fill: none; stroke: #4f8b63; stroke-width: 2.7; marker-end: url(#seq-load); }
      .redis { fill: none; stroke: #b95f7a; stroke-width: 2.7; marker-end: url(#seq-redis); }
      .invalidate { fill: none; stroke: #8a6bb0; stroke-width: 2.7; marker-end: url(#seq-invalidate); }
    </style>
  </defs>

  <rect x="0" y="0" width="1480" height="820" fill="#fbfaf6"/>
  <text class="title" x="740" y="58" text-anchor="middle">Near-Cache and Stampede Sequence</text>
  <text class="subtitle" x="740" y="91" text-anchor="middle">One peer owns the cold load; another peer waits for the Redis result, then later evicts stale local data after a write.</text>

  <g transform="translate(55 138)">
    <rect width="170" height="58" rx="8" fill="#d7ecf2" stroke="#48758d" stroke-width="2"/>
    <text class="actor" x="85" y="36" text-anchor="middle">Peer A</text>
  </g>
  <g transform="translate(285 138)">
    <rect width="170" height="58" rx="8" fill="#f7e5aa" stroke="#b99b5d" stroke-width="2"/>
    <text class="actor" x="85" y="36" text-anchor="middle">Stampede A</text>
  </g>
  <g transform="translate(515 138)">
    <rect width="170" height="58" rx="8" fill="#f5d3df" stroke="#b95f7a" stroke-width="2"/>
    <text class="actor" x="85" y="36" text-anchor="middle">Redis</text>
  </g>
  <g transform="translate(745 138)">
    <rect width="170" height="58" rx="8" fill="#dbe8d4" stroke="#5d8a62" stroke-width="2"/>
    <text class="actor" x="85" y="36" text-anchor="middle">Store</text>
  </g>
  <g transform="translate(975 138)">
    <rect width="170" height="58" rx="8" fill="#f7e5aa" stroke="#b99b5d" stroke-width="2"/>
    <text class="actor" x="85" y="36" text-anchor="middle">Stampede B</text>
  </g>
  <g transform="translate(1205 138)">
    <rect width="170" height="58" rx="8" fill="#d7ecf2" stroke="#48758d" stroke-width="2"/>
    <text class="actor" x="85" y="36" text-anchor="middle">Peer B</text>
  </g>

  <path class="lifeline" d="M 140 196 L 140 705"/>
  <path class="lifeline" d="M 370 196 L 370 705"/>
  <path class="lifeline" d="M 600 196 L 600 705"/>
  <path class="lifeline" d="M 830 196 L 830 705"/>
  <path class="lifeline" d="M 1060 196 L 1060 705"/>
  <path class="lifeline" d="M 1290 196 L 1290 705"/>

  <path class="main" d="M 140 235 L 370 235"/>
  <rect x="194" y="205" width="126" height="23" rx="7" fill="#fbfaf6"/>
  <text class="label" x="257" y="222" text-anchor="middle">Get cold SKU</text>

  <path class="redis" d="M 370 275 L 600 275"/>
  <rect x="422" y="245" width="106" height="23" rx="7" fill="#fbfaf6"/>
  <text class="label" x="475" y="262" text-anchor="middle">acquire lock</text>

  <path class="load" d="M 370 315 L 830 315"/>
  <rect x="540" y="285" width="120" height="23" rx="7" fill="#fbfaf6"/>
  <text class="label" x="600" y="302" text-anchor="middle">Store.Load once</text>

  <path class="load" d="M 830 355 L 370 355"/>
  <rect x="546" y="325" width="108" height="23" rx="7" fill="#fbfaf6"/>
  <text class="label" x="600" y="342" text-anchor="middle">Product v1</text>

  <path class="redis" d="M 370 395 L 600 395"/>
  <rect x="415" y="365" width="140" height="23" rx="7" fill="#fbfaf6"/>
  <text class="label" x="485" y="382" text-anchor="middle">publish result</text>

  <path class="main" d="M 1290 435 L 1060 435"/>
  <rect x="1110" y="405" width="130" height="23" rx="7" fill="#fbfaf6"/>
  <text class="label" x="1175" y="422" text-anchor="middle">same cold SKU</text>

  <path class="redis" d="M 1060 475 L 600 475"/>
  <rect x="765" y="445" width="130" height="23" rx="7" fill="#fbfaf6"/>
  <text class="label" x="830" y="462" text-anchor="middle">wait envelope</text>

  <path class="redis" d="M 600 515 L 1060 515"/>
  <rect x="748" y="485" width="164" height="23" rx="7" fill="#fbfaf6"/>
  <text class="label" x="830" y="502" text-anchor="middle">result envelope</text>

  <path class="load" d="M 1060 555 L 1290 555"/>
  <rect x="1132" y="525" width="86" height="23" rx="7" fill="#fbfaf6"/>
  <text class="label" x="1175" y="542" text-anchor="middle">Product</text>

  <rect x="70" y="592" width="1320" height="100" rx="14" fill="#fff7f3" stroke="#d8b2a8" stroke-width="2"/>
  <text class="small" x="96" y="622">Write and invalidation path</text>
  <path class="invalidate" d="M 140 650 L 600 650"/>
  <rect x="286" y="620" width="168" height="23" rx="7" fill="#fff7f3"/>
  <text class="label" x="370" y="637" text-anchor="middle">Set Product v2 event</text>
  <path class="invalidate" d="M 600 675 L 1290 675"/>
  <rect x="848" y="700" width="182" height="23" rx="7" fill="#fff7f3"/>
  <text class="label" x="939" y="717" text-anchor="middle">delete Peer B local SKU</text>

  <rect x="246" y="756" width="988" height="36" rx="11" fill="#edf1e9" stroke="#5d8a62"/>
  <text class="subtitle" x="740" y="779" text-anchor="middle">The test waits while the owner loader is blocked, then proves the backing load count stays at one.</text>
</svg>
