<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="760" viewBox="0 0 1420 760" role="img" aria-labelledby="title desc">
  <title id="title">Catalog Near-Cache Invalidation Scenario</title>
  <desc id="desc">Peer A writes Product v2, Redis Pub/Sub carries the invalidation event, and Peer B evicts stale Product v1 before the next read reloads from the store.</desc>
  <defs>
    <marker id="scenario-neutral" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="1,1 7,4 1,7" fill="#47616f"/>
    </marker>
    <marker id="scenario-load" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="1,1 7,4 1,7" fill="#4f8b63"/>
    </marker>
    <marker id="scenario-invalidate" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="1,1 7,4 1,7" fill="#8a6bb0"/>
    </marker>
    <marker id="scenario-write" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="1,1 7,4 1,7" fill="#b95f7a"/>
    </marker>
    <style>
      @font-face { font-family: 'Architects Daughter'; src: url('file:///Users/debop/Library/Fonts/ArchitectsDaughter-Regular.ttf') format('truetype'); }
      @font-face { font-family: 'Comic Mono'; src: url('file:///Users/debop/Library/Fonts/ComicMono.ttf') format('truetype'); }
      .title { font-family: 'Architects Daughter'; font-size: 36px; fill: #243845; }
      .subtitle { font-family: 'Comic Mono'; font-size: 15px; fill: #536d7d; }
      .card-title { font-family: 'Architects Daughter'; font-size: 24px; fill: #243845; }
      .card-text { font-family: 'Comic Mono'; font-size: 15px; fill: #344b59; }
      .label { font-family: 'Comic Mono'; font-size: 13px; fill: #35505f; }
      .small { font-family: 'Comic Mono'; font-size: 12px; fill: #536d7d; }
      .neutral { fill: none; stroke: #47616f; stroke-width: 3; marker-end: url(#scenario-neutral); }
      .load { fill: none; stroke: #4f8b63; stroke-width: 3; marker-end: url(#scenario-load); }
      .invalidate { fill: none; stroke: #8a6bb0; stroke-width: 3; marker-end: url(#scenario-invalidate); }
      .write { fill: none; stroke: #b95f7a; stroke-width: 3; marker-end: url(#scenario-write); }
    </style>
  </defs>

  <rect x="0" y="0" width="1420" height="760" fill="#fbfaf6"/>
  <text class="title" x="710" y="58" text-anchor="middle">Catalog Near-Cache Invalidation</text>
  <text class="subtitle" x="710" y="91" text-anchor="middle">A peer write updates the source, publishes Redis invalidation, and makes the other peer reload.</text>

  <g transform="translate(84 315)">
    <rect width="230" height="130" rx="12" fill="#f9dacd" stroke="#ba705c" stroke-width="2"/>
    <text class="card-title" x="115" y="48" text-anchor="middle">Peer A Write</text>
    <text class="card-text" x="115" y="80" text-anchor="middle">PutProduct v2</text>
    <text class="card-text" x="115" y="104" text-anchor="middle">origin id = peer-a</text>
  </g>

  <g transform="translate(430 315)">
    <rect width="260" height="130" rx="12" fill="#dbe8d4" stroke="#5d8a62" stroke-width="2"/>
    <text class="card-title" x="130" y="48" text-anchor="middle">Authoritative Store</text>
    <text class="card-text" x="130" y="80" text-anchor="middle">Product v2 committed</text>
    <text class="card-text" x="130" y="104" text-anchor="middle">source of reload</text>
  </g>

  <g transform="translate(790 315)">
    <rect width="250" height="130" rx="12" fill="#f5d3df" stroke="#b95f7a" stroke-width="2"/>
    <image data-bluetape4k-icon="redis" href="data:image/svg+xml;base64," x="26" y="30" width="54" height="54"/>
    <text class="card-title" x="152" y="48" text-anchor="middle">Redis</text>
    <text class="card-text" x="152" y="80" text-anchor="middle">Pub/Sub Set event</text>
    <text class="card-text" x="152" y="104" text-anchor="middle">peer-a origin</text>
  </g>

  <g transform="translate(1120 315)">
    <rect width="260" height="130" rx="12" fill="#eadcf5" stroke="#8a6bb0" stroke-width="2"/>
    <text class="card-title" x="130" y="48" text-anchor="middle">Peer B Cache</text>
    <text class="card-text" x="130" y="80" text-anchor="middle">evicts Product v1</text>
    <text class="card-text" x="130" y="104" text-anchor="middle">reloads Product v2</text>
  </g>

  <path class="write" d="M 314 380 H 430"/><rect x="328" y="350" width="88" height="22" rx="7" fill="#fbfaf6"/><text class="label" x="372" y="366" text-anchor="middle">write v2</text>
  <path class="write" d="M 199 445 V 500 Q 199 512 211 512 H 774 Q 786 512 786 500 V 392 Q 786 380 790 380"/><rect x="514" y="484" width="118" height="22" rx="7" fill="#fbfaf6"/><text class="label" x="573" y="500" text-anchor="middle">publish Set</text>
  <path class="invalidate" d="M 1040 380 H 1120"/><rect x="1048" y="350" width="78" height="22" rx="7" fill="#fbfaf6"/><text class="label" x="1087" y="366" text-anchor="middle">fan-out</text>
  <path class="load" d="M 1250 445 V 540 Q 1250 552 1238 552 H 572 Q 560 552 560 540 V 445"/><rect x="760" y="524" width="208" height="22" rx="7" fill="#fbfaf6"/><text class="label" x="864" y="540" text-anchor="middle">next read reloads Product v2</text>

  <rect x="185" y="682" width="1070" height="42" rx="12" fill="#edf1e9" stroke="#5d8a62"/>
  <text class="subtitle" x="720" y="709" text-anchor="middle">Test evidence: peer A writes invalidate peer B, so the next peer B read reloads from Store.</text>
</svg>
