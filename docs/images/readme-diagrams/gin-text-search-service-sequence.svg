<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1500" viewBox="0 0 1800 1500" role="img" aria-labelledby="title desc">
  <title id="title">Gin text search service sequence</title>
  <desc id="desc">A request flows through Gin binding, service search, textsearch matching, exact span masking, and JSON response projection.</desc>
  <defs>
    <style>
      text { font-family: "Comic Mono", "Architects Daughter", "Comic Sans MS", monospace; fill: #172033; }
      .title { font-family: "Architects Daughter", "Comic Mono", cursive; font-size: 42px; font-weight: 700; }
      .subtitle { font-size: 22px; fill: #46546a; }
      .head { fill: #f8fafc; stroke-width: 3; }
      .client { stroke: #2563eb; }
      .gin { stroke: #16a34a; }
      .service { stroke: #d97706; }
      .matcher { stroke: #0f766e; }
      .result { stroke: #dc2626; }
      .head-text { font-size: 26px; font-weight: 700; }
      .small { font-size: 18px; fill: #475569; }
      .lifeline { stroke: #94a3b8; stroke-width: 3; stroke-dasharray: 11 11; }
      .activation { fill: #fff7ed; stroke: #b45309; stroke-width: 3; }
      .message { fill: none; stroke-width: 5; stroke-linecap: round; }
      .msg-blue { stroke: #2563eb; marker-end: url(#arrow-blue); }
      .msg-green { stroke: #15803d; marker-end: url(#arrow-green); }
      .msg-amber { stroke: #b45309; marker-end: url(#arrow-amber); }
      .msg-teal { stroke: #0f766e; marker-end: url(#arrow-teal); }
      .msg-red { stroke: #dc2626; marker-end: url(#arrow-red); }
      .return { stroke-dasharray: 10 8; }
      .pill { fill: #ffffff; stroke-width: 2; }
      .pill-text { font-size: 18px; font-weight: 700; }
      .frame { fill: none; stroke: #94a3b8; stroke-width: 3; stroke-dasharray: 12 10; }
      .frame-label { fill: #ffffff; stroke: #f59e0b; stroke-width: 2; }
      .note { fill: #ffffff; stroke: #cbd5e1; stroke-width: 3; }
    </style>
    <marker id="arrow-blue" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 16 8 L 0 16 z" fill="#2563eb"/></marker>
    <marker id="arrow-green" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 16 8 L 0 16 z" fill="#15803d"/></marker>
    <marker id="arrow-amber" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 16 8 L 0 16 z" fill="#b45309"/></marker>
    <marker id="arrow-teal" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 16 8 L 0 16 z" fill="#0f766e"/></marker>
    <marker id="arrow-red" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 16 8 L 0 16 z" fill="#dc2626"/></marker>
  </defs>

  <rect width="1800" height="1500" fill="#f8fafc"/>
  <text class="title" x="70" y="70">Gin text search service sequence</text>
  <text class="subtitle" x="70" y="108">A thin HTTP boundary delegates exact phrase search and masking to reusable domain code.</text>

  <rect class="head client" x="85" y="155" width="220" height="78" rx="13"/>
  <text class="head-text" x="130" y="190">Client</text>
  <text class="small" x="118" y="216">curl or UI</text>
  <rect class="head gin" x="450" y="155" width="260" height="78" rx="13"/>
  <text class="head-text" x="505" y="190">Gin</text>
  <text class="small" x="486" y="216">HTTP boundary</text>
  <rect class="head service" x="850" y="155" width="260" height="78" rx="13"/>
  <text class="head-text" x="900" y="190">Service</text>
  <text class="small" x="890" y="216">domain API</text>
  <rect class="head matcher" x="1240" y="155" width="260" height="78" rx="13"/>
  <text class="head-text" x="1280" y="190">Matcher</text>
  <text class="small" x="1288" y="216">textsearch</text>
  <rect class="head result" x="1570" y="155" width="180" height="78" rx="13"/>
  <text class="head-text" x="1608" y="190">Result</text>
  <text class="small" x="1602" y="216">JSON</text>

  <line class="lifeline" x1="195" y1="233" x2="195" y2="1400"/>
  <line class="lifeline" x1="580" y1="233" x2="580" y2="1400"/>
  <line class="lifeline" x1="980" y1="233" x2="980" y2="1400"/>
  <line class="lifeline" x1="1370" y1="233" x2="1370" y2="1400"/>
  <line class="lifeline" x1="1660" y1="233" x2="1660" y2="1400"/>

  <rect class="activation" x="567" y="300" width="26" height="870" rx="8"/>
  <rect class="activation" x="967" y="430" width="26" height="620" rx="8"/>
  <rect class="activation" x="1357" y="535" width="26" height="245" rx="8"/>

  <path class="message msg-blue" d="M 195 330 H 567"/>
  <rect class="pill client" x="100" y="292" width="360" height="38" rx="19"/>
  <text class="pill-text" x="122" y="318">1 POST /text/search-mask</text>

  <path class="message msg-green" d="M 593 430 H 967"/>
  <rect class="pill gin" x="650" y="392" width="265" height="38" rx="19"/>
  <text class="pill-text" x="672" y="418">2 Bind JSON</text>

  <path class="message msg-amber" d="M 993 535 H 1357"/>
  <rect class="pill service" x="1040" y="497" width="295" height="38" rx="19"/>
  <text class="pill-text" x="1062" y="523">3 FindAll phrases</text>

  <path class="message msg-teal return" d="M 1357 625 H 993"/>
  <rect class="pill matcher" x="1058" y="587" width="350" height="38" rx="19"/>
  <text class="pill-text" x="1080" y="613">4 original byte spans</text>

  <rect class="frame" x="100" y="705" width="1460" height="330" rx="20"/>
  <rect class="frame-label" x="130" y="685" width="430" height="38" rx="19"/>
  <text class="pill-text" x="152" y="711">boundary and overlap handling</text>

  <path class="message msg-amber" d="M 993 780 H 1357"/>
  <rect class="pill service" x="1030" y="742" width="405" height="38" rx="19"/>
  <text class="pill-text" x="1052" y="768">5 Leftmost-longest matches</text>

  <path class="message msg-red" d="M 993 890 H 1660"/>
  <rect class="pill result" x="1045" y="852" width="415" height="38" rx="19"/>
  <text class="pill-text" x="1067" y="878">6 Mask exact original spans</text>

  <path class="message msg-amber return" d="M 967 1080 H 593"/>
  <rect class="pill service" x="650" y="1042" width="405" height="38" rx="19"/>
  <text class="pill-text" x="672" y="1068">7 Matches + summary + caveats</text>

  <path class="message msg-blue return" d="M 567 1210 H 195"/>
  <rect class="pill client" x="250" y="1172" width="405" height="38" rx="19"/>
  <text class="pill-text" x="272" y="1198">8 Stable JSON response</text>

  <rect class="note" x="200" y="1345" width="1400" height="62" rx="16"/>
  <text class="small" x="240" y="1383">Boundary caveat: refund is not matched inside refundable; offsets remain original UTF-8 byte spans.</text>
</svg>
