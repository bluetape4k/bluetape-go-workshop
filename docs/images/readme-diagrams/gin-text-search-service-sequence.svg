<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1500" viewBox="0 0 1800 1500" role="img" aria-labelledby="title desc">
  <title id="title">Gin text search service sequence</title>
  <desc id="desc">A request flows through Gin binding, service search, textsearch matching, exact span masking, and JSON response projection.</desc>
  <defs>
    <style>
      text { font-family: "Comic Mono", "Architects Daughter", "Comic Sans MS", monospace; fill: #172033; }
      .title { font-family: "Architects Daughter", "Comic Mono", cursive; font-size: 42px; font-weight: 700; }
      .subtitle { font-size: 22px; fill: #46546a; }
      .head { fill: #f8fafc; stroke-width: 3; }
      .client { stroke: #2563eb; }
      .gin { stroke: #16a34a; }
      .service { stroke: #d97706; }
      .matcher { stroke: #0f766e; }
      .result { stroke: #dc2626; }
      .head-text { font-size: 26px; font-weight: 700; }
      .small { font-size: 18px; fill: #475569; }
      .lifeline { stroke: #94a3b8; stroke-width: 3; stroke-dasharray: 11 11; }
      .activation { fill: #fff7ed; stroke: #b45309; stroke-width: 3; }
      .message { fill: none; stroke-width: 5; stroke-linecap: round; }
      .msg-blue { stroke: #2563eb; marker-end: url(#arrow-blue); }
      .msg-green { stroke: #15803d; marker-end: url(#arrow-green); }
      .msg-amber { stroke: #b45309; marker-end: url(#arrow-amber); }
      .msg-teal { stroke: #0f766e; marker-end: url(#arrow-teal); }
      .msg-red { stroke: #dc2626; marker-end: url(#arrow-red); }
      .return { stroke-dasharray: 10 8; }
      .pill { fill: #ffffff; stroke-width: 2; }
      .pill-text { font-size: 18px; font-weight: 700; }
      .frame { fill: none; stroke: #94a3b8; stroke-width: 3; stroke-dasharray: 12 10; }
      .frame-label { fill: #ffffff; stroke: #f59e0b; stroke-width: 2; }
      .note { fill: #ffffff; stroke: #cbd5e1; stroke-width: 3; }
    </style>
    <marker id="arrow-blue" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb" stroke="none" stroke-dasharray="none"/></marker>
    <marker id="arrow-green" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#15803d" stroke="none" stroke-dasharray="none"/></marker>
    <marker id="arrow-amber" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b45309" stroke="none" stroke-dasharray="none"/></marker>
    <marker id="arrow-teal" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#0f766e" stroke="none" stroke-dasharray="none"/></marker>
    <marker id="arrow-red" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#dc2626" stroke="none" stroke-dasharray="none"/></marker>
  </defs>

  <rect width="1800" height="1500" fill="#f8fafc"/>
  <text class="title" x="70" y="70">Gin text search service sequence</text>
  <text class="subtitle" x="70" y="108">A thin HTTP boundary delegates exact phrase search and masking to reusable domain code.</text>

  <rect class="head header client" x="85" y="155" width="220" height="78" rx="13"/>
  <text class="head-text participant" x="130" y="190">Client</text>
  <text class="small" x="118" y="216">curl or UI</text>
  <rect class="head header gin" x="450" y="155" width="260" height="78" rx="13"/>
  <text class="head-text participant" x="505" y="190">Gin</text>
  <text class="small" x="486" y="216">HTTP boundary</text>
  <rect class="head header service" x="850" y="155" width="260" height="78" rx="13"/>
  <text class="head-text participant" x="900" y="190">Service</text>
  <text class="small" x="890" y="216">domain API</text>
  <rect class="head header matcher" x="1240" y="155" width="260" height="78" rx="13"/>
  <text class="head-text participant" x="1280" y="190">Matcher</text>
  <text class="small" x="1288" y="216">textsearch</text>
  <rect class="head header result" x="1570" y="155" width="180" height="78" rx="13"/>
  <text class="head-text participant" x="1608" y="190">Result</text>
  <text class="small" x="1602" y="216">JSON</text>

  <line class="lifeline" x1="195" y1="233" x2="195" y2="1400"/>
  <line class="lifeline" x1="580" y1="233" x2="580" y2="1400"/>
  <line class="lifeline" x1="980" y1="233" x2="980" y2="1400"/>
  <line class="lifeline" x1="1370" y1="233" x2="1370" y2="1400"/>
  <line class="lifeline" x1="1660" y1="233" x2="1660" y2="1400"/>

  <rect class="activation" x="567" y="300" width="26" height="925" rx="8"/>
  <rect class="activation" x="967" y="410" width="26" height="690" rx="8"/>
  <rect class="activation" x="1357" y="515" width="26" height="285" rx="8"/>

  <path class="message call msg-blue" d="M 195 330 H 567"/>
  <rect class="pill label client" x="100" y="282" width="360" height="38" rx="19"/>
  <text class="pill-text num" x="122" y="308">1</text>
  <text class="pill-text msg" x="150" y="308">POST /text/search-mask</text>

  <path class="message call msg-green" d="M 593 430 H 967"/>
  <rect class="pill label gin" x="650" y="382" width="265" height="38" rx="19"/>
  <text class="pill-text num" x="672" y="408">2</text>
  <text class="pill-text msg" x="700" y="408">Bind JSON</text>

  <path class="message call msg-amber" d="M 993 535 H 1357"/>
  <rect class="pill label service" x="1040" y="487" width="295" height="38" rx="19"/>
  <text class="pill-text num" x="1062" y="513">3</text>
  <text class="pill-text msg" x="1090" y="513">FindAll phrases</text>

  <path class="message msg-teal return" d="M 1357 625 H 993"/>
  <rect class="pill label matcher" x="1058" y="577" width="350" height="38" rx="19"/>
  <text class="pill-text num" x="1080" y="603">4</text>
  <text class="pill-text msg" x="1108" y="603">original byte spans</text>

  <rect class="frame" x="100" y="705" width="1460" height="330" rx="20"/>
  <rect class="frame-label" x="130" y="685" width="430" height="38" rx="19"/>
  <text class="pill-text" x="152" y="711">boundary and overlap handling</text>

  <path class="message call msg-amber" d="M 993 780 H 1357"/>
  <rect class="pill label service" x="1030" y="732" width="405" height="38" rx="19"/>
  <text class="pill-text num" x="1052" y="758">5</text>
  <text class="pill-text msg" x="1080" y="758">Leftmost-longest matches</text>

  <path class="message fail msg-red" d="M 993 890 H 1660"/>
  <rect class="pill label result" x="1045" y="842" width="415" height="38" rx="19"/>
  <text class="pill-text num" x="1067" y="868">6</text>
  <text class="pill-text msg" x="1095" y="868">Mask exact original spans</text>

  <path class="message msg-amber return" d="M 967 1080 H 593"/>
  <rect class="pill label service" x="650" y="1032" width="405" height="38" rx="19"/>
  <text class="pill-text num" x="672" y="1058">7</text>
  <text class="pill-text msg" x="700" y="1058">Matches + summary + caveats</text>

  <path class="message msg-blue return" d="M 567 1210 H 195"/>
  <rect class="pill label client" x="250" y="1162" width="405" height="38" rx="19"/>
  <text class="pill-text num" x="272" y="1188">8</text>
  <text class="pill-text msg" x="300" y="1188">Stable JSON response</text>

  <rect class="note" x="200" y="1345" width="1400" height="62" rx="16"/>
  <text class="small" x="240" y="1383">Boundary caveat: refund is not matched inside refundable; offsets remain original UTF-8 byte spans.</text>
</svg>
