<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">ID and JWT boundary responsibility architecture</title>
  <desc id="desc">Static ownership map for demo callers, Gin HTTP hardening, application trust decisions, bluetape-go JWT and UUID providers, and stable public outcomes.</desc>
  <defs>
    <style>
      text { font-family: "Comic Mono", "Architects Daughter", "Comic Sans MS", monospace; fill: #172033; }
      .heading { font-family: "Architects Daughter", "Comic Mono", cursive; font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #516176; }
      .region-title { font-size: 17px; font-weight: 700; }
      .region-title-small { font-size: 15px; font-weight: 700; }
      .card-title { font-size: 15px; font-weight: 700; }
      .card-title-small { font-size: 13px; font-weight: 700; }
      .card-sub { font-size: 12px; fill: #475569; }
      .tiny { font-size: 11px; fill: #526174; }
      .legend-text { font-size: 11px; fill: #475569; }
      .canvas { fill: #f8fafc; }
      .outer-frame { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .region-caller { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; }
      .region-http { fill: #eff6ff; stroke: #93c5fd; stroke-width: 2; }
      .region-app { fill: #f7fbff; stroke: #60a5fa; stroke-width: 2.5; }
      .region-provider { fill: #faf5ff; stroke: #c4b5fd; stroke-width: 2; }
      .region-outcome { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; }
      .card-neutral { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; }
      .card-blue { fill: #dbeafe; stroke: #3b82f6; stroke-width: 2; }
      .card-violet { fill: #f3e8ff; stroke: #8b5cf6; stroke-width: 2; }
      .card-olive { fill: #f7f8e8; stroke: #7c8c35; stroke-width: 2; }
      .card-red { fill: #fff1f2; stroke: #c96b72; stroke-width: 2; }
      .http-flow { fill: none; stroke: #2563eb; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-blue); }
      .claim-flow { fill: none; stroke: #7c3aed; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-violet); }
      .authorized-flow { fill: none; stroke: #71832f; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-olive); }
      .error-flow { fill: none; stroke: #b85d66; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-red); }
      .port { fill: #ffffff; stroke-width: 2; }
    </style>
    <marker id="arrow-blue" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto" viewBox="0 0 14 14" refX="12" refY="7">
      <path d="M2 2 L12 7 L2 12 Z" fill="#2563eb" stroke="none"/>
    </marker>
    <marker id="arrow-violet" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto" viewBox="0 0 14 14" refX="12" refY="7">
      <path d="M2 2 L12 7 L2 12 Z" fill="#7c3aed" stroke="none"/>
    </marker>
    <marker id="arrow-olive" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto" viewBox="0 0 14 14" refX="12" refY="7">
      <path d="M2 2 L12 7 L2 12 Z" fill="#71832f" stroke="none"/>
    </marker>
    <marker id="arrow-red" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto" viewBox="0 0 14 14" refX="12" refY="7">
      <path d="M2 2 L12 7 L2 12 Z" fill="#b85d66" stroke="none"/>
    </marker>
  </defs>

  <rect class="canvas" width="1400" height="900"/>
  <rect class="outer-frame" x="24" y="20" width="1352" height="860" rx="26"/>
  <text class="heading" x="54" y="64">ID / JWT Boundary Architecture</text>
  <text class="subtitle" x="54" y="92">Static ownership: HTTP hardening, signed-claim trust, local authorization, post-authorization IDs, and public outcomes</text>

  <rect class="region-caller" x="50" y="130" width="210" height="670" rx="18"/>
  <text class="region-title-small" x="70" y="160">Caller / demo boundary</text>

  <rect class="region-http" x="280" y="130" width="245" height="670" rx="18"/>
  <text class="region-title" x="300" y="160">HTTP runtime boundary</text>

  <rect class="region-app" x="545" y="130" width="350" height="670" rx="18"/>
  <text class="region-title" x="565" y="160">Application trust boundary</text>

  <rect class="region-provider" x="915" y="130" width="240" height="670" rx="18"/>
  <text class="region-title" x="935" y="160">bluetape-go providers</text>

  <rect class="region-outcome" x="1175" y="130" width="175" height="670" rx="18"/>
  <text class="region-title" x="1195" y="160">Public outcomes</text>

  <!-- Caller/demo responsibilities -->
  <rect class="card-neutral" x="70" y="330" width="170" height="102" rx="12"/>
  <text class="card-title" x="88" y="361">Demo Client</text>
  <text class="card-sub" x="88" y="384">POST /tokens</text>
  <text class="tiny" x="88" y="405">subject / role</text>
  <text class="tiny" x="88" y="422">scopes / ttl</text>

  <rect class="card-neutral" x="70" y="500" width="170" height="86" rx="12"/>
  <text class="card-title" x="88" y="529">Order Client</text>
  <text class="card-sub" x="88" y="554">Bearer JWT + order JSON</text>
  <text class="tiny" x="88" y="573">SKU / quantity</text>

  <!-- Gin-owned runtime and adapter responsibilities -->
  <rect class="card-blue" x="300" y="182" width="205" height="68" rx="11"/>
  <text class="card-title" x="318" y="205">main + net/http</text>
  <text class="card-sub" x="318" y="226">loopback binding</text>
  <text class="tiny" x="318" y="242">http.Server timeouts</text>

  <rect class="card-blue" x="300" y="266" width="205" height="68" rx="11"/>
  <text class="card-title" x="318" y="289">Gin Router</text>
  <text class="card-sub" x="318" y="309">Recovery</text>
  <text class="tiny" x="318" y="324">trusted proxies disabled</text>

  <rect class="card-blue" x="300" y="340" width="205" height="82" rx="11"/>
  <text class="card-title" x="318" y="368">POST /tokens adapter</text>
  <text class="card-sub" x="318" y="392">8 KiB body limit</text>
  <text class="tiny" x="318" y="410">JSON bind + status serialize</text>

  <rect class="card-blue" x="300" y="500" width="205" height="86" rx="11"/>
  <text class="card-title" x="318" y="528">POST /orders adapter</text>
  <text class="card-sub" x="318" y="552">8 KiB body limit</text>
  <text class="tiny" x="318" y="571">JSON bind + status serialize</text>

  <rect class="card-red" x="300" y="664" width="205" height="66" rx="11"/>
  <text class="card-title" x="318" y="692">Route response map</text>
  <text class="card-sub" x="318" y="714">allowlisted JSON + status</text>

  <!-- Shared Service ownership, with token/order duties kept separate -->
  <rect class="card-blue" x="570" y="330" width="300" height="102" rx="12"/>
  <text class="card-title" x="590" y="360">IssueToken</text>
  <text class="card-sub" x="590" y="383">request validation + claim assembly</text>
  <text class="tiny" x="590" y="405">issuer / audience / subject</text>
  <text class="tiny" x="590" y="422">role / scope / expiration</text>

  <rect class="card-blue" x="570" y="500" width="300" height="86" rx="12"/>
  <text class="card-title" x="590" y="528">CreateOrder</text>
  <text class="card-sub" x="590" y="552">Bearer extraction + trust checks</text>
  <text class="tiny" x="590" y="571">expected issuer / audience / expiration</text>

  <rect class="card-blue" x="570" y="610" width="135" height="75" rx="11"/>
  <text class="card-title" x="586" y="638">Local Policy</text>
  <text class="tiny" x="586" y="660">customer</text>
  <text class="tiny" x="586" y="676">orders:create</text>

  <rect class="card-red" x="735" y="610" width="135" height="75" rx="11"/>
  <text class="card-title-small" x="751" y="635">Order validation</text>
  <text class="tiny" x="751" y="656">SKU + quantity</text>
  <text class="tiny" x="751" y="674">allowlisted errors</text>

  <!-- Provider responsibilities -->
  <rect class="card-violet" x="935" y="340" width="200" height="246" rx="13"/>
  <text class="card-title" x="953" y="366">jwt.Provider</text>
  <text class="tiny" x="953" y="387">NewFixedHMACProvider</text>
  <text class="tiny" x="953" y="403">(HS256, ...)</text>
  <text class="card-sub" x="953" y="427">Compose signed claims</text>
  <line x1="953" y1="447" x2="1117" y2="447" stroke="#c4b5fd" stroke-width="1.5"/>
  <text class="card-sub" x="953" y="475">Parse signed claims</text>
  <text class="tiny" x="953" y="496">signature + issuer</text>
  <text class="tiny" x="953" y="514">audience + expiration</text>
  <rect x="953" y="526" width="164" height="38" rx="9" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text class="tiny" x="969" y="550">integrity, not encryption</text>

  <rect class="card-olive" x="935" y="610" width="200" height="96" rx="12"/>
  <text class="card-title" x="953" y="638">id.StringGenerator</text>
  <text class="tiny" x="953" y="658">NewUUIDV7Generator()</text>
  <text class="card-sub" x="953" y="678">order_id + request_id</text>
  <text class="tiny" x="953" y="696">only after authorization</text>

  <!-- Public outcome cards -->
  <rect class="card-violet" x="1195" y="345" width="135" height="72" rx="11"/>
  <text class="card-title" x="1212" y="374">200 demo token</text>
  <text class="tiny" x="1212" y="397">signed Bearer JWT</text>

  <rect class="card-olive" x="1195" y="624" width="135" height="72" rx="11"/>
  <text class="card-title" x="1212" y="653">201 accepted</text>
  <text class="tiny" x="1212" y="676">order + request IDs</text>

  <rect class="card-red" x="1185" y="704" width="155" height="70" rx="11"/>
  <text class="card-title-small" x="1201" y="727">400 / 401</text>
  <text class="card-title-small" x="1201" y="744">403 / 500</text>
  <text class="tiny" x="1201" y="763">stable public error</text>

  <!-- Separate token ownership path -->
  <path class="http-flow" data-connector="demo-client-to-token-adapter" d="M 240 381 H 300"/>
  <path class="http-flow" data-connector="token-adapter-to-issue-token" d="M 505 381 H 570"/>
  <path class="claim-flow" data-connector="issue-token-to-jwt-compose" d="M 870 381 H 935"/>
  <path class="claim-flow" data-connector="jwt-compose-to-demo-token" d="M 1135 381 H 1195"/>

  <!-- Separate protected order ownership path -->
  <path class="http-flow" data-connector="order-client-to-order-adapter" d="M 240 543 H 300"/>
  <path class="http-flow" data-connector="order-adapter-to-create-order" d="M 505 543 H 570"/>
  <path class="claim-flow" data-connector="create-order-to-jwt-parse" d="M 870 543 H 935"/>
  <path class="http-flow" data-connector="create-order-to-local-policy" d="M 625 586 V 610"/>
  <path class="http-flow" data-connector="create-order-to-order-validation" d="M 815 586 V 610"/>
  <path class="authorized-flow" data-connector="local-policy-to-order-validation" d="M 705 648 H 735"/>
  <path class="authorized-flow" data-connector="order-validation-to-uuid-provider" d="M 870 648 H 935"/>
  <path class="authorized-flow" data-connector="uuid-provider-to-accepted-order" d="M 1135 660 H 1195"/>

  <!-- Failure mapping remains separate from UUID generation -->
  <path class="error-flow" data-connector="gin-status-map-to-stable-error" d="M 505 697 H 535 Q 550 697 550 712 V 750 Q 550 770 570 770 H 1100 Q 1120 770 1120 750 V 734 Q 1120 714 1140 714 H 1185"/>

  <!-- Explicit boundary ports make ownership attachment visible -->
  <circle class="port" cx="240" cy="381" r="4" stroke="#2563eb"/>
  <circle class="port" cx="240" cy="543" r="4" stroke="#2563eb"/>
  <circle class="port" cx="935" cy="381" r="4" stroke="#7c3aed"/>
  <circle class="port" cx="935" cy="543" r="4" stroke="#7c3aed"/>
  <circle class="port" cx="935" cy="648" r="4" stroke="#71832f"/>

  <!-- Legend: color communicates responsibility/data ownership; all links are solid directional relationships. -->
  <rect x="50" y="824" width="1300" height="40" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="72" y1="844" x2="106" y2="844" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text class="legend-text" x="118" y="848">HTTP / application ownership</text>
  <line x1="350" y1="844" x2="384" y2="844" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow-violet)"/>
  <text class="legend-text" x="396" y="848">signed-claim compose / verify</text>
  <line x1="680" y1="844" x2="714" y2="844" stroke="#71832f" stroke-width="3" marker-end="url(#arrow-olive)"/>
  <text class="legend-text" x="726" y="848">authorized UUID path</text>
  <line x1="940" y1="844" x2="974" y2="844" stroke="#b85d66" stroke-width="3" marker-end="url(#arrow-red)"/>
  <text class="legend-text" x="986" y="848">allowlisted error mapping</text>
</svg>
