<svg xmlns="http://www.w3.org/2000/svg" width="1554" height="1008" viewBox="-60 0 1554 1008" role="img" aria-labelledby="title desc">
  <title id="title">Chunked CSV Import Checkpoint Sequence</title>
  <desc id="desc">Best-practices sequence diagram with participant cards, lifelines, activations, numbered labels, and branch frame.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
    <marker id="arrow-call" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 10,5 0,10" fill="#3F7D9C" stroke="#3F7D9C" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrow-return" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 10,5 0,10" fill="#6E8F4F" stroke="#6E8F4F" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrow-async" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 10,5 0,10" fill="#755BC6" stroke="#755BC6" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrow-fail" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 10,5 0,10" fill="#B86868" stroke="#B86868" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <style>
      @font-face { font-family: 'Architects Daughter'; src: url('file:///Users/debop/Library/Fonts/ArchitectsDaughter-Regular.ttf') format('truetype'); }
      @font-face { font-family: 'Comic Mono'; src: url('file:///Users/debop/Library/Fonts/ComicMono.ttf') format('truetype'); }
      .canvas{fill:#fbfcf8}.title{font-family:'Architects Daughter';font-size:40px;fill:#263238}.subtitle,.detail,.footer{font-family:'Comic Mono';fill:#36464f}.subtitle{font-size:16px}.footer{font-size:14px;fill:#60727d}.cardTitle{font-family:'Architects Daughter';font-size:21px;fill:#1f3138}.role{font-family:'Comic Mono';font-size:12px;fill:#546a73}.card{fill:#ffffff;stroke-width:2;filter:url(#shadow)}.lifeline{stroke:#9aaab1;stroke-width:2;stroke-dasharray:7 8;stroke-linecap:round}.activation{fill:#e6f2ec;stroke:#5b7e67;stroke-width:1.5}.call,.return,.async,.fail{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.call{stroke:#3F7D9C;marker-end:url(#arrow-call)}.return{stroke:#6E8F4F;stroke-width:2.6;stroke-dasharray:8 6;marker-end:url(#arrow-return)}.async{stroke:#755BC6;marker-end:url(#arrow-async)}.fail{stroke:#B86868;marker-end:url(#arrow-fail)}.alt{fill:#eef7f0;fill-opacity:.14;stroke:#78909c;stroke-width:2.4;stroke-dasharray:12 7}.divider{stroke:#78909c;stroke-width:2;stroke-dasharray:10 8}rect.label{fill:#ffffff;stroke:#d7e0e4;stroke-width:1.3}.callLabel{stroke:#9cc2d1}.returnLabel{stroke:#b6c9a4}.asyncLabel{stroke:#b8a9d5}.failLabel{stroke:#d9abab}.badgeText,.msg{font-family:'Comic Mono';font-size:12px;font-weight:700}.msg{font-size:13px}.callText{fill:#2f6f8e}.returnText{fill:#55783F}.asyncText{fill:#674b91}.failText{fill:#9d4f4f}
    </style>
  </defs>
  <rect class="canvas" x="-60" y="0" width="1554" height="1008"/>
  <text class="title" x="717" y="64" text-anchor="middle">Chunked CSV Import Checkpoint Sequence</text>
  <text class="subtitle" x="717" y="98" text-anchor="middle">Checkpoint save happens only after a chunk commit; restart reads from the previous safe cursor.</text>
  <g id="participant-1"><rect class="card" x="-5" y="160" width="190" height="78" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/><text class="cardTitle" x="90" y="203" text-anchor="middle">Job</text><line class="lifeline" x1="90" y1="238" x2="90" y2="896"/></g>
  <g id="participant-2"><rect class="card" x="308.5" y="160" width="190" height="78" rx="10" fill="#FFF3D9" stroke="#D6A441"/><text class="cardTitle" x="403.5" y="203" text-anchor="middle">Reader</text><line class="lifeline" x1="403.5" y1="238" x2="403.5" y2="896"/></g>
  <g id="participant-3"><rect class="card" x="615" y="160" width="204" height="78" rx="10" fill="#EAF7EF" stroke="#58A978"/><text class="cardTitle" x="717" y="203" text-anchor="middle">Writer</text><line class="lifeline" x1="717" y1="238" x2="717" y2="896"/></g>
  <g id="participant-4"><rect class="card" x="928.5" y="160" width="204" height="78" rx="10" fill="#F1ECFF" stroke="#8A72D6"/><text class="cardTitle" x="1030.5" y="203" text-anchor="middle">Checkpoint</text><line class="lifeline" x1="1030.5" y1="238" x2="1030.5" y2="896"/></g>
  <g id="participant-5"><rect class="card" x="1249" y="160" width="190" height="78" rx="10" fill="#FDECEF" stroke="#DC6B82"/><text class="cardTitle" x="1344" y="203" text-anchor="middle">Sink</text><line class="lifeline" x1="1344" y1="238" x2="1344" y2="896"/></g>
  <rect class="activation" x="396.5" y="268" width="14" height="522" rx="6"/>
  <rect class="activation" x="710" y="308" width="14" height="578" rx="6"/>
  <rect class="activation" x="1023.5" y="408" width="14" height="478" rx="6"/>
  <rect class="activation" x="1337" y="358" width="14" height="482" rx="6"/>
  <rect class="alt" x="64" y="262" width="1306" height="442" rx="16"/>
  <rect class="label failLabel" x="88" y="248" width="230" height="28" rx="8"/>
  <text class="msg failText" x="203" y="267" text-anchor="middle">alt failure / branch path</text>
  <g id="message-1"><rect class="label failLabel" x="115.3" y="294" width="262.9" height="28" rx="8"/><circle cx="133.3" cy="308" r="12" fill="#B86868"/><text class="badgeText" x="133.3" y="312" text-anchor="middle" fill="#fff">1</text><text class="msg failText" x="254.8" y="312" text-anchor="middle">open and read rows 0..1</text><path class="fail" d="M 90 332 H 403.5"/></g>
  <g id="message-2"><rect class="label returnLabel" x="474.5" y="346" width="171.4" height="28" rx="8"/><circle cx="492.5" cy="360" r="12" fill="#6E8F4F"/><text class="badgeText" x="492.5" y="364" text-anchor="middle" fill="#fff">2</text><text class="msg returnText" x="568.2" y="364" text-anchor="middle">process chunk 1</text><path class="return" d="M 403.5 382 H 717"/></g>
  <g id="message-3"><rect class="label returnLabel" x="876.2" y="396" width="308.6" height="28" rx="8"/><circle cx="894.2" cy="410" r="12" fill="#6E8F4F"/><text class="badgeText" x="894.2" y="414" text-anchor="middle" fill="#fff">3</text><text class="msg returnText" x="1038.5" y="414" text-anchor="middle">commit cust-1001, cust-1002</text><path class="return" d="M 717 432 H 1344"/></g>
  <g id="message-4"><rect class="label callLabel" x="788" y="446" width="171.4" height="28" rx="8"/><circle cx="806" cy="460" r="12" fill="#3F7D9C"/><text class="badgeText" x="806" y="464" text-anchor="middle" fill="#fff">4</text><text class="msg callText" x="881.8" y="464" text-anchor="middle">save next_row=2</text><path class="call" d="M 717 482 H 1030.5"/></g>
  <g id="message-5"><rect class="label callLabel" x="166.8" y="506" width="160" height="28" rx="8"/><circle cx="184.8" cy="520" r="12" fill="#3F7D9C"/><text class="badgeText" x="184.8" y="524" text-anchor="middle" fill="#fff">5</text><text class="msg callText" x="254.8" y="524" text-anchor="middle">read rows 2..3</text><path class="call" d="M 90 542 H 403.5"/></g>
  <g id="message-6"><rect class="label failLabel" x="876.2" y="556" width="308.6" height="28" rx="8"/><circle cx="894.2" cy="570" r="12" fill="#B86868"/><text class="badgeText" x="894.2" y="574" text-anchor="middle" fill="#fff">6</text><text class="msg failText" x="1038.5" y="574" text-anchor="middle">commit cust-1003 then crash</text><path class="fail" d="M 717 592 H 1344"/></g>
  <g id="message-7"><rect class="label failLabel" x="243.5" y="606" width="320" height="28" rx="8"/><circle cx="261.5" cy="620" r="12" fill="#B86868"/><text class="badgeText" x="261.5" y="624" text-anchor="middle" fill="#fff">7</text><text class="msg failText" x="411.5" y="624" text-anchor="middle">failed report, checkpoint remains 2</text><path class="fail" d="M 717 642 H 90"/></g>
  <g id="message-8"><rect class="label asyncLabel" x="423.1" y="666" width="274.3" height="28" rx="8"/><circle cx="441.1" cy="680" r="12" fill="#755BC6"/><text class="badgeText" x="441.1" y="684" text-anchor="middle" fill="#fff">8</text><text class="msg asyncText" x="568.2" y="684" text-anchor="middle">restart loads next_row=2</text><path class="async" d="M 90 702 H 1030.5"/></g>
  <g id="message-9"><rect class="label asyncLabel" x="468.8" y="716" width="182.9" height="28" rx="8"/><circle cx="486.8" cy="730" r="12" fill="#755BC6"/><text class="badgeText" x="486.8" y="734" text-anchor="middle" fill="#fff">9</text><text class="msg asyncText" x="568.2" y="734" text-anchor="middle">replay rows 2..4</text><path class="async" d="M 403.5 752 H 717"/></g>
  <g id="message-10"><rect class="label asyncLabel" x="820" y="766" width="430" height="28" rx="8"/><circle cx="842" cy="780" r="12" fill="#755BC6"/><text class="badgeText" x="842" y="784" text-anchor="middle" fill="#fff">10</text><text class="msg asyncText" x="1043" y="784" text-anchor="middle">skip duplicate cust-1003; commit remaining</text><path class="async" d="M 717 802 H 1344"/></g>
  <g id="message-11"><rect class="label returnLabel" x="788" y="822" width="171.4" height="28" rx="8"/><circle cx="806" cy="836" r="12" fill="#6E8F4F"/><text class="badgeText" x="806" y="840" text-anchor="middle" fill="#fff">11</text><text class="msg returnText" x="881.8" y="840" text-anchor="middle">save next_row=5</text><path class="return" d="M 717 858 H 1030.5"/></g>
  <g><rect x="200.8" y="938" width="1032.5" height="42" rx="12" fill="#ffffff" stroke="#D6E3EF" stroke-width="1.6"/><text class="footer" x="717" y="965" text-anchor="middle">No duplicate customer is committed even though the failed chunk is intentionally replayed.</text></g>
</svg>
