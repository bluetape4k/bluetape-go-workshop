<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="760" viewBox="0 0 1420 760" role="img" aria-labelledby="title desc">
  <title id="title">Catalog Near-Cache Redis Scenario</title>
  <desc id="desc">Two catalog peers share Redis Pub/Sub invalidation and Redis stampede coordination so one peer write evicts another peer local cache and cold miss bursts run one backing load.</desc>
  <defs>
    <marker id="scenario-neutral" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="1,1 7,4 1,7" fill="#47616f"/>
    </marker>
    <marker id="scenario-load" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="1,1 7,4 1,7" fill="#4f8b63"/>
    </marker>
    <marker id="scenario-invalidate" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="1,1 7,4 1,7" fill="#8a6bb0"/>
    </marker>
    <marker id="scenario-write" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="1,1 7,4 1,7" fill="#b95f7a"/>
    </marker>
    <style>
      @font-face { font-family: 'Architects Daughter'; src: url('file:///Users/debop/Library/Fonts/ArchitectsDaughter-Regular.ttf') format('truetype'); }
      @font-face { font-family: 'Comic Mono'; src: url('file:///Users/debop/Library/Fonts/ComicMono.ttf') format('truetype'); }
      .title { font-family: 'Architects Daughter'; font-size: 36px; fill: #243845; }
      .subtitle { font-family: 'Comic Mono'; font-size: 15px; fill: #536d7d; }
      .card-title { font-family: 'Architects Daughter'; font-size: 24px; fill: #243845; }
      .card-text { font-family: 'Comic Mono'; font-size: 15px; fill: #344b59; }
      .label { font-family: 'Comic Mono'; font-size: 13px; fill: #35505f; }
      .small { font-family: 'Comic Mono'; font-size: 12px; fill: #536d7d; }
      .neutral { fill: none; stroke: #47616f; stroke-width: 3; marker-end: url(#scenario-neutral); }
      .load { fill: none; stroke: #4f8b63; stroke-width: 3; marker-end: url(#scenario-load); }
      .invalidate { fill: none; stroke: #8a6bb0; stroke-width: 3; marker-end: url(#scenario-invalidate); }
      .write { fill: none; stroke: #b95f7a; stroke-width: 3; marker-end: url(#scenario-write); }
    </style>
  </defs>

  <rect x="0" y="0" width="1420" height="760" fill="#fbfaf6"/>
  <text class="title" x="710" y="58" text-anchor="middle">Catalog Near-Cache Scenario</text>
  <text class="subtitle" x="710" y="91" text-anchor="middle">Redis carries both cross-peer invalidation and cold-miss coordination; local memory keeps repeated reads fast.</text>

  <g transform="translate(60 240)">
    <rect width="180" height="110" rx="12" fill="#d7ecf2" stroke="#48758d" stroke-width="2"/>
    <text class="card-title" x="90" y="44" text-anchor="middle">Catalog Read</text>
    <text class="card-text" x="90" y="74" text-anchor="middle">SKU lookup</text>
  </g>

  <g transform="translate(310 210)">
    <rect width="220" height="150" rx="12" fill="#f7e5aa" stroke="#b99b5d" stroke-width="2"/>
    <text class="card-title" x="110" y="52" text-anchor="middle">Peer B</text>
    <text class="card-text" x="110" y="84" text-anchor="middle">local memory cache</text>
    <text class="card-text" x="110" y="108" text-anchor="middle">may hold Product v1</text>
  </g>

  <g transform="translate(620 210)">
    <rect width="220" height="150" rx="12" fill="#f5d3df" stroke="#b95f7a" stroke-width="2"/>
    <image href="data:image/svg+xml;base64," x="24" y="32" width="54" height="54"/>
    <text class="card-title" x="142" y="52" text-anchor="middle">Redis</text>
    <text class="card-text" x="142" y="84" text-anchor="middle">Pub/Sub events</text>
    <text class="card-text" x="142" y="108" text-anchor="middle">locks and results</text>
  </g>

  <g transform="translate(1040 210)">
    <rect width="260" height="150" rx="12" fill="#dbe8d4" stroke="#5d8a62" stroke-width="2"/>
    <text class="card-title" x="130" y="52" text-anchor="middle">Authoritative Store</text>
    <text class="card-text" x="130" y="84" text-anchor="middle">Store.Load / Store.Put</text>
    <text class="card-text" x="130" y="108" text-anchor="middle">source of Product v2</text>
  </g>

  <g transform="translate(1040 500)">
    <rect width="260" height="130" rx="12" fill="#f9dacd" stroke="#ba705c" stroke-width="2"/>
    <text class="card-title" x="130" y="48" text-anchor="middle">Peer A</text>
    <text class="card-text" x="130" y="80" text-anchor="middle">writes Product v2</text>
    <text class="card-text" x="130" y="104" text-anchor="middle">origin id = peer-a</text>
  </g>

  <g transform="translate(310 500)">
    <rect width="260" height="130" rx="12" fill="#eadcf5" stroke="#8a6bb0" stroke-width="2"/>
    <text class="card-title" x="130" y="48" text-anchor="middle">Peer B Invalidation</text>
    <text class="card-text" x="130" y="80" text-anchor="middle">origin-filtered event</text>
    <text class="card-text" x="130" y="104" text-anchor="middle">deletes stale local SKU</text>
  </g>

  <path class="neutral" d="M 240 295 H 310"/>
  <text class="label" x="275" y="275" text-anchor="middle">GetProduct</text>

  <path class="neutral" d="M 530 260 H 620"/>
  <text class="label" x="575" y="240" text-anchor="middle">cold miss</text>

  <path class="load" d="M 840 260 H 1040"/>
  <text class="label" x="940" y="240" text-anchor="middle">single owner loads</text>

  <path class="load" d="M 1170 210 V 172 Q 1170 160 1158 160 H 432 Q 420 160 420 172 V 210"/>
  <text class="label" x="795" y="143" text-anchor="middle">Product v1 returns to local memory</text>

  <path class="write" d="M 1170 500 V 360"/>
  <rect x="1044" y="421" width="188" height="22" rx="7" fill="#fbfaf6"/>
  <text class="label" x="1138" y="437" text-anchor="middle">PutProduct updates store</text>

  <path class="write" d="M 1040 565 H 742 Q 730 565 730 553 V 360"/>
  <rect x="850" y="536" width="92" height="22" rx="7" fill="#fbfaf6"/>
  <text class="label" x="896" y="552" text-anchor="middle">publish Set</text>

  <path class="invalidate" d="M 700 360 V 458 Q 700 470 688 470 H 452 Q 440 470 440 482 V 500"/>
  <rect x="520" y="442" width="104" height="22" rx="7" fill="#fbfaf6"/>
  <text class="label" x="572" y="458" text-anchor="middle">event fan-out</text>

  <path class="invalidate" d="M 420 500 V 360"/>
  <rect x="432" y="421" width="128" height="22" rx="7" fill="#fbfaf6"/>
  <text class="label" x="496" y="437" text-anchor="middle">evict stale SKU</text>

  <path class="load" d="M 530 330 H 584 Q 596 330 596 342 V 406 Q 596 418 608 418 H 1158 Q 1170 418 1170 406 V 360"/>
  <rect x="720" y="389" width="270" height="22" rx="7" fill="#fbfaf6"/>
  <text class="label" x="855" y="405" text-anchor="middle">next Peer B read reloads Product v2</text>

  <rect x="185" y="682" width="1070" height="42" rx="12" fill="#edf1e9" stroke="#5d8a62"/>
  <text class="subtitle" x="720" y="709" text-anchor="middle">Tests prove peer A writes invalidate peer B and cold bursts share one backing loader.</text>
</svg>
