<svg xmlns="http://www.w3.org/2000/svg" width="1579" height="1022" viewBox="-60 0 1579 1022" role="img" aria-labelledby="title desc">
  <title id="title">Payment Authorization Sequence</title>
  <desc id="desc">Best-practices sequence diagram with participant cards, lifelines, activations, numbered labels, and branch frame.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
    <marker id="arrow-call" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 10,5 0,10" fill="#3F7D9C" stroke="#3F7D9C" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrow-return" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 10,5 0,10" fill="#6E8F4F" stroke="#6E8F4F" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrow-async" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 10,5 0,10" fill="#755BC6" stroke="#755BC6" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrow-fail" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 10,5 0,10" fill="#B86868" stroke="#B86868" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <style>
      @font-face { font-family: 'Architects Daughter'; src: url('file:///Users/debop/Library/Fonts/ArchitectsDaughter-Regular.ttf') format('truetype'); }
      @font-face { font-family: 'Comic Mono'; src: url('file:///Users/debop/Library/Fonts/ComicMono.ttf') format('truetype'); }
      .canvas{fill:#fbfcf8}.title{font-family:'Architects Daughter';font-size:40px;fill:#263238}.subtitle,.detail,.footer{font-family:'Comic Mono';fill:#36464f}.subtitle{font-size:16px}.footer{font-size:14px;fill:#60727d}.cardTitle{font-family:'Architects Daughter';font-size:21px;fill:#1f3138}.role{font-family:'Comic Mono';font-size:12px;fill:#546a73}.card{fill:#ffffff;stroke-width:2;filter:url(#shadow)}.lifeline{stroke:#9aaab1;stroke-width:2;stroke-dasharray:7 8;stroke-linecap:round}.activation{fill:#e6f2ec;stroke:#5b7e67;stroke-width:1.5}.call,.return,.async,.fail{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.call{stroke:#3F7D9C;marker-end:url(#arrow-call)}.return{stroke:#6E8F4F;stroke-width:2.6;stroke-dasharray:8 6;marker-end:url(#arrow-return)}.async{stroke:#755BC6;marker-end:url(#arrow-async)}.fail{stroke:#B86868;marker-end:url(#arrow-fail)}.alt{fill:#eef7f0;fill-opacity:.14;stroke:#78909c;stroke-width:2.4;stroke-dasharray:12 7}.divider{stroke:#78909c;stroke-width:2;stroke-dasharray:10 8}rect.label{fill:#ffffff;stroke:#d7e0e4;stroke-width:1.3}.callLabel{stroke:#9cc2d1}.returnLabel{stroke:#b6c9a4}.asyncLabel{stroke:#b8a9d5}.failLabel{stroke:#d9abab}.badgeText,.msg{font-family:'Comic Mono';font-size:12px;font-weight:700}.msg{font-size:13px}.callText{fill:#2f6f8e}.returnText{fill:#55783F}.asyncText{fill:#674b91}.failText{fill:#9d4f4f}
    </style>
  </defs>
  <rect class="canvas" x="-60" y="0" width="1579" height="1022"/>
  <text class="title" x="730" y="64" text-anchor="middle">Payment Authorization Sequence</text>
  <text class="subtitle" x="730" y="98" text-anchor="middle">The normal path reaches the gateway; rejection paths return before the gateway or second gateway call runs.</text>
  <g id="participant-1"><rect class="card" x="-5" y="160" width="190" height="78" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/><text class="cardTitle" x="90" y="203" text-anchor="middle">Order Workflow</text><line class="lifeline" x1="90" y1="238" x2="90" y2="910"/></g>
  <g id="participant-2"><rect class="card" x="250.8" y="160" width="190" height="78" rx="10" fill="#FFF3D9" stroke="#D6A441"/><text class="cardTitle" x="345.8" y="203" text-anchor="middle">Authorizer</text><line class="lifeline" x1="345.8" y1="238" x2="345.8" y2="910"/></g>
  <g id="participant-3"><rect class="card" x="506.6" y="160" width="190" height="78" rx="10" fill="#EAF7EF" stroke="#58A978"/><text class="cardTitle" x="601.6" y="203" text-anchor="middle">Circuit Breaker</text><line class="lifeline" x1="601.6" y1="238" x2="601.6" y2="910"/></g>
  <g id="participant-4"><rect class="card" x="762.4" y="160" width="190" height="78" rx="10" fill="#F1ECFF" stroke="#8A72D6"/><text class="cardTitle" x="857.4" y="203" text-anchor="middle">Bulkhead</text><line class="lifeline" x1="857.4" y1="238" x2="857.4" y2="910"/></g>
  <g id="participant-5"><rect class="card" x="1018.2" y="160" width="190" height="78" rx="10" fill="#FDECEF" stroke="#DC6B82"/><text class="cardTitle" x="1113.2" y="203" text-anchor="middle">Gateway</text><line class="lifeline" x1="1113.2" y1="238" x2="1113.2" y2="910"/></g>
  <g id="participant-6"><rect class="card" x="1274" y="160" width="190" height="78" rx="10" fill="#E9F7F6" stroke="#45A7A1"/><text class="cardTitle" x="1369" y="203" text-anchor="middle">OnEvent</text><line class="lifeline" x1="1369" y1="238" x2="1369" y2="910"/></g>
  <rect class="activation" x="338.8" y="324" width="14" height="576" rx="6"/>
  <rect class="activation" x="594.6" y="374" width="14" height="480" rx="6"/>
  <rect class="activation" x="850.4" y="414" width="14" height="470" rx="6"/>
  <rect class="activation" x="1106.2" y="454" width="14" height="232" rx="6"/>
  <rect class="activation" x="1362" y="538" width="14" height="232" rx="6"/>
  <rect class="alt" x="64" y="468" width="1331" height="462" rx="16"/>
  <rect class="label failLabel" x="88" y="454" width="230" height="28" rx="8"/>
  <text class="msg failText" x="203" y="473" text-anchor="middle">alt failure / branch path</text>
  <g id="message-1"><rect class="label callLabel" x="142.9" y="250" width="150" height="28" rx="8"/><circle cx="160.9" cy="264" r="12" fill="#3F7D9C"/><text class="badgeText" x="160.9" y="268" text-anchor="middle" fill="#fff">1</text><text class="msg callText" x="225.9" y="268" text-anchor="middle">Authorize</text><path class="call" d="M 90 286 H 345.8"/></g>
  <g id="message-2"><rect class="label callLabel" x="249.9" y="340" width="150" height="28" rx="8"/><circle cx="267.9" cy="354" r="12" fill="#3F7D9C"/><text class="badgeText" x="267.9" y="358" text-anchor="middle" fill="#fff">2</text><text class="msg callText" x="332.9" y="358" text-anchor="middle">validate</text><path class="call" d="M 345.8 380 H 458 Q 470 380 470 392 V 404 Q 470 416 458 416 H 345.8"/></g>
  <g id="message-3"><rect class="label callLabel" x="398.7" y="452" width="150" height="28" rx="8"/><circle cx="416.7" cy="466" r="12" fill="#3F7D9C"/><text class="badgeText" x="416.7" y="470" text-anchor="middle" fill="#fff">3</text><text class="msg callText" x="481.7" y="470" text-anchor="middle">beforeCall</text><path class="call" d="M 345.8 488 H 601.6"/></g>
  <g id="message-4"><rect class="label callLabel" x="654.5" y="492" width="150" height="28" rx="8"/><circle cx="672.5" cy="506" r="12" fill="#3F7D9C"/><text class="badgeText" x="672.5" y="510" text-anchor="middle" fill="#fff">4</text><text class="msg callText" x="737.5" y="510" text-anchor="middle">closed path</text><path class="call" d="M 601.6 528 H 857.4"/></g>
  <g id="message-5"><rect class="label callLabel" x="910.3" y="532" width="150" height="28" rx="8"/><circle cx="928.3" cy="546" r="12" fill="#3F7D9C"/><text class="badgeText" x="928.3" y="550" text-anchor="middle" fill="#fff">5</text><text class="msg callText" x="993.3" y="550" text-anchor="middle">gateway call</text><path class="call" d="M 857.4 568 H 1113.2"/></g>
  <g id="message-6"><rect class="label failLabel" x="910.3" y="572" width="150" height="28" rx="8"/><circle cx="928.3" cy="586" r="12" fill="#B86868"/><text class="badgeText" x="928.3" y="590" text-anchor="middle" fill="#fff">6</text><text class="msg failText" x="993.3" y="590" text-anchor="middle">auth/error</text><path class="fail" d="M 1113.2 608 H 857.4"/></g>
  <g id="message-7"><rect class="label asyncLabel" x="825.3" y="616" width="320" height="28" rx="8"/><circle cx="843.3" cy="630" r="12" fill="#755BC6"/><text class="badgeText" x="843.3" y="634" text-anchor="middle" fill="#fff">7</text><text class="msg asyncText" x="993.3" y="634" text-anchor="middle">transition or rejection event</text><path class="async" d="M 601.6 652 H 1369"/></g>
  <g id="message-8"><rect class="label asyncLabel" x="1033.2" y="656" width="160" height="28" rx="8"/><circle cx="1051.2" cy="670" r="12" fill="#755BC6"/><text class="badgeText" x="1051.2" y="674" text-anchor="middle" fill="#fff">8</text><text class="msg asyncText" x="1121.2" y="674" text-anchor="middle">bulkhead event</text><path class="async" d="M 857.4 692 H 1369"/></g>
  <g id="message-9"><rect class="label failLabel" x="393.7" y="740" width="160" height="28" rx="8"/><circle cx="411.7" cy="754" r="12" fill="#B86868"/><text class="badgeText" x="411.7" y="758" text-anchor="middle" fill="#fff">9</text><text class="msg failText" x="481.7" y="758" text-anchor="middle">ErrCircuitOpen</text><path class="fail" d="M 601.6 776 H 345.8"/></g>
  <g id="message-10"><rect class="label failLabel" x="493" y="810" width="217.1" height="28" rx="8"/><circle cx="511" cy="824" r="12" fill="#B86868"/><text class="badgeText" x="511" y="828" text-anchor="middle" fill="#fff">10</text><text class="msg failText" x="609.6" y="828" text-anchor="middle">ErrBulkheadRejected</text><path class="fail" d="M 857.4 846 H 345.8"/></g>
  <g id="message-11"><rect class="label failLabel" x="142.9" y="836" width="150" height="28" rx="8"/><circle cx="160.9" cy="850" r="12" fill="#B86868"/><text class="badgeText" x="160.9" y="854" text-anchor="middle" fill="#fff">11</text><text class="msg failText" x="225.9" y="854" text-anchor="middle">return error</text><path class="fail" d="M 345.8 872 H 90"/></g>
  <g><rect x="204.3" y="952" width="1050.5" height="42" rx="12" fill="#ffffff" stroke="#D6E3EF" stroke-width="1.6"/><text class="footer" x="730" y="979" text-anchor="middle">Tests prove the open-circuit and overflow paths by counting gateway calls.</text></g>
</svg>
