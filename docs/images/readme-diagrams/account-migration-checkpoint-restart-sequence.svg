<svg xmlns="http://www.w3.org/2000/svg" width="1553" height="1024" viewBox="-60 0 1553 1024" role="img" aria-labelledby="title desc">
  <title id="title">Account Migration Checkpoint Restart Sequence</title>
  <desc id="desc">Best-practices sequence diagram with participant cards, lifelines, activations, numbered labels, and branch frame.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
    <marker id="arrow-call" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 13 13" data-role="sequence" data-tip-direction="positive-x"><path d="M 1.04 1.3 L 11.96 6.5 L 1.04 11.7 Z" fill="#3F7D9C" stroke="#3F7D9C" stroke-width="0" stroke-dasharray="none"/></marker>
    <marker id="arrow-return" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 13 13" data-role="sequence" data-tip-direction="positive-x"><path d="M 1.04 1.3 L 11.96 6.5 L 1.04 11.7 Z" fill="#6E8F4F" stroke="#6E8F4F" stroke-width="0" stroke-dasharray="none"/></marker>
    <marker id="arrow-async" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 13 13" data-role="sequence" data-tip-direction="positive-x"><path d="M 1.04 1.3 L 11.96 6.5 L 1.04 11.7 Z" fill="#755BC6" stroke="#755BC6" stroke-width="0" stroke-dasharray="none"/></marker>
    <marker id="arrow-fail" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 13 13" data-role="sequence" data-tip-direction="positive-x"><path d="M 1.04 1.3 L 11.96 6.5 L 1.04 11.7 Z" fill="#B86868" stroke="#B86868" stroke-width="0" stroke-dasharray="none"/></marker>
    <style>
      @font-face { font-family: 'Architects Daughter'; src: url('file:///Users/debop/Library/Fonts/ArchitectsDaughter-Regular.ttf') format('truetype'); }
      @font-face { font-family: 'Comic Mono'; src: url('file:///Users/debop/Library/Fonts/ComicMono.ttf') format('truetype'); }
      .canvas{fill:#fbfcf8}.title{font-family:'Architects Daughter';font-size:40px;fill:#263238}.subtitle,.detail,.footer{font-family:'Comic Mono';fill:#36464f}.subtitle{font-size:16px}.footer{font-size:14px;fill:#60727d}.cardTitle{font-family:'Architects Daughter';font-size:21px;fill:#1f3138}.role{font-family:'Comic Mono';font-size:12px;fill:#546a73}.card{fill:#ffffff;stroke-width:2;filter:url(#shadow)}.lifeline{stroke:#9aaab1;stroke-width:2;stroke-dasharray:7 8;stroke-linecap:round}.activation{fill:#e6f2ec;stroke:#5b7e67;stroke-width:1.5}.call,.return,.async,.fail{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.call{stroke:#3F7D9C;marker-end:url(#arrow-call)}.return{stroke:#6E8F4F;stroke-width:2.6;stroke-dasharray:8 6;marker-end:url(#arrow-return)}.async{stroke:#755BC6;marker-end:url(#arrow-async)}.fail{stroke:#B86868;marker-end:url(#arrow-fail)}.alt{fill:#eef7f0;fill-opacity:.14;stroke:#78909c;stroke-width:2.4;stroke-dasharray:12 7}.divider{stroke:#78909c;stroke-width:2;stroke-dasharray:10 8}rect.label{fill:#ffffff;stroke:#d7e0e4;stroke-width:1.3}.callLabel{stroke:#9cc2d1}.returnLabel{stroke:#b6c9a4}.asyncLabel{stroke:#b8a9d5}.failLabel{stroke:#d9abab}.badgeText,.msg{font-family:'Comic Mono';font-size:12px;font-weight:700}.msg{font-size:13px}.callText{fill:#2f6f8e}.returnText{fill:#55783F}.asyncText{fill:#674b91}.failText{fill:#9d4f4f}
    </style>
  </defs>
  <rect class="canvas" x="-60" y="0" width="1553" height="1024"/>
  <text class="title" x="716" y="64" text-anchor="middle">Account Migration Checkpoint Restart Sequence</text>
  <text class="subtitle" x="716" y="98" text-anchor="middle">The checkpoint advances only after a safe chunk; the restart loads the same key and resumes at index 2.</text>
  <g id="participant-1"><rect class="card" x="-5" y="160" width="190" height="78" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/><text class="cardTitle" x="90" y="203" text-anchor="middle">Job</text><line class="lifeline" x1="90" y1="238" x2="90" y2="912"/></g>
  <g id="participant-2"><rect class="card" x="305.2" y="160" width="196" height="78" rx="10" fill="#FFF3D9" stroke="#D6A441"/><text class="cardTitle" x="403.2" y="203" text-anchor="middle">Reader</text><line class="lifeline" x1="403.2" y1="238" x2="403.2" y2="912"/></g>
  <g id="participant-3"><rect class="card" x="611.5" y="160" width="210" height="78" rx="10" fill="#EAF7EF" stroke="#58A978"/><text class="cardTitle" x="716.5" y="203" text-anchor="middle">Processor</text><line class="lifeline" x1="716.5" y1="238" x2="716.5" y2="912"/></g>
  <g id="participant-4"><rect class="card" x="923.8" y="160" width="212" height="78" rx="10" fill="#F1ECFF" stroke="#8A72D6"/><text class="cardTitle" x="1029.8" y="203" text-anchor="middle">Writer</text><line class="lifeline" x1="1029.8" y1="238" x2="1029.8" y2="912"/></g>
  <g id="participant-5"><rect class="card" x="1248" y="160" width="190" height="78" rx="10" fill="#FDECEF" stroke="#DC6B82"/><text class="cardTitle" x="1343" y="203" text-anchor="middle">Checkpoint</text><line class="lifeline" x1="1343" y1="238" x2="1343" y2="912"/></g>
  <rect class="activation" x="396.2" y="356" width="14" height="506" rx="6"/>
  <rect class="activation" x="709.5" y="406" width="14" height="346" rx="6"/>
  <rect class="activation" x="1022.8" y="456" width="14" height="446" rx="6"/>
  <rect class="activation" x="1336" y="316" width="14" height="586" rx="6"/>
  <rect class="alt" x="64" y="590" width="1305" height="186" rx="16"/>
  <rect class="label failLabel" x="88" y="576" width="230" height="28" rx="8"/>
  <text class="msg failText" x="203" y="595" text-anchor="middle">alt failure / branch path</text>
  <g id="message-1"><rect class="label callLabel" x="556.5" y="288" width="320" height="28" rx="8"/><circle cx="574.5" cy="302" r="12" fill="#3F7D9C"/><text class="badgeText" x="574.5" y="306" text-anchor="middle" fill="#fff">1</text><text class="msg callText" x="724.5" y="306" text-anchor="middle">first run loads key: not found</text><path class="call" d="M 90 324 H 1343"/></g>
  <g id="message-2"><rect class="label callLabel" x="132.3" y="338" width="228.6" height="28" rx="8"/><circle cx="150.3" cy="352" r="12" fill="#3F7D9C"/><text class="badgeText" x="150.3" y="356" text-anchor="middle" fill="#fff">2</text><text class="msg callText" x="254.6" y="356" text-anchor="middle">read acct-1001..1002</text><path class="call" d="M 90 374 H 403.2"/></g>
  <g id="message-3"><rect class="label returnLabel" x="484.9" y="388" width="150" height="28" rx="8"/><circle cx="502.9" cy="402" r="12" fill="#6E8F4F"/><text class="badgeText" x="502.9" y="406" text-anchor="middle" fill="#fff">3</text><text class="msg returnText" x="567.9" y="406" text-anchor="middle">normalize</text><path class="return" d="M 403.2 424 H 716.5"/></g>
  <g id="message-4"><rect class="label returnLabel" x="798.1" y="438" width="150" height="28" rx="8"/><circle cx="816.1" cy="452" r="12" fill="#6E8F4F"/><text class="badgeText" x="816.1" y="456" text-anchor="middle" fill="#fff">4</text><text class="msg returnText" x="881.1" y="456" text-anchor="middle">write chunk 1</text><path class="return" d="M 716.5 474 H 1029.8"/></g>
  <g id="message-5"><rect class="label callLabel" x="1089.2" y="488" width="194.3" height="28" rx="8"/><circle cx="1107.2" cy="502" r="12" fill="#3F7D9C"/><text class="badgeText" x="1107.2" y="506" text-anchor="middle" fill="#fff">5</text><text class="msg callText" x="1194.4" y="506" text-anchor="middle">save next_index=2</text><path class="call" d="M 1029.8 524 H 1343"/></g>
  <g id="message-6"><rect class="label callLabel" x="166.6" y="628" width="160" height="28" rx="8"/><circle cx="184.6" cy="642" r="12" fill="#3F7D9C"/><text class="badgeText" x="184.6" y="646" text-anchor="middle" fill="#fff">6</text><text class="msg callText" x="254.6" y="646" text-anchor="middle">read acct-1003</text><path class="call" d="M 90 664 H 403.2"/></g>
  <g id="message-7"><rect class="label failLabel" x="474.2" y="678" width="171.4" height="28" rx="8"/><circle cx="492.2" cy="692" r="12" fill="#B86868"/><text class="badgeText" x="492.2" y="696" text-anchor="middle" fill="#fff">7</text><text class="msg failText" x="567.9" y="696" text-anchor="middle">processor crash</text><path class="fail" d="M 403.2 714 H 716.5"/></g>
  <g id="message-8"><rect class="label asyncLabel" x="567.9" y="738" width="297.1" height="28" rx="8"/><circle cx="585.9" cy="752" r="12" fill="#755BC6"/><text class="badgeText" x="585.9" y="756" text-anchor="middle" fill="#fff">8</text><text class="msg asyncText" x="724.5" y="756" text-anchor="middle">restart loads next_index=2</text><path class="async" d="M 90 774 H 1343"/></g>
  <g id="message-9"><rect class="label asyncLabel" x="596.5" y="788" width="240" height="28" rx="8"/><circle cx="614.5" cy="802" r="12" fill="#755BC6"/><text class="badgeText" x="614.5" y="806" text-anchor="middle" fill="#fff">9</text><text class="msg asyncText" x="724.5" y="806" text-anchor="middle">write acct-1003..1005</text><path class="async" d="M 403.2 824 H 1029.8"/></g>
  <g id="message-10"><rect class="label returnLabel" x="1089.2" y="838" width="194.3" height="28" rx="8"/><circle cx="1107.2" cy="852" r="12" fill="#6E8F4F"/><text class="badgeText" x="1107.2" y="856" text-anchor="middle" fill="#fff">10</text><text class="msg returnText" x="1194.4" y="856" text-anchor="middle">save next_index=5</text><path class="return" d="M 1029.8 874 H 1343"/></g>
  <g><rect x="200.6" y="954" width="1031.8" height="42" rx="12" fill="#ffffff" stroke="#D6E3EF" stroke-width="1.6"/><text class="footer" x="716" y="981" text-anchor="middle">Completed chunk acct-1001..1002 is not read by the restart run.</text></g>
</svg>
