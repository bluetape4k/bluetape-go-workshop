<svg xmlns="http://www.w3.org/2000/svg" width="1605" height="936" viewBox="-60 0 1605 936" role="img" aria-labelledby="title desc">
  <title id="title">Retry Dead-Letter Batch Worker Sequence</title>
  <desc id="desc">Best-practices sequence diagram with participant cards, lifelines, activations, numbered labels, and branch frame.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
    <marker id="arrow-call" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 10,5 0,10" fill="#3F7D9C" stroke="#3F7D9C" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrow-return" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 10,5 0,10" fill="#6E8F4F" stroke="#6E8F4F" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrow-async" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 10,5 0,10" fill="#755BC6" stroke="#755BC6" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrow-fail" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 10,5 0,10" fill="#B86868" stroke="#B86868" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <style>
      @font-face { font-family: 'Architects Daughter'; src: url('file:///Users/debop/Library/Fonts/ArchitectsDaughter-Regular.ttf') format('truetype'); }
      @font-face { font-family: 'Comic Mono'; src: url('file:///Users/debop/Library/Fonts/ComicMono.ttf') format('truetype'); }
      .canvas{fill:#fbfcf8}.title{font-family:'Architects Daughter';font-size:40px;fill:#263238}.subtitle,.detail,.footer{font-family:'Comic Mono';fill:#36464f}.subtitle{font-size:16px}.footer{font-size:14px;fill:#60727d}.cardTitle{font-family:'Architects Daughter';font-size:21px;fill:#1f3138}.role{font-family:'Comic Mono';font-size:12px;fill:#546a73}.card{fill:#ffffff;stroke-width:2;filter:url(#shadow)}.lifeline{stroke:#9aaab1;stroke-width:2;stroke-dasharray:7 8;stroke-linecap:round}.activation{fill:#e6f2ec;stroke:#5b7e67;stroke-width:1.5}.call,.return,.async,.fail{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.call{stroke:#3F7D9C;marker-end:url(#arrow-call)}.return{stroke:#6E8F4F;stroke-width:2.6;stroke-dasharray:8 6;marker-end:url(#arrow-return)}.async{stroke:#755BC6;marker-end:url(#arrow-async)}.fail{stroke:#B86868;marker-end:url(#arrow-fail)}.alt{fill:#eef7f0;fill-opacity:.14;stroke:#78909c;stroke-width:2.4;stroke-dasharray:12 7}.divider{stroke:#78909c;stroke-width:2;stroke-dasharray:10 8}rect.label{fill:#ffffff;stroke:#d7e0e4;stroke-width:1.3}.callLabel{stroke:#9cc2d1}.returnLabel{stroke:#b6c9a4}.asyncLabel{stroke:#b8a9d5}.failLabel{stroke:#d9abab}.badgeText,.msg{font-family:'Comic Mono';font-size:12px;font-weight:700}.msg{font-size:13px}.callText{fill:#2f6f8e}.returnText{fill:#55783F}.asyncText{fill:#674b91}.failText{fill:#9d4f4f}
    </style>
  </defs>
  <rect class="canvas" x="-60" y="0" width="1605" height="936"/>
  <text class="title" x="742" y="64" text-anchor="middle">Retry Dead-Letter Batch Worker Sequence</text>
  <text class="subtitle" x="742" y="98" text-anchor="middle">The failed permanent item is recorded before the batch skip policy lets the job continue.</text>
  <g id="participant-1"><rect class="card" x="-5" y="160" width="190" height="78" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/><text class="cardTitle" x="90" y="203" text-anchor="middle">batch.Job</text><line class="lifeline" x1="90" y1="238" x2="90" y2="824"/></g>
  <g id="participant-2"><rect class="card" x="321.2" y="160" width="190" height="78" rx="10" fill="#FFF3D9" stroke="#D6A441"/><text class="cardTitle" x="416.2" y="203" text-anchor="middle">Reader</text><line class="lifeline" x1="416.2" y1="238" x2="416.2" y2="824"/></g>
  <g id="participant-3"><rect class="card" x="630.5" y="160" width="224" height="78" rx="10" fill="#EAF7EF" stroke="#58A978"/><text class="cardTitle" x="742.5" y="203" text-anchor="middle">Processor</text><line class="lifeline" x1="742.5" y1="238" x2="742.5" y2="824"/></g>
  <g id="participant-4"><rect class="card" x="973.8" y="160" width="190" height="78" rx="10" fill="#F1ECFF" stroke="#8A72D6"/><text class="cardTitle" x="1068.8" y="203" text-anchor="middle">Writer</text><line class="lifeline" x1="1068.8" y1="238" x2="1068.8" y2="824"/></g>
  <g id="participant-5"><rect class="card" x="1290" y="160" width="210" height="78" rx="10" fill="#FDECEF" stroke="#DC6B82"/><text class="cardTitle" x="1395" y="203" text-anchor="middle">DeadLetter</text><line class="lifeline" x1="1395" y1="238" x2="1395" y2="824"/></g>
  <rect class="activation" x="409.2" y="268" width="14" height="460" rx="6"/>
  <rect class="activation" x="735.5" y="302" width="14" height="474" rx="6"/>
  <rect class="activation" x="1061.8" y="362" width="14" height="306" rx="6"/>
  <rect class="activation" x="1388" y="664" width="14" height="150" rx="6"/>
  <rect class="alt" x="64" y="262" width="1357" height="538" rx="16"/>
  <rect class="label failLabel" x="88" y="248" width="230" height="28" rx="8"/>
  <text class="msg failText" x="203" y="267" text-anchor="middle">alt failure / branch path</text>
  <g id="message-1"><rect class="label failLabel" x="121.7" y="280" width="262.9" height="28" rx="8"/><circle cx="139.7" cy="294" r="12" fill="#B86868"/><text class="badgeText" x="139.7" y="298" text-anchor="middle" fill="#fff">1</text><text class="msg failText" x="261.1" y="298" text-anchor="middle">open + read ticket-1001</text><path class="fail" d="M 90 316 H 416.2"/></g>
  <g id="message-2"><rect class="label returnLabel" x="504.4" y="340" width="150" height="28" rx="8"/><circle cx="522.4" cy="354" r="12" fill="#6E8F4F"/><text class="badgeText" x="522.4" y="358" text-anchor="middle" fill="#fff">2</text><text class="msg returnText" x="587.4" y="358" text-anchor="middle">success</text><path class="return" d="M 416.2 376 H 742.5"/></g>
  <g id="message-3"><rect class="label returnLabel" x="814.2" y="400" width="182.9" height="28" rx="8"/><circle cx="832.2" cy="414" r="12" fill="#6E8F4F"/><text class="badgeText" x="832.2" y="418" text-anchor="middle" fill="#fff">3</text><text class="msg returnText" x="913.6" y="418" text-anchor="middle">chunk item ready</text><path class="return" d="M 742.5 436 H 1068.8"/></g>
  <g id="message-4"><rect class="label callLabel" x="459.4" y="460" width="240" height="28" rx="8"/><circle cx="477.4" cy="474" r="12" fill="#3F7D9C"/><text class="badgeText" x="477.4" y="478" text-anchor="middle" fill="#fff">4</text><text class="msg callText" x="587.4" y="478" text-anchor="middle">ticket-1002 transient</text><path class="call" d="M 416.2 496 H 742.5"/></g>
  <g id="message-5"><rect class="label failLabel" x="497.1" y="508" width="274.3" height="28" rx="8"/><circle cx="515.1" cy="522" r="12" fill="#B86868"/><text class="badgeText" x="515.1" y="526" text-anchor="middle" fill="#fff">5</text><text class="msg failText" x="642.2" y="526" text-anchor="middle">retry attempt 2 succeeds</text><path class="fail" d="M 742.5 544 H 790 Q 802 544 802 556 V 570 Q 802 582 790 582 H 742.5"/></g>
  <g id="message-6"><rect class="label asyncLabel" x="808.5" y="594" width="194.3" height="28" rx="8"/><circle cx="826.5" cy="608" r="12" fill="#755BC6"/><text class="badgeText" x="826.5" y="612" text-anchor="middle" fill="#fff">6</text><text class="msg asyncText" x="913.6" y="612" text-anchor="middle">write first chunk</text><path class="async" d="M 742.5 630 H 1068.8"/></g>
  <g id="message-7"><rect class="label failLabel" x="459.4" y="654" width="240" height="28" rx="8"/><circle cx="477.4" cy="668" r="12" fill="#B86868"/><text class="badgeText" x="477.4" y="672" text-anchor="middle" fill="#fff">7</text><text class="msg failText" x="587.4" y="672" text-anchor="middle">ticket-1003 permanent</text><path class="fail" d="M 416.2 690 H 742.5"/></g>
  <g id="message-8"><rect class="label failLabel" x="920.2" y="702" width="297.1" height="28" rx="8"/><circle cx="938.2" cy="716" r="12" fill="#B86868"/><text class="badgeText" x="938.2" y="720" text-anchor="middle" fill="#fff">8</text><text class="msg failText" x="1076.8" y="720" text-anchor="middle">record reason and attempts</text><path class="fail" d="M 742.5 738 H 1395"/></g>
  <g id="message-9"><rect class="label asyncLabel" x="520" y="750" width="460" height="28" rx="8"/><circle cx="542" cy="764" r="12" fill="#755BC6"/><text class="badgeText" x="542" y="768" text-anchor="middle" fill="#fff">9</text><text class="msg asyncText" x="760" y="768" text-anchor="middle">skip item, process ticket-1004, report completed</text><path class="async" d="M 1395 786 H 90"/></g>
  <g><rect x="207.9" y="866" width="1069.2" height="42" rx="12" fill="#ffffff" stroke="#D6E3EF" stroke-width="1.6"/><text class="footer" x="742" y="893" text-anchor="middle">Context cancellation returns cancelled status and is neither retried nor dead-lettered.</text></g>
</svg>
