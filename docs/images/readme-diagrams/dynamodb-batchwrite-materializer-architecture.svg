<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">DynamoDB batch write materializer architecture</title>
  <desc id="desc">Document events are mapped into DynamoDB write requests and written with bluetape-go batchwrite chunking and retry behavior.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb" stroke="#2563eb" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#059669" stroke="#059669" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#dc2626" stroke="#dc2626" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <symbol id="dynamodb-icon" viewBox="0 0 24 24">
      <path fill="#4053d6" d="M16.606 20.705v-2.371c-1.263 1.082-3.884 1.795-7.066 1.795-3.184 0-5.805-.714-7.068-1.797v2.369c0 1.168 2.903 2.47 7.068 2.47 4.16 0 7.06-1.3 7.066-2.466zm.001-6.765l.817-.005v.005c0 .517-.258.998-.75 1.441.601.54.75 1.071.75 1.449a1661.7 1661.7 0 0 0 0 3.87c0 1.881-3.389 3.3-7.884 3.3-4.471 0-7.846-1.404-7.88-3.27a583.119 583.119 0 0 1-.003-3.909c.001-.375.15-.9.745-1.437-.592-.538-.743-1.062-.746-1.435v-3.892c.002-.377.153-.903.747-1.438-.593-.54-.744-1.062-.747-1.435 0-1.357-.002-2.735.002-3.897C1.674 1.412 5.056 0 9.54 0c2.159 0 4.233.356 5.689.974l-.315.766c-1.36-.58-3.319-.91-5.374-.91-4.165 0-7.067 1.3-7.067 2.47 0 1.168 2.902 2.47 7.067 2.47.115 0 .222 0 .334-.005l.033.828c-.122.006-.245.006-.367.006-3.184 0-5.805-.714-7.068-1.798v2.38c.005.45.45.843.821 1.093 1.116.736 3.114 1.239 5.34 1.342l-.037.829c-2.254-.105-4.23-.59-5.5-1.332-.318.245-.623.573-.623.952 0 1.168 2.902 2.47 7.067 2.47.411 0 .812-.014 1.203-.042l.06.826c-.41.03-.833.045-1.263.045-3.184 0-5.805-.713-7.068-1.797v2.368c.005.462.449.855.821 1.104 1.275.842 3.67 1.366 6.247 1.366h.182v.83H9.54c-2.62 0-4.99-.507-6.444-1.359-.317.245-.623.574-.623.954 0 1.168 2.902 2.47 7.067 2.47 4.159 0 7.058-1.298 7.066-2.465v-.007c0-.377-.303-.705-.62-.948a5.732 5.732 0 0 1-.662.336l-.316-.764c.3-.128.56-.266.776-.412.376-.254.823-.651.823-1.1zm4.377-6.915h-2.717a.406.406 0 0 1-.332-.173.42.42 0 0 1-.055-.375l1.204-3.597h-5.403l-2.583 4.974h2.623c.128 0 .248.06.325.164a.418.418 0 0 1 .069.36l-2.249 8.365zm1.249-.128l-10.89 11.608a.408.408 0 0 1-.498.075.418.418 0 0 1-.192-.471l2.534-9.426h-2.766a.407.407 0 0 1-.349-.2.418.418 0 0 1-.012-.407l3.014-5.804a.408.408 0 0 1 .36-.222h6.22c.132 0 .256.065.332.174a.422.422 0 0 1 .055.374l-1.204 3.598h3.1c.164 0 .31.099.375.251a.422.422 0 0 1-.08.45zM3.085 20.723a8.107 8.107 0 0 0 1.72.72l.233-.794a7.32 7.32 0 0 1-1.546-.645zm1.72-5.984l.233-.795a7.262 7.262 0 0 1-1.546-.646l-.407.72a8.051 8.051 0 0 0 1.72.72zm-1.72-7.427l.407-.719c.418.244.939.462 1.546.646l-.232.794a8.046 8.046 0 0 1-1.72-.72Z"/>
    </symbol>
  </defs>
  <style>
    text { font-family: "Architects Daughter", "Comic Mono", "Comic Sans MS", sans-serif; fill: #132033; letter-spacing: 0; }
    .canvas { fill: #f8fafc; }
    .title { font-size: 30px; font-weight: 700; }
    .subtitle { font-size: 15px; fill: #475569; }
    .lane { fill: #eef6ff; stroke: #bfd7ff; stroke-width: 2; rx: 18; }
    .lane2 { fill: #ecfdf5; stroke: #a7f3d0; stroke-width: 2; rx: 18; }
    .lane3 { fill: #fff7ed; stroke: #fed7aa; stroke-width: 2; rx: 18; }
    .lane-title { font-size: 17px; font-weight: 700; fill: #334155; }
    .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 10; }
    .blue { fill: #dbeafe; stroke: #93c5fd; stroke-width: 2; rx: 10; }
    .green { fill: #dcfce7; stroke: #86efac; stroke-width: 2; rx: 10; }
    .red { fill: #fee2e2; stroke: #fca5a5; stroke-width: 2; rx: 10; }
    .purple { fill: #f3e8ff; stroke: #d8b4fe; stroke-width: 2; rx: 10; }
    .card-title { font-size: 17px; font-weight: 700; }
    .card-sub { font-size: 13px; fill: #475569; }
    .label { font-size: 12px; fill: #334155; }
    .small { font-size: 12px; fill: #64748b; }
    .arrow-blue { fill: none; stroke: #2563eb; stroke-width: 3.4; marker-end: url(#arrow-blue); stroke-linecap: round; stroke-linejoin: round; }
    .arrow-green { fill: none; stroke: #059669; stroke-width: 3.4; marker-end: url(#arrow-green); stroke-linecap: round; stroke-linejoin: round; }
    .arrow-red { fill: none; stroke: #dc2626; stroke-width: 3.4; marker-end: url(#arrow-red); stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect class="canvas" width="1200" height="720"/>
  <text class="title" x="60" y="58">DynamoDB batch write materializer</text>
  <text class="subtitle" x="60" y="86">Domain events become DynamoDB WriteRequests; batchwrite owns chunking, retry, cancellation, and typed error preservation.</text>

  <rect class="lane" x="48" y="120" width="1104" height="180"/>
  <text class="lane-title" x="74" y="152">Application mapping boundary</text>
  <rect class="blue" x="88" y="182" width="220" height="82"/>
  <text class="card-title" x="112" y="212">Document events</text>
  <text class="card-sub" x="112" y="236">30 tenant document updates</text>
  <rect class="card" x="388" y="182" width="230" height="82"/>
  <text class="card-title" x="412" y="212">Materializer</text>
  <text class="card-sub" x="412" y="236">validates and maps items</text>
  <rect class="green" x="698" y="182" width="230" height="82"/>
  <text class="card-title" x="722" y="212">WriteRequests</text>
  <text class="card-sub" x="722" y="236">pk/sk + projection fields</text>

  <path class="arrow-blue" d="M 308 223 H 388"/>
  <text class="label" x="322" y="210">domain batch</text>
  <path class="arrow-green" d="M 618 223 H 698"/>
  <text class="label" x="634" y="210">map</text>

  <rect class="lane2" x="48" y="336" width="520" height="228"/>
  <text class="lane-title" x="74" y="368">bluetape-go batchwrite</text>
  <rect class="green" x="88" y="402" width="190" height="100"/>
  <text class="card-title" x="112" y="432">Chunker</text>
  <text class="card-sub" x="112" y="456">25 item limit</text>
  <text class="card-sub" x="112" y="478">30 becomes 25 + 5</text>
  <rect class="green" x="326" y="402" width="190" height="100"/>
  <text class="card-title" x="350" y="432">Retry loop</text>
  <text class="card-sub" x="350" y="456">resubmit only</text>
  <text class="card-sub" x="350" y="478">UnprocessedItems</text>

  <rect class="lane3" x="632" y="336" width="520" height="228"/>
  <text class="lane-title" x="658" y="368">DynamoDB and error boundary</text>
  <rect class="purple" x="672" y="402" width="210" height="100"/>
  <use href="#dynamodb-icon" data-bluetape4k-icon="amazon-dynamodb" x="696" y="424" width="34" height="34"/>
  <text class="card-title" x="742" y="432">DynamoDB</text>
  <text class="card-sub" x="742" y="456">BatchWriteItem</text>
  <text class="card-sub" x="742" y="478">Floci smoke opt-in</text>
  <rect class="red" x="924" y="402" width="180" height="100"/>
  <text class="card-title" x="948" y="432">Error policy</text>
  <text class="card-sub" x="948" y="456">retry exhausted</text>
  <text class="card-sub" x="948" y="478">typed AWS error</text>

  <path class="arrow-green" d="M 812 264 V 310 Q 812 326 796 326 H 183 V 402"/>
  <text class="label" x="516" y="314">request map</text>
  <path class="arrow-green" d="M 278 452 H 326"/>
  <path class="arrow-blue" d="M 516 452 H 672"/>
  <text class="label" x="554" y="440">batch calls</text>
  <path class="arrow-red" d="M 882 452 H 924"/>

  <rect class="card" x="146" y="618" width="908" height="54"/>
  <text class="small" x="170" y="642">Reader contract: normal tests use deterministic fakes; the Floci/DynamoDB smoke path is documented and opt-in.</text>
  <text class="small" x="170" y="662">Service errors keep AWS SDK types; retry exhaustion keeps batchwrite.ErrUnprocessedItems and app-level ErrRetryExhausted.</text>
</svg>
