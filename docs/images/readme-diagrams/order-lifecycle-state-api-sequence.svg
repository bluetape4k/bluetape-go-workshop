<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="922" viewBox="-60 0 1500 922" role="img" aria-labelledby="title desc">
  <title id="title">Order Lifecycle API Sequence</title>
  <desc id="desc">Best-practices sequence diagram with participant cards, lifelines, activations, numbered labels, and branch frame.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
    <marker id="arrow-call" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 10,5 0,10" fill="#3F7D9C" stroke="#3F7D9C" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrow-return" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 10,5 0,10" fill="#6E8F4F" stroke="#6E8F4F" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrow-async" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 10,5 0,10" fill="#755BC6" stroke="#755BC6" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrow-fail" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 10,5 0,10" fill="#B86868" stroke="#B86868" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <style>
      @font-face { font-family: 'Architects Daughter'; src: url('file:///Users/debop/Library/Fonts/ArchitectsDaughter-Regular.ttf') format('truetype'); }
      @font-face { font-family: 'Comic Mono'; src: url('file:///Users/debop/Library/Fonts/ComicMono.ttf') format('truetype'); }
      .canvas{fill:#fbfcf8}.title{font-family:'Architects Daughter';font-size:40px;fill:#263238}.subtitle,.detail,.footer{font-family:'Comic Mono';fill:#36464f}.subtitle{font-size:16px}.footer{font-size:14px;fill:#60727d}.cardTitle{font-family:'Architects Daughter';font-size:21px;fill:#1f3138}.role{font-family:'Comic Mono';font-size:12px;fill:#546a73}.card{fill:#ffffff;stroke-width:2;filter:url(#shadow)}.lifeline{stroke:#9aaab1;stroke-width:2;stroke-dasharray:7 8;stroke-linecap:round}.activation{fill:#e6f2ec;stroke:#5b7e67;stroke-width:1.5}.call,.return,.async,.fail{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.call{stroke:#3F7D9C;marker-end:url(#arrow-call)}.return{stroke:#6E8F4F;stroke-width:2.6;stroke-dasharray:8 6;marker-end:url(#arrow-return)}.async{stroke:#755BC6;marker-end:url(#arrow-async)}.fail{stroke:#B86868;marker-end:url(#arrow-fail)}.alt{fill:#eef7f0;fill-opacity:.14;stroke:#78909c;stroke-width:2.4;stroke-dasharray:12 7}.divider{stroke:#78909c;stroke-width:2;stroke-dasharray:10 8}rect.label{fill:#ffffff;stroke:#d7e0e4;stroke-width:1.3}.callLabel{stroke:#9cc2d1}.returnLabel{stroke:#b6c9a4}.asyncLabel{stroke:#b8a9d5}.failLabel{stroke:#d9abab}.badgeText,.msg{font-family:'Comic Mono';font-size:12px;font-weight:700}.msg{font-size:13px}.callText{fill:#2f6f8e}.returnText{fill:#55783F}.asyncText{fill:#674b91}.failText{fill:#9d4f4f}
    </style>
  </defs>
  <rect class="canvas" x="-60" y="0" width="1500" height="922"/>
  <text class="title" x="690" y="64" text-anchor="middle">Order Lifecycle API Sequence</text>
  <text class="subtitle" x="690" y="98" text-anchor="middle">The handler delegates all lifecycle legality to state.Machine, then maps sentinel errors to HTTP status codes.</text>
  <g id="participant-1"><rect class="card" x="-5" y="160" width="190" height="78" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/><text class="cardTitle" x="90" y="203" text-anchor="middle">Client</text><line class="lifeline" x1="90" y1="238" x2="90" y2="810"/></g>
  <g id="participant-2"><rect class="card" x="395" y="160" width="190" height="78" rx="10" fill="#FFF3D9" stroke="#D6A441"/><text class="cardTitle" x="490" y="203" text-anchor="middle">Gin Handler</text><line class="lifeline" x1="490" y1="238" x2="490" y2="810"/></g>
  <g id="participant-3"><rect class="card" x="785" y="160" width="210" height="78" rx="10" fill="#EAF7EF" stroke="#58A978"/><text class="cardTitle" x="890" y="203" text-anchor="middle">state.Machine</text><line class="lifeline" x1="890" y1="238" x2="890" y2="810"/></g>
  <g id="participant-4"><rect class="card" x="1195" y="160" width="190" height="78" rx="10" fill="#F1ECFF" stroke="#8A72D6"/><text class="cardTitle" x="1290" y="203" text-anchor="middle">Pay Guard</text><line class="lifeline" x1="1290" y1="238" x2="1290" y2="810"/></g>
  <rect class="activation" x="483" y="316" width="14" height="484" rx="6"/>
  <rect class="activation" x="883" y="324" width="14" height="378" rx="6"/>
  <rect class="activation" x="1283" y="558" width="14" height="100" rx="6"/>
  <rect class="alt" x="64" y="576" width="1252" height="254" rx="16"/>
  <rect class="label failLabel" x="88" y="562" width="230" height="28" rx="8"/>
  <text class="msg failText" x="203" y="581" text-anchor="middle">alt failure / branch path</text>
  <g id="message-1"><rect class="label callLabel" x="215" y="262" width="150" height="28" rx="8"/><circle cx="233" cy="276" r="12" fill="#3F7D9C"/><text class="badgeText" x="233" y="280" text-anchor="middle" fill="#fff">1</text><text class="msg callText" x="298" y="280" text-anchor="middle">POST submit</text><path class="call" d="M 90 298 H 490"/></g>
  <g id="message-2"><rect class="label callLabel" x="587.1" y="306" width="205.7" height="28" rx="8"/><circle cx="605.1" cy="320" r="12" fill="#3F7D9C"/><text class="badgeText" x="605.1" y="324" text-anchor="middle" fill="#fff">2</text><text class="msg callText" x="698" y="324" text-anchor="middle">Transition(submit)</text><path class="call" d="M 490 342 H 890"/></g>
  <g id="message-3"><rect class="label returnLabel" x="587.1" y="350" width="205.7" height="28" rx="8"/><circle cx="605.1" cy="364" r="12" fill="#6E8F4F"/><text class="badgeText" x="605.1" y="368" text-anchor="middle" fill="#fff">3</text><text class="msg returnText" x="698" y="368" text-anchor="middle">draft -&gt; submitted</text><path class="return" d="M 890 386 H 490"/></g>
  <g id="message-4"><rect class="label returnLabel" x="215" y="394" width="150" height="28" rx="8"/><circle cx="233" cy="408" r="12" fill="#6E8F4F"/><text class="badgeText" x="233" y="412" text-anchor="middle" fill="#fff">4</text><text class="msg returnText" x="298" y="412" text-anchor="middle">200 snapshot</text><path class="return" d="M 490 430 H 90"/></g>
  <g id="message-5"><rect class="label callLabel" x="215" y="452" width="150" height="28" rx="8"/><circle cx="233" cy="466" r="12" fill="#3F7D9C"/><text class="badgeText" x="233" y="470" text-anchor="middle" fill="#fff">5</text><text class="msg callText" x="298" y="470" text-anchor="middle">GET pay/can</text><path class="call" d="M 90 488 H 490"/></g>
  <g id="message-6"><rect class="label callLabel" x="587.1" y="496" width="205.7" height="28" rx="8"/><circle cx="605.1" cy="510" r="12" fill="#3F7D9C"/><text class="badgeText" x="605.1" y="514" text-anchor="middle" fill="#fff">6</text><text class="msg callText" x="698" y="514" text-anchor="middle">CanTransition(pay)</text><path class="call" d="M 490 532 H 890"/></g>
  <g id="message-7"><rect class="label callLabel" x="1015" y="540" width="150" height="28" rx="8"/><circle cx="1033" cy="554" r="12" fill="#3F7D9C"/><text class="badgeText" x="1033" y="558" text-anchor="middle" fill="#fff">7</text><text class="msg callText" x="1098" y="558" text-anchor="middle">check total</text><path class="call" d="M 890 576 H 1290"/></g>
  <g id="message-8"><rect class="label failLabel" x="998.6" y="584" width="182.9" height="28" rx="8"/><circle cx="1016.6" cy="598" r="12" fill="#B86868"/><text class="badgeText" x="1016.6" y="602" text-anchor="middle" fill="#fff">8</text><text class="msg failText" x="1098" y="602" text-anchor="middle">allowed or error</text><path class="fail" d="M 1290 620 H 890"/></g>
  <g id="message-9"><rect class="label returnLabel" x="598.6" y="628" width="182.9" height="28" rx="8"/><circle cx="616.6" cy="642" r="12" fill="#6E8F4F"/><text class="badgeText" x="616.6" y="646" text-anchor="middle" fill="#fff">9</text><text class="msg returnText" x="698" y="646" text-anchor="middle">allowed response</text><path class="return" d="M 890 664 H 490"/></g>
  <g id="message-10"><rect class="label failLabel" x="210" y="736" width="160" height="28" rx="8"/><circle cx="228" cy="750" r="12" fill="#B86868"/><text class="badgeText" x="228" y="754" text-anchor="middle" fill="#fff">10</text><text class="msg failText" x="298" y="754" text-anchor="middle">409 error JSON</text><path class="fail" d="M 490 772 H 90"/></g>
  <g><rect x="193.2" y="852" width="993.6" height="42" rx="12" fill="#ffffff" stroke="#D6E3EF" stroke-width="1.6"/><text class="footer" x="690" y="879" text-anchor="middle">Tests drive this sequence with allowed, invalid, guard, final-state, bad-request, and concurrent requests.</text></g>
</svg>
