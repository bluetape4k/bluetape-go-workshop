<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">Customer Migration Crash and Leader-held Restart Sequence</title>
  <desc id="desc">Sixteen-message sequence showing a manual batch run, a writer crash after cust-1003 is written, checkpoint rollback, leader-held scheduled restart, duplicate replay, dead-letter handling, and completion at next index five.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-18%" width="120%" height="145%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#203040" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-call" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#3f7d9c"/>
    </marker>
    <marker id="arrow-state" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#6e8f4f"/>
    </marker>
    <marker id="arrow-schedule" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#755bc6"/>
    </marker>
    <marker id="arrow-fail" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#b86868"/>
    </marker>
    <marker id="arrow-skip" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#b9851b"/>
    </marker>
    <style>
      .canvas { fill: #fbfcf8; }
      .frame { fill: #ffffff; fill-opacity: 0.34; stroke: #c7d7e7; stroke-width: 2; }
      .title { font-family: "Architects Daughter", "Comic Sans MS", cursive; font-size: 38px; fill: #263238; }
      .subtitle, .role, .msg, .badge, .frame-title, .footer { font-family: "Comic Mono", monospace; }
      .subtitle { font-size: 14px; fill: #52656f; }
      .participant-title { font-family: "Architects Daughter", "Comic Sans MS", cursive; font-size: 20px; fill: #22344a; }
      .role { font-size: 11px; fill: #536476; }
      .card { fill: #ffffff; stroke-width: 2; filter: url(#shadow); }
      .lifeline { stroke: #9aaab1; stroke-width: 2; stroke-dasharray: 7 8; stroke-linecap: round; }
      .activation { fill: #e6f2ec; stroke: #5b7e67; stroke-width: 1.5; }
      .alt { fill: none; stroke-width: 2.2; stroke-dasharray: 11 7; }
      .frame-title { font-size: 12px; font-weight: 700; }
      .label { fill: #ffffff; stroke-width: 1.3; }
      .msg { font-size: 12px; font-weight: 700; }
      .badge { font-size: 11px; font-weight: 700; fill: #ffffff; }
      .call, .state, .schedule, .fail, .skip { fill: none; stroke-width: 2.8; stroke-linecap: round; }
      .call { stroke: #3f7d9c; marker-end: url(#arrow-call); }
      .state { stroke: #6e8f4f; stroke-dasharray: 8 6; marker-end: url(#arrow-state); }
      .schedule { stroke: #755bc6; marker-end: url(#arrow-schedule); }
      .fail { stroke: #b86868; marker-end: url(#arrow-fail); }
      .skip { stroke: #b9851b; marker-end: url(#arrow-skip); }
      .call-label { stroke: #9cc2d1; }
      .state-label { stroke: #b6c9a4; }
      .schedule-label { stroke: #b8a9d5; }
      .fail-label { stroke: #d9abab; }
      .skip-label { stroke: #dbc07a; }
      .call-text { fill: #2f6f8e; }
      .state-text { fill: #55783f; }
      .schedule-text { fill: #674b91; }
      .fail-text { fill: #9d4f4f; }
      .skip-text { fill: #8a6415; }
      .footer { font-size: 12px; fill: #60727d; }
    </style>
  </defs>

  <rect class="canvas" width="1600" height="1200"/>
  <rect class="frame" x="24" y="18" width="1552" height="1164" rx="22"/>
  <text class="title" x="800" y="54" text-anchor="middle">Customer Migration Crash and Leader-held Restart</text>
  <text class="subtitle" x="800" y="82" text-anchor="middle">A written boundary record may replay, but the idempotent sink and committed checkpoint keep the restart safe.</text>

  <g id="participant-operator">
    <rect class="card" x="46" y="116" width="208" height="72" rx="12" fill="#e8f3ff" stroke="#5b8def"/>
    <text class="participant-title" x="150" y="145" text-anchor="middle">Operator</text>
    <text class="role" x="150" y="169" text-anchor="middle">manual / scheduled caller</text>
    <line class="lifeline" x1="150" y1="188" x2="150" y2="1090"/>
  </g>
  <g id="participant-gin-service">
    <rect class="card" x="356" y="116" width="238" height="72" rx="12" fill="#fff3d9" stroke="#d6a441"/>
    <text class="participant-title" x="475" y="145" text-anchor="middle">Gin + Service</text>
    <text class="role" x="475" y="169" text-anchor="middle">HTTP policy + run lifecycle</text>
    <line class="lifeline" x1="475" y1="188" x2="475" y2="1090"/>
  </g>
  <g id="participant-leader-batch">
    <rect class="card" x="681" y="116" width="238" height="72" rx="12" fill="#f1ecff" stroke="#8a72d6"/>
    <text class="participant-title" x="800" y="145" text-anchor="middle">Leader Gate + Batch</text>
    <text class="role" x="800" y="169" text-anchor="middle">admission + chunk policies</text>
    <line class="lifeline" x1="800" y1="188" x2="800" y2="1090"/>
  </g>
  <g id="participant-writer-sink">
    <rect class="card" x="1006" y="116" width="238" height="72" rx="12" fill="#eaf7ef" stroke="#58a978"/>
    <text class="participant-title" x="1125" y="145" text-anchor="middle">Writer + Sink</text>
    <text class="role" x="1125" y="169" text-anchor="middle">idempotent customer writes</text>
    <line class="lifeline" x1="1125" y1="188" x2="1125" y2="1090"/>
  </g>
  <g id="participant-checkpoint-deadletter">
    <rect class="card" x="1328" y="116" width="244" height="72" rx="12" fill="#fdecef" stroke="#dc6b82"/>
    <text class="participant-title" x="1450" y="145" text-anchor="middle">Checkpoint + DLQ</text>
    <text class="role" x="1450" y="169" text-anchor="middle">progress + skipped records</text>
    <line class="lifeline" x1="1450" y1="188" x2="1450" y2="1090"/>
  </g>

  <rect class="activation" x="468" y="224" width="14" height="842" rx="6"/>
  <rect class="activation" x="793" y="304" width="14" height="762" rx="6"/>
  <rect class="activation" x="1118" y="334" width="14" height="692" rx="6"/>
  <rect class="activation" x="1443" y="264" width="14" height="782" rx="6"/>

  <rect class="alt" x="70" y="430" width="1460" height="212" rx="16" stroke="#b86868"/>
  <rect class="label fail-label" x="92" y="416" width="214" height="28" rx="8"/>
  <text class="frame-title fail-text" x="199" y="435" text-anchor="middle">alt writer crash</text>

  <rect class="alt" x="70" y="650" width="1460" height="432" rx="16" stroke="#755bc6"/>
  <rect class="label schedule-label" x="92" y="636" width="264" height="28" rx="8"/>
  <text class="frame-title schedule-text" x="224" y="655" text-anchor="middle">restart while leader</text>

  <g id="message-1">
    <rect class="label call-label" x="200" y="212" width="226" height="28" rx="8"/>
    <circle cx="218" cy="226" r="12" fill="#3f7d9c"/><text class="badge" x="218" y="230" text-anchor="middle">1</text>
    <text class="msg call-text" x="321" y="230" text-anchor="middle">POST /batch/start</text>
    <path class="call" data-connector="message-1" d="M 150 250 L 475 250"/>
  </g>
  <g id="message-2">
    <rect class="label call-label" x="800" y="262" width="326" height="28" rx="8"/>
    <circle cx="818" cy="276" r="12" fill="#3f7d9c"/><text class="badge" x="818" y="280" text-anchor="middle">2</text>
    <text class="msg call-text" x="971" y="280" text-anchor="middle">load checkpoint: none</text>
    <path class="call" data-connector="message-2" d="M 475 300 L 1450 300"/>
  </g>
  <g id="message-3">
    <rect class="label state-label" x="825" y="312" width="276" height="28" rx="8"/>
    <circle cx="843" cy="326" r="12" fill="#6e8f4f"/><text class="badge" x="843" y="330" text-anchor="middle">3</text>
    <text class="msg state-text" x="971" y="330" text-anchor="middle">write cust-1001..1002</text>
    <path class="state" data-connector="message-3" d="M 800 350 L 1125 350"/>
  </g>
  <g id="message-4">
    <rect class="label state-label" x="1168" y="362" width="254" height="28" rx="8"/>
    <circle cx="1186" cy="376" r="12" fill="#6e8f4f"/><text class="badge" x="1186" y="380" text-anchor="middle">4</text>
    <text class="msg state-text" x="1303" y="380" text-anchor="middle">save next_index=2</text>
    <path class="state" data-connector="message-4" d="M 1125 400 L 1450 400"/>
  </g>

  <g id="message-5">
    <rect class="label call-label" x="835" y="442" width="256" height="28" rx="8"/>
    <circle cx="853" cy="456" r="12" fill="#3f7d9c"/><text class="badge" x="853" y="460" text-anchor="middle">5</text>
    <text class="msg call-text" x="971" y="460" text-anchor="middle">write cust-1003</text>
    <path class="call" data-connector="message-5" d="M 800 480 L 1125 480"/>
  </g>
  <g id="message-6">
    <rect class="label fail-label" x="838" y="492" width="250" height="28" rx="8"/>
    <circle cx="856" cy="506" r="12" fill="#b86868"/><text class="badge" x="856" y="510" text-anchor="middle">6</text>
    <text class="msg fail-text" x="971" y="510" text-anchor="middle">writer crash</text>
    <path class="fail" data-connector="message-6" d="M 1125 530 L 800 530"/>
  </g>
  <g id="message-7">
    <rect class="label fail-label" x="1028" y="542" width="280" height="28" rx="8"/>
    <circle cx="1046" cy="556" r="12" fill="#b86868"/><text class="badge" x="1046" y="560" text-anchor="middle">7</text>
    <text class="msg fail-text" x="1173" y="560" text-anchor="middle">rollback next_index=2</text>
    <path class="fail" data-connector="message-7" d="M 800 580 L 1450 580"/>
  </g>
  <g id="message-8">
    <rect class="label fail-label" x="198" y="592" width="230" height="28" rx="8"/>
    <circle cx="216" cy="606" r="12" fill="#b86868"/><text class="badge" x="216" y="610" text-anchor="middle">8</text>
    <text class="msg fail-text" x="323" y="610" text-anchor="middle">409 writer_crash</text>
    <path class="fail" data-connector="message-8" d="M 475 630 L 150 630"/>
  </g>

  <g id="message-9">
    <rect class="label schedule-label" x="184" y="672" width="258" height="28" rx="8"/>
    <circle cx="202" cy="686" r="12" fill="#755bc6"/><text class="badge" x="202" y="690" text-anchor="middle">9</text>
    <text class="msg schedule-text" x="321" y="690" text-anchor="middle">POST /batch/schedule/tick</text>
    <path class="schedule" data-connector="message-9" d="M 150 710 L 475 710"/>
  </g>
  <g id="message-10">
    <rect class="label state-label" x="504" y="722" width="266" height="28" rx="8"/>
    <circle cx="522" cy="736" r="12" fill="#6e8f4f"/><text class="badge" x="522" y="740" text-anchor="middle">10</text>
    <text class="msg state-text" x="645" y="740" text-anchor="middle">leadership held</text>
    <path class="state" data-connector="message-10" d="M 475 760 L 800 760"/>
  </g>
  <g id="message-11">
    <rect class="label schedule-label" x="1018" y="772" width="284" height="28" rx="8"/>
    <circle cx="1036" cy="786" r="12" fill="#755bc6"/><text class="badge" x="1036" y="790" text-anchor="middle">11</text>
    <text class="msg schedule-text" x="1165" y="790" text-anchor="middle">restore next_index=2</text>
    <path class="schedule" data-connector="message-11" d="M 800 810 L 1450 810"/>
  </g>
  <g id="message-12">
    <rect class="label state-label" x="824" y="822" width="278" height="28" rx="8"/>
    <circle cx="842" cy="836" r="12" fill="#6e8f4f"/><text class="badge" x="842" y="840" text-anchor="middle">12</text>
    <text class="msg state-text" x="971" y="840" text-anchor="middle">cust-1003 duplicate no-op</text>
    <path class="state" data-connector="message-12" d="M 800 860 L 1125 860"/>
  </g>
  <g id="message-13">
    <rect class="label skip-label" x="946" y="872" width="358" height="28" rx="8"/>
    <circle cx="964" cy="886" r="12" fill="#b9851b"/><text class="badge" x="964" y="890" text-anchor="middle">13</text>
    <text class="msg skip-text" x="1133" y="890" text-anchor="middle">retry 1003 / dead-letter 1004</text>
    <path class="skip" data-connector="message-13" d="M 800 910 L 1450 910"/>
  </g>
  <g id="message-14">
    <rect class="label state-label" x="840" y="922" width="246" height="28" rx="8"/>
    <circle cx="858" cy="936" r="12" fill="#6e8f4f"/><text class="badge" x="858" y="940" text-anchor="middle">14</text>
    <text class="msg state-text" x="971" y="940" text-anchor="middle">write cust-1005</text>
    <path class="state" data-connector="message-14" d="M 800 960 L 1125 960"/>
  </g>
  <g id="message-15">
    <rect class="label state-label" x="1168" y="972" width="254" height="28" rx="8"/>
    <circle cx="1186" cy="986" r="12" fill="#6e8f4f"/><text class="badge" x="1186" y="990" text-anchor="middle">15</text>
    <text class="msg state-text" x="1303" y="990" text-anchor="middle">save next_index=5</text>
    <path class="state" data-connector="message-15" d="M 1125 1010 L 1450 1010"/>
  </g>
  <g id="message-16">
    <rect class="label state-label" x="190" y="1022" width="246" height="28" rx="8"/>
    <circle cx="208" cy="1036" r="12" fill="#6e8f4f"/><text class="badge" x="208" y="1040" text-anchor="middle">16</text>
    <text class="msg state-text" x="323" y="1040" text-anchor="middle">200 completed report</text>
    <path class="state" data-connector="message-16" d="M 475 1060 L 150 1060"/>
  </g>

  <rect x="164" y="1110" width="1272" height="50" rx="13" fill="#ffffff" stroke="#d6e3ef" stroke-width="1.6"/>
  <text class="footer" x="800" y="1140" text-anchor="middle">cust-1003 replays safely; cust-1004 is dead-lettered; cust-1005 completes the checkpoint at NextIndex=5.</text>
</svg>
