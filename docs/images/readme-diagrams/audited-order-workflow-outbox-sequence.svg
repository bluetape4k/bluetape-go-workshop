<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1825" viewBox="0 0 1600 1825" role="img" aria-labelledby="title desc">
  <title id="title">Audited order workflow commit, delivery, replay, and history sequence</title>
  <desc id="desc">A strict JSON order command writes the order, immutable audit history, and SQL outbox in one transaction. A supervised relay publishes to Redis after commit. Repeated commands return the original projection without new writes, and history queries read PostgreSQL without Redis.</desc>
  <defs>
    <style>
      @font-face { font-family: 'Architects Daughter'; src: url('file:///Users/debop/Library/Fonts/ArchitectsDaughter-Regular.ttf') format('truetype'); }
      @font-face { font-family: 'Comic Mono'; src: url('file:///Users/debop/Library/Fonts/ComicMono.ttf') format('truetype'); }
      .frame { fill: #fbfaf6; stroke: #78909c; stroke-width: 2.5; }
      .phase { fill: none; stroke: #a9bcc7; stroke-width: 2; stroke-dasharray: 9 7; }
      .replay { fill: #f4ecf7; fill-opacity: .13; stroke: #8a5ca8; stroke-width: 2.5; stroke-dasharray: 9 7; }
      .history { fill: #e7f7f5; fill-opacity: .14; stroke: #2f8f89; stroke-width: 2.5; stroke-dasharray: 9 7; }
      .title { font-family: 'Architects Daughter', 'Comic Sans MS', sans-serif; font-size: 36px; fill: #203240; }
      .subtitle { font-family: 'Comic Mono', monospace; font-size: 15px; fill: #536d7d; }
      .participant { font-family: 'Architects Daughter', 'Comic Sans MS', sans-serif; font-size: 20px; fill: #203240; }
      .role { font-family: 'Comic Mono', monospace; font-size: 12px; fill: #536d7d; }
      .phase-title { font-family: 'Comic Mono', monospace; font-size: 13px; font-weight: 700; fill: #47616f; }
      .detail, .num { font-family: 'Comic Mono', monospace; font-size: 12px; fill: #344b59; }
      .num { font-weight: 700; }
      .note { font-family: 'Comic Mono', monospace; font-size: 13px; fill: #5d4a68; }
      .card { fill: #ffffff; stroke: #607d8d; stroke-width: 2; }
      .card.http-card { fill: #eef5fb; stroke: #4d75a3; }
      .card.service-card { fill: #eef2ff; stroke: #6579b8; }
      .card.sql-card { fill: #edf7ea; stroke: #6f9b62; }
      .card.relay-card { fill: #fff7e3; stroke: #b98b2f; }
      .card.redis-card { fill: #fff1f1; stroke: #c76a6a; }
      .lifeline { stroke: #9aadb8; stroke-width: 2; stroke-dasharray: 8 8; }
      .activation { fill: #fffaf0; stroke: #aa8d5a; stroke-width: 1.5; }
      .pill { fill: #fffefd; stroke-width: 1.3; }
      .pill.blue { stroke: #78a7c0; }
      .pill.green { stroke: #83aa78; }
      .pill.amber { stroke: #c59a5a; }
      .pill.red { stroke: #cf7a7a; }
      .pill.purple { stroke: #aa83bb; }
      .pill.teal { stroke: #63aaa4; }
      .badge { stroke-width: 1.3; }
      .badge.blue { fill: #eef6fa; stroke: #78a7c0; }
      .badge.green { fill: #eef7f0; stroke: #83aa78; }
      .badge.amber { fill: #fff7e8; stroke: #c59a5a; }
      .badge.red { fill: #fff1f1; stroke: #cf7a7a; }
      .badge.purple { fill: #f4ecf7; stroke: #aa83bb; }
      .badge.teal { fill: #e7f7f5; stroke: #63aaa4; }
      .num.blue { fill: #3e7b9f; }
      .num.green { fill: #4f8b63; }
      .num.amber { fill: #b07a35; }
      .num.red { fill: #bd4b4b; }
      .num.purple { fill: #8a5ca8; }
      .num.teal { fill: #2f8f89; }
      .http, .sql, .sqlReturn, .relay, .redis, .redisReturn, .replayCall, .historyCall, .historyReturn { fill: none; stroke-width: 3.5; stroke-linecap: round; }
      .http { stroke: #3e7b9f; marker-end: url(#seq-blue); }
      .sql { stroke: #4f8b63; marker-end: url(#seq-green); }
      .sqlReturn { stroke: #4f8b63; stroke-dasharray: 7 6; marker-end: url(#seq-green); }
      .relay { stroke: #b07a35; marker-end: url(#seq-amber); }
      .redis { stroke: #bd4b4b; marker-end: url(#seq-red); }
      .redisReturn { stroke: #bd4b4b; stroke-dasharray: 7 6; marker-end: url(#seq-red); }
      .replayCall { stroke: #8a5ca8; marker-end: url(#seq-purple); }
      .historyCall { stroke: #2f8f89; marker-end: url(#seq-teal); }
      .historyReturn { stroke: #2f8f89; stroke-dasharray: 7 6; marker-end: url(#seq-teal); }
    </style>
    <marker id="seq-blue" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#3e7b9f" stroke="#3e7b9f" stroke-dasharray="none"/>
    </marker>
    <marker id="seq-green" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4f8b63" stroke="#4f8b63" stroke-dasharray="none"/>
    </marker>
    <marker id="seq-amber" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#b07a35" stroke="#b07a35" stroke-dasharray="none"/>
    </marker>
    <marker id="seq-red" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#bd4b4b" stroke="#bd4b4b" stroke-dasharray="none"/>
    </marker>
    <marker id="seq-purple" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#8a5ca8" stroke="#8a5ca8" stroke-dasharray="none"/>
    </marker>
    <marker id="seq-teal" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2f8f89" stroke="#2f8f89" stroke-dasharray="none"/>
    </marker>
  </defs>

  <rect class="frame" x="20" y="20" width="1560" height="1785" rx="22"/>
  <text class="title" x="800" y="62" text-anchor="middle">Commit audit facts first; deliver the event after</text>
  <text class="subtitle" x="800" y="92" text-anchor="middle">Time flows downward. Replay is read-only; history never depends on Redis.</text>

  <rect class="card" x="25" y="120" width="190" height="82" rx="12"/>
  <text class="participant" x="120" y="153" text-anchor="middle">HTTP Client</text>
  <text class="role" x="120" y="178" text-anchor="middle">curl / requests.http</text>

  <rect class="card http-card" x="265" y="120" width="190" height="82" rx="12"/>
  <text class="participant" x="360" y="153" text-anchor="middle">Gin HTTP</text>
  <text class="role" x="360" y="178" text-anchor="middle">strict JSON + deadline</text>

  <rect class="card service-card" x="525" y="120" width="190" height="82" rx="12"/>
  <text class="participant" x="620" y="153" text-anchor="middle">Order Service</text>
  <text class="role" x="620" y="178" text-anchor="middle">workflow + replay</text>

  <rect class="card sql-card" x="805" y="120" width="190" height="82" rx="12"/>
  <text class="participant" x="900" y="153" text-anchor="middle">PostgreSQL</text>
  <text class="role" x="900" y="178" text-anchor="middle">order + history + outbox</text>

  <rect class="card relay-card" x="1085" y="120" width="190" height="82" rx="12"/>
  <text class="participant" x="1180" y="153" text-anchor="middle">sqloutbox.Relay</text>
  <text class="role" x="1180" y="178" text-anchor="middle">supervised worker</text>

  <rect class="card redis-card" x="1365" y="120" width="190" height="82" rx="12"/>
  <text class="participant" x="1460" y="153" text-anchor="middle">Redis Stream</text>
  <text class="role" x="1460" y="178" text-anchor="middle">at-least-once transport</text>

  <line class="lifeline" x1="120" y1="202" x2="120" y2="1760"/>
  <line class="lifeline" x1="360" y1="202" x2="360" y2="1760"/>
  <line class="lifeline" x1="620" y1="202" x2="620" y2="1760"/>
  <line class="lifeline" x1="900" y1="202" x2="900" y2="1760"/>
  <line class="lifeline" x1="1180" y1="202" x2="1180" y2="1760"/>
  <line class="lifeline" x1="1460" y1="202" x2="1460" y2="1760"/>

  <rect class="phase" x="42" y="225" width="1516" height="545" rx="16"/>
  <text class="phase-title" x="62" y="249">COMMAND: ONE SQL TRANSACTION</text>
  <rect class="phase" x="42" y="785" width="1516" height="355" rx="16"/>
  <text class="phase-title" x="62" y="809">AFTER COMMIT: SUPERVISED DELIVERY</text>
  <rect class="replay alt" x="42" y="1155" width="1516" height="295" rx="16"/>
  <text class="phase-title" x="62" y="1179">alt same command identity: canonical replay, no new SQL writes</text>
  <rect class="history" x="42" y="1465" width="1516" height="295" rx="16"/>
  <text class="phase-title" x="62" y="1489">AUDIT QUERY: POSTGRESQL ONLY</text>

  <rect class="activation" x="354" y="295" width="12" height="420" rx="5"/>
  <rect class="activation" x="614" y="345" width="12" height="320" rx="5"/>
  <rect class="activation" x="894" y="395" width="12" height="220" rx="5"/>
  <rect class="activation" x="1174" y="845" width="12" height="240" rx="5"/>
  <rect class="activation" x="894" y="865" width="12" height="220" rx="5"/>
  <rect class="activation" x="1454" y="965" width="12" height="70" rx="5"/>
  <rect class="activation" x="354" y="1230" width="12" height="170" rx="5"/>
  <rect class="activation" x="614" y="1280" width="12" height="70" rx="5"/>
  <rect class="activation" x="354" y="1540" width="12" height="170" rx="5"/>
  <rect class="activation" x="894" y="1590" width="12" height="70" rx="5"/>

  <path class="http connector" data-message="post-order" d="M120 305 H354"/>
  <rect class="pill blue" x="142" y="261" width="190" height="34" rx="17"/>
  <circle class="badge blue" cx="161" cy="278" r="13"/>
  <text class="num blue" x="161" y="278" text-anchor="middle" dominant-baseline="middle">1</text><text class="detail" x="184" y="278" dominant-baseline="middle">POST /orders JSON</text>

  <path class="http connector" data-message="validate" d="M366 355 H614"/>
  <rect class="pill blue" x="382" y="311" width="216" height="34" rx="17"/>
  <circle class="badge blue" cx="401" cy="328" r="13"/>
  <text class="num blue" x="401" y="328" text-anchor="middle" dominant-baseline="middle">2</text><text class="detail" x="424" y="328" dominant-baseline="middle">validate + 2s deadline</text>

  <path class="sql connector" data-message="begin-lock" d="M626 405 H894"/>
  <rect class="pill green" x="644" y="361" width="232" height="34" rx="17"/>
  <circle class="badge green" cx="663" cy="378" r="13"/>
  <text class="num green" x="663" y="378" text-anchor="middle" dominant-baseline="middle">3</text><text class="detail" x="686" y="378" dominant-baseline="middle">BEGIN + lock projection</text>

  <path class="sql connector" data-message="write-order" d="M626 455 H894"/>
  <rect class="pill green" x="656" y="411" width="208" height="34" rx="17"/>
  <circle class="badge green" cx="675" cy="428" r="13"/>
  <text class="num green" x="675" y="428" text-anchor="middle" dominant-baseline="middle">4</text><text class="detail" x="698" y="428" dominant-baseline="middle">write order revision</text>

  <path class="sql connector" data-message="write-history" d="M626 505 H894"/>
  <rect class="pill green" x="646" y="461" width="228" height="34" rx="17"/>
  <circle class="badge green" cx="665" cy="478" r="13"/>
  <text class="num green" x="665" y="478" text-anchor="middle" dominant-baseline="middle">5</text><text class="detail" x="688" y="478" dominant-baseline="middle">insert immutable history</text>

  <path class="sql connector" data-message="enqueue-outbox" d="M626 555 H894"/>
  <rect class="pill green" x="658" y="511" width="204" height="34" rx="17"/>
  <circle class="badge green" cx="677" cy="528" r="13"/>
  <text class="num green" x="677" y="528" text-anchor="middle" dominant-baseline="middle">6</text><text class="detail" x="700" y="528" dominant-baseline="middle">enqueue SQL outbox</text>

  <path class="sqlReturn connector" data-message="commit" d="M894 605 H626"/>
  <rect class="pill green" x="676" y="561" width="168" height="34" rx="17"/>
  <circle class="badge green" cx="695" cy="578" r="13"/>
  <text class="num green" x="695" y="578" text-anchor="middle" dominant-baseline="middle">7</text><text class="detail" x="718" y="578" dominant-baseline="middle">COMMIT all three</text>

  <path class="http connector" data-message="projection" d="M614 655 H366"/>
  <rect class="pill blue" x="394" y="611" width="192" height="34" rx="17"/>
  <circle class="badge blue" cx="413" cy="628" r="13"/>
  <text class="num blue" x="413" y="628" text-anchor="middle" dominant-baseline="middle">8</text><text class="detail" x="436" y="628" dominant-baseline="middle">created projection</text>

  <path class="http connector" data-message="created-response" d="M354 705 H120"/>
  <rect class="pill blue" x="154" y="661" width="166" height="34" rx="17"/>
  <circle class="badge blue" cx="173" cy="678" r="13"/>
  <text class="num blue" x="173" y="678" text-anchor="middle" dominant-baseline="middle">9</text><text class="detail" x="196" y="678" dominant-baseline="middle">201 Created</text>
  <text class="note" x="800" y="745" text-anchor="middle">The HTTP response does not wait for Redis; rollback removes order, history, and outbox together.</text>

  <path class="relay connector" data-message="claim" d="M1174 875 H906"/>
  <rect class="pill amber" x="938" y="831" width="204" height="34" rx="17"/>
  <circle class="badge amber" cx="957" cy="848" r="13"/>
  <text class="num amber" x="957" y="848" text-anchor="middle" dominant-baseline="middle">10</text><text class="detail" x="984" y="848" dominant-baseline="middle">claim pending entry</text>

  <path class="sqlReturn connector" data-message="claimed-entry" d="M906 925 H1174"/>
  <rect class="pill green" x="940" y="881" width="200" height="34" rx="17"/>
  <circle class="badge green" cx="959" cy="898" r="13"/>
  <text class="num green" x="959" y="898" text-anchor="middle" dominant-baseline="middle">11</text><text class="detail" x="986" y="898" dominant-baseline="middle">leased outbox row</text>

  <path class="redis connector" data-message="xadd" d="M1186 975 H1454"/>
  <rect class="pill red" x="1214" y="931" width="212" height="34" rx="17"/>
  <circle class="badge red" cx="1233" cy="948" r="13"/>
  <text class="num red" x="1233" y="948" text-anchor="middle" dominant-baseline="middle">12</text><text class="detail" x="1260" y="948" dominant-baseline="middle">XADD stable event_id</text>

  <path class="redisReturn connector" data-message="xadd-success" d="M1454 1025 H1186"/>
  <rect class="pill red" x="1234" y="981" width="172" height="34" rx="17"/>
  <circle class="badge red" cx="1253" cy="998" r="13"/>
  <text class="num red" x="1253" y="998" text-anchor="middle" dominant-baseline="middle">13</text><text class="detail" x="1280" y="998" dominant-baseline="middle">XADD success</text>

  <path class="relay connector" data-message="mark-published" d="M1174 1075 H906"/>
  <rect class="pill amber" x="938" y="1031" width="204" height="34" rx="17"/>
  <circle class="badge amber" cx="957" cy="1048" r="13"/>
  <text class="num amber" x="957" y="1048" text-anchor="middle" dominant-baseline="middle">14</text><text class="detail" x="984" y="1048" dominant-baseline="middle">mark published in SQL</text>
  <text class="note" x="800" y="1120" text-anchor="middle">Delivery is at-least-once; consumers deduplicate with event_id and idempotency_key.</text>

  <path class="replayCall connector" data-message="repeat-command" d="M120 1240 H354"/>
  <rect class="pill purple" x="140" y="1196" width="194" height="34" rx="17"/>
  <circle class="badge purple" cx="159" cy="1213" r="13"/>
  <text class="num purple" x="159" y="1213" text-anchor="middle" dominant-baseline="middle">15</text><text class="detail" x="186" y="1213" dominant-baseline="middle">same command identity</text>

  <path class="replayCall connector" data-message="canonical-replay" d="M366 1290 H614"/>
  <rect class="pill purple" x="390" y="1246" width="200" height="34" rx="17"/>
  <circle class="badge purple" cx="409" cy="1263" r="13"/>
  <text class="num purple" x="409" y="1263" text-anchor="middle" dominant-baseline="middle">16</text><text class="detail" x="436" y="1263" dominant-baseline="middle">canonical replay lookup</text>

  <path class="replayCall connector" data-message="original-projection" d="M614 1340 H366"/>
  <rect class="pill purple" x="390" y="1296" width="200" height="34" rx="17"/>
  <circle class="badge purple" cx="409" cy="1313" r="13"/>
  <text class="num purple" x="409" y="1313" text-anchor="middle" dominant-baseline="middle">17</text><text class="detail" x="436" y="1313" dominant-baseline="middle">original projection</text>

  <path class="replayCall connector" data-message="replay-response" d="M354 1390 H120"/>
  <rect class="pill purple" x="146" y="1346" width="182" height="34" rx="17"/>
  <circle class="badge purple" cx="165" cy="1363" r="13"/>
  <text class="num purple" x="165" y="1363" text-anchor="middle" dominant-baseline="middle">18</text><text class="detail" x="192" y="1363" dominant-baseline="middle">200 replayed=true</text>
  <text class="note" x="800" y="1430" text-anchor="middle">No order revision, history row, outbox entry, or Redis event is added.</text>

  <path class="historyCall connector" data-message="history-search" d="M120 1550 H354"/>
  <rect class="pill teal" x="138" y="1506" width="198" height="34" rx="17"/>
  <circle class="badge teal" cx="157" cy="1523" r="13"/>
  <text class="num teal" x="157" y="1523" text-anchor="middle" dominant-baseline="middle">19</text><text class="detail" x="184" y="1523" dominant-baseline="middle">POST /history/search</text>

  <path class="historyCall connector" data-message="history-reader" d="M366 1600 H894"/>
  <rect class="pill teal" x="516" y="1556" width="228" height="34" rx="17"/>
  <circle class="badge teal" cx="535" cy="1573" r="13"/>
  <text class="num teal" x="535" y="1573" text-anchor="middle" dominant-baseline="middle">20</text><text class="detail" x="562" y="1573" dominant-baseline="middle">HistoryReader query SQL</text>

  <path class="historyReturn connector" data-message="history-page" d="M894 1650 H366"/>
  <rect class="pill teal" x="526" y="1606" width="208" height="34" rx="17"/>
  <circle class="badge teal" cx="545" cy="1623" r="13"/>
  <text class="num teal" x="545" y="1623" text-anchor="middle" dominant-baseline="middle">21</text><text class="detail" x="572" y="1623" dominant-baseline="middle">entries + next cursor</text>

  <path class="historyCall connector" data-message="history-response" d="M354 1700 H120"/>
  <rect class="pill teal" x="150" y="1656" width="174" height="34" rx="17"/>
  <circle class="badge teal" cx="169" cy="1673" r="13"/>
  <text class="num teal" x="169" y="1673" text-anchor="middle" dominant-baseline="middle">22</text><text class="detail" x="196" y="1673" dominant-baseline="middle">200 history page</text>
  <text class="note" x="800" y="1740" text-anchor="middle">Redis can be unavailable while durable audit history remains queryable from PostgreSQL.</text>

  <text class="subtitle" x="800" y="1790" text-anchor="middle">POST JSON supports metadata without URL length limits; SQL remains the audit source of truth.</text>
</svg>
