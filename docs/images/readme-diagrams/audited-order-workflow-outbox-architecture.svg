<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">Audited order workflow architecture</title>
  <desc id="description">Gin command and audit query routes use a transactional order service, PostgreSQL order history and outbox tables, a supervised relay, and Redis Streams.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#334155" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" viewBox="0 0 14 14" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 1 L 12 7 L 0 13 Z" fill="#3b6f9f" stroke-dasharray="none"/>
    </marker>
    <marker id="arrow-green" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" viewBox="0 0 14 14" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 1 L 12 7 L 0 13 Z" fill="#4f8a5b" stroke-dasharray="none"/>
    </marker>
    <marker id="arrow-teal" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" viewBox="0 0 14 14" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 1 L 12 7 L 0 13 Z" fill="#2f8f89" stroke-dasharray="none"/>
    </marker>
    <marker id="arrow-amber" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" viewBox="0 0 14 14" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 1 L 12 7 L 0 13 Z" fill="#b7791f" stroke-dasharray="none"/>
    </marker>
    <marker id="arrow-red" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" viewBox="0 0 14 14" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 1 L 12 7 L 0 13 Z" fill="#bd4b4b" stroke-dasharray="none"/>
    </marker>
    <style>
      .title { font-family: 'Architects Daughter', cursive; font-size: 48px; fill: #203746; }
      .subtitle, .small, .legend { font-family: 'Comic Mono', monospace; fill: #526579; }
      .subtitle { font-size: 20px; }
      .region-title { font-family: 'Architects Daughter', cursive; font-size: 27px; fill: #29465b; }
      .card-title { font-family: 'Architects Daughter', cursive; font-size: 25px; fill: #213547; }
      .small { font-size: 17px; }
      .label { font-family: 'Comic Mono', monospace; font-size: 15px; font-weight: 700; }
      .region { stroke-width: 2.5; stroke-dasharray: 9 7; }
      .card { stroke-width: 3; filter: url(#shadow); }
      .connector { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect x="20" y="20" width="1560" height="960" rx="28" fill="#fffdf8" stroke="#c9d8e4" stroke-width="2"/>
  <text x="70" y="82" class="title">Audit state in SQL, delivery after commit</text>
  <text x="72" y="118" class="subtitle">Commands commit order + immutable history + outbox atomically; audit queries bypass Redis.</text>

  <rect x="55" y="160" width="900" height="720" rx="24" fill="#f3f8fc" stroke="#9db8cb" class="region"/>
  <text x="82" y="202" class="region-title">Application process</text>
  <rect x="980" y="160" width="310" height="720" rx="24" fill="#f4f9f1" stroke="#98b789" class="region"/>
  <text x="1007" y="202" class="region-title">PostgreSQL state</text>
  <rect x="1315" y="160" width="230" height="720" rx="24" fill="#fff4f3" stroke="#d99b9b" class="region"/>
  <text x="1342" y="202" class="region-title">Redis transport</text>

  <g data-card="command-routes">
    <rect x="90" y="245" width="245" height="155" rx="18" fill="#ffffff" stroke="#648198" class="card"/>
    <text x="212" y="286" text-anchor="middle" class="card-title">Command routes</text>
    <text x="115" y="323" class="small">POST /orders</text>
    <text x="115" y="352" class="small">POST /orders/transitions</text>
    <text x="115" y="381" class="small">strict JSON + 2s deadline</text>
  </g>
  <g data-card="service">
    <rect x="405" y="245" width="225" height="155" rx="18" fill="#eef2ff" stroke="#6678b8" class="card"/>
    <text x="518" y="286" text-anchor="middle" class="card-title">Order Service</text>
    <text x="430" y="323" class="small">validate command</text>
    <text x="430" y="352" class="small">lock + state machine</text>
    <text x="430" y="381" class="small">canonical replay</text>
  </g>
  <g data-card="transaction">
    <rect x="700" y="225" width="215" height="195" rx="18" fill="#edf8f3" stroke="#4f8067" class="card"/>
    <text x="808" y="268" text-anchor="middle" class="card-title">sqlkit.WithTx</text>
    <text x="725" y="306" class="small">1. write order</text>
    <text x="725" y="336" class="small">2. insert history</text>
    <text x="725" y="366" class="small">3. enqueue outbox</text>
    <line x1="725" y1="386" x2="890" y2="386" stroke="#8bb09a" stroke-width="2"/>
    <text x="808" y="410" text-anchor="middle" class="small">commit or rollback all</text>
  </g>

  <g data-card="query-routes">
    <rect x="90" y="485" width="245" height="155" rx="18" fill="#eefaf9" stroke="#438f8a" class="card"/>
    <text x="212" y="526" text-anchor="middle" class="card-title">Audit query routes</text>
    <text x="115" y="563" class="small">POST /history/search</text>
    <text x="115" y="592" class="small">POST /history/detail</text>
    <text x="115" y="621" class="small">bounded HistoryReader</text>
  </g>

  <g data-card="runtime">
    <rect x="90" y="720" width="245" height="125" rx="18" fill="#fff8e6" stroke="#b49342" class="card"/>
    <text x="212" y="762" text-anchor="middle" class="card-title">Runtime owner</text>
    <text x="115" y="799" class="small">bounded clients + health</text>
    <text x="115" y="828" class="small">shutdown + relay join</text>
  </g>
  <g data-card="relay">
    <rect x="405" y="720" width="225" height="125" rx="18" fill="#edf5fb" stroke="#4e78a3" class="card"/>
    <text x="518" y="762" text-anchor="middle" class="card-title">sqloutbox.Relay</text>
    <text x="430" y="799" class="small">claim 16 / attempts 3</text>
    <text x="430" y="828" class="small">retry 250ms / lease</text>
  </g>
  <g data-card="publisher">
    <rect x="700" y="720" width="215" height="125" rx="18" fill="#fff0ef" stroke="#bd5757" class="card"/>
    <text x="808" y="762" text-anchor="middle" class="card-title">redisstreams</text>
    <text x="725" y="799" class="small">released publisher</text>
    <text x="725" y="828" class="small">13 fields / one XADD</text>
  </g>

  <g data-card="orders-table">
    <rect x="1020" y="235" width="230" height="120" rx="18" fill="#ffffff" stroke="#6b985d" class="card"/>
    <text x="1135" y="279" text-anchor="middle" class="card-title">Orders table</text>
    <text x="1045" y="316" class="small">status + revision</text>
    <text x="1045" y="341" class="small">current projection</text>
  </g>
  <g data-card="history-table">
    <rect x="1020" y="485" width="230" height="140" rx="18" fill="#ffffff" stroke="#438f8a" class="card"/>
    <text x="1135" y="529" text-anchor="middle" class="card-title">Audit history</text>
    <text x="1045" y="566" class="small">immutable revisions</text>
    <text x="1045" y="595" class="small">canonical intent + order</text>
    <text x="1045" y="616" class="small">query source</text>
  </g>
  <g data-card="outbox-table">
    <rect x="1020" y="720" width="230" height="125" rx="18" fill="#f5faef" stroke="#6b985d" class="card"/>
    <text x="1135" y="762" text-anchor="middle" class="card-title">SQL outbox</text>
    <text x="1045" y="799" class="small">pending / claimed</text>
    <text x="1045" y="828" class="small">published / dead letter</text>
  </g>
  <g data-card="redis-stream">
    <rect x="1345" y="720" width="170" height="125" rx="18" fill="#ffe9e7" stroke="#bd4b4b" class="card"/>
    <text x="1430" y="762" text-anchor="middle" class="card-title">Redis Stream</text>
    <text x="1370" y="799" class="small">at-least-once</text>
    <text x="1370" y="828" class="small">consumer dedupe</text>
  </g>

  <path d="M 335 322 H 405" stroke="#3b6f9f" marker-end="url(#arrow-blue)" class="connector" data-connector="command"/>
  <text x="364" y="305" text-anchor="middle" class="label" fill="#3b6f9f">command</text>
  <path d="M 630 322 H 700" stroke="#3b6f9f" marker-end="url(#arrow-blue)" class="connector" data-connector="transaction"/>
  <text x="659" y="305" text-anchor="middle" class="label" fill="#3b6f9f">one tx</text>

  <path d="M 915 282 H 1020" stroke="#4f8a5b" marker-end="url(#arrow-green)" class="connector" data-connector="write-orders"/>
  <path d="M 835 420 V 429 Q 835 446 852 446 H 1118 Q 1135 446 1135 463 V 485" stroke="#4f8a5b" marker-end="url(#arrow-green)" class="connector" data-connector="write-history"/>
  <path d="M 915 362 H 1273 Q 1290 362 1290 379 V 766 Q 1290 783 1273 783 H 1250" stroke="#4f8a5b" marker-end="url(#arrow-green)" class="connector" data-connector="write-outbox"/>

  <path d="M 335 562 H 1020" stroke="#2f8f89" marker-end="url(#arrow-teal)" class="connector" data-connector="history-query"/>
  <text x="670" y="546" text-anchor="middle" class="label" fill="#2f8f89">HistoryReader — no Redis dependency</text>

  <path d="M 335 783 H 405" stroke="#b7791f" marker-end="url(#arrow-amber)" class="connector" data-connector="supervise"/>
  <text x="364" y="766" text-anchor="middle" class="label" fill="#b7791f">supervise</text>
  <path d="M 518 720 V 681 Q 518 664 535 664 H 970 Q 987 664 987 681 V 766 Q 987 783 1004 783 H 1020" stroke="#3b6f9f" marker-end="url(#arrow-blue)" class="connector" data-connector="claim"/>
  <text x="754" y="648" text-anchor="middle" class="label" fill="#3b6f9f">claim + mark outcome in SQL</text>
  <path d="M 630 783 H 700" stroke="#b7791f" marker-end="url(#arrow-amber)" class="connector" data-connector="publish"/>
  <path d="M 850 845 V 864 Q 850 881 867 881 H 1285 Q 1302 881 1302 864 V 800 Q 1302 783 1319 783 H 1345" stroke="#bd4b4b" marker-end="url(#arrow-red)" class="connector" data-connector="xadd"/>
  <text x="1110" y="906" text-anchor="middle" class="label" fill="#bd4b4b">XADD after PostgreSQL commit</text>

  <g class="legend">
    <line x1="95" y1="930" x2="135" y2="930" stroke="#3b6f9f" stroke-width="4" marker-end="url(#arrow-blue)"/>
    <text x="148" y="936" font-size="15">command / claim</text>
    <line x1="325" y1="930" x2="365" y2="930" stroke="#4f8a5b" stroke-width="4" marker-end="url(#arrow-green)"/>
    <text x="378" y="936" font-size="15">same SQL transaction</text>
    <line x1="605" y1="930" x2="645" y2="930" stroke="#2f8f89" stroke-width="4" marker-end="url(#arrow-teal)"/>
    <text x="658" y="936" font-size="15">history query</text>
    <line x1="835" y1="930" x2="875" y2="930" stroke="#bd4b4b" stroke-width="4" marker-end="url(#arrow-red)"/>
    <text x="888" y="936" font-size="15">asynchronous transport</text>
  </g>
</svg>
