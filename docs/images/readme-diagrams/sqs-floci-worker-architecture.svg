<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc">
  <title id="title">SQS Floci worker architecture</title>
  <desc id="desc">Application boundary owns task payloads, acknowledgement and retry decisions; SQS client and Floci endpoint remain outside the worker boundary.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Architects+Daughter&amp;family=Comic+Mono:wght@400;700&amp;display=swap');
      .title{font-family:'Architects Daughter','Comic Mono',sans-serif;font-size:48px;fill:#172033}
      .subtitle,.label,.small,.footer{font-family:'Comic Mono','Architects Daughter',monospace;fill:#4b5568}
      .subtitle{font-size:21px}.label{font-size:24px}.small{font-size:18px}.footer{font-size:18px}
      .layer{fill:#eef6ff;stroke:#b8d5ff;stroke-width:3}.worker{fill:#ecfdf5;stroke:#86efac;stroke-width:3}
      .aws{fill:#fff7ed;stroke:#fed7aa;stroke-width:3}.card{fill:#fff;stroke:#cbd5e1;stroke-width:3}
      .blue{fill:#dbeafe;stroke:#93c5fd}.green{fill:#dcfce7;stroke:#22c55e}.yellow{fill:#fef3c7;stroke:#f59e0b}
      .red{fill:#fee2e2;stroke:#f87171}.purple{fill:#f3e8ff;stroke:#c084fc}
      .arrow{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:5}
    </style>
    <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 14 7 L 0 14 Z" fill="#2563eb" stroke="#2563eb" stroke-dasharray="none"/>
    </marker>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 14 7 L 0 14 Z" fill="#059669" stroke="#059669" stroke-dasharray="none"/>
    </marker>
    <marker id="arrow-red" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 14 7 L 0 14 Z" fill="#dc2626" stroke="#dc2626" stroke-dasharray="none"/>
    </marker>
  </defs>

  <rect width="1800" height="1080" fill="#f8fafc"/>
  <text x="90" y="86" class="title">SQS Floci fulfillment worker</text>
  <text x="90" y="128" class="subtitle">TaskQueue owns payload, idempotency metadata, ack, and retry visibility; callers still own AWS SDK clients and infrastructure.</text>

  <rect x="70" y="180" width="1660" height="300" rx="26" class="layer"/>
  <text x="110" y="230" class="label">Application decision boundary</text>
  <rect x="130" y="290" width="330" height="110" rx="16" class="blue"/>
  <text x="170" y="342" class="label">Checkout flow</text>
  <text x="170" y="378" class="small">creates fulfillment task</text>
  <rect x="580" y="290" width="370" height="110" rx="16" class="card"/>
  <text x="620" y="342" class="label">TaskQueue API</text>
  <text x="620" y="378" class="small">Enqueue / PollOnce</text>
  <rect x="1090" y="290" width="420" height="110" rx="16" class="yellow"/>
  <text x="1130" y="342" class="label">Handler boundary</text>
  <text x="1130" y="378" class="small">idempotent side effect</text>

  <rect x="70" y="540" width="820" height="360" rx="26" class="worker"/>
  <text x="110" y="590" class="label">Worker contract</text>
  <rect x="130" y="650" width="310" height="110" rx="16" class="green"/>
  <text x="170" y="696" class="label">Payload mapper</text>
  <text x="170" y="732" class="small">JSON + attributes</text>
  <rect x="520" y="650" width="310" height="110" rx="16" class="green"/>
  <text x="560" y="696" class="label">Ack mapper</text>
  <text x="560" y="732" class="small">success -> DeleteMessage</text>
  <rect x="325" y="805" width="310" height="80" rx="16" class="red"/>
  <text x="365" y="853" class="label">failure -> visibility retry</text>

  <rect x="970" y="540" width="760" height="360" rx="26" class="aws"/>
  <text x="1010" y="590" class="label">AWS SDK and local emulator boundary</text>
  <rect x="1030" y="650" width="330" height="130" rx="16" class="purple"/>
  <image x="1070" y="680" width="54" height="54" data-bluetape4k-icon="amazon-sqs-official" href="data:image/svg+xml;base64,"/>
  <text x="1140" y="694" class="label">SQS queue</text>
  <text x="1140" y="730" class="small">fulfillment-tasks</text>
  <rect x="1430" y="650" width="250" height="130" rx="16" class="yellow"/>
  <text x="1470" y="696" class="label">Floci config</text>
  <text x="1470" y="732" class="small">endpoint + test creds</text>
  <rect x="1170" y="820" width="330" height="60" rx="14" class="card"/>
  <text x="1210" y="858" class="small">real AWS IAM and DLQ stay outside example</text>

  <path class="arrow" stroke="#2563eb" marker-end="url(#arrow-blue)" d="M460 345 H575"/>
  <text x="486" y="326" class="small">task intent</text>
  <path class="arrow" stroke="#2563eb" marker-end="url(#arrow-blue)" d="M950 345 H1085"/>
  <text x="1035" y="292" class="small">call handler</text>
  <path class="arrow" stroke="#059669" marker-end="url(#arrow-green)" d="M765 400 V610 Q765 650 725 650 H445"/>
  <text x="475" y="620" class="small">serialize task + attributes</text>
  <path class="arrow" stroke="#059669" marker-end="url(#arrow-green)" d="M830 705 H1025"/>
  <text x="850" y="684" class="small">Send / Receive / Delete</text>
  <path class="arrow" stroke="#059669" marker-end="url(#arrow-green)" d="M440 705 H515"/>
  <path class="arrow" stroke="#dc2626" marker-end="url(#arrow-red)" d="M675 760 V785 Q675 805 655 805 H640"/>
  <text x="690" y="800" class="small">handler error</text>
  <path class="arrow" stroke="#2563eb" marker-end="url(#arrow-blue)" d="M1510 400 V645"/>
  <text x="1530" y="530" class="small">local smoke</text>

  <rect x="220" y="960" width="1360" height="70" rx="16" class="card"/>
  <text x="260" y="1005" class="footer">Reader contract: SQS is at-least-once; handler idempotency is mandatory; delete is the only ack.</text>
</svg>
