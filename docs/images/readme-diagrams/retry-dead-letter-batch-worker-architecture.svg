  <path class="blue" d="M 884 239 L 1112 239"/><text class="label" x="998" y="219" text-anchor="middle">project report</text>
  <path class="blue" d="M 761 280 V 310 Q 761 322 749 322 H 269 Q 257 322 257 334 V 430"/><text class="label" x="502" y="312" text-anchor="middle">read tickets</text>
  <path class="green" d="M 370 470 L 480 470"/><text class="label" x="425" y="450" text-anchor="middle">tickets</text>
  <path class="purple" d="M 734 470 L 854 470"/><text class="label" x="794" y="450" text-anchor="middle">processed</text>
  <path class="purple" d="M 1100 470 L 1194 470"/><text class="label" x="1147" y="450" text-anchor="middle">write</text>
  <path class="blue" d="M 575 522 V 630 Q 575 642 563 642 H 461 Q 449 642 449 654 V 666"/><text class="label" x="514" y="632" text-anchor="middle">transient</text>
  <path class="red" d="M 638 522 V 630 Q 638 642 650 642 H 759 Q 771 642 771 654 V 666"/><text class="label" x="708" y="632" text-anchor="middle">permanent</text>
  <path class="red" d="M 680 522 V 574 Q 680 586 692 586 H 1099 Q 1111 586 1111 598 V 666"/><text class="label" x="908" y="576" text-anchor="middle">record reason + attempts</text>
</svg>
